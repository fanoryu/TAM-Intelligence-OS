function numOrNull(v){ if(v===undefined||v===null||v==='') return null; const n=Number(String(v).replace(',','.')); return isFinite(n)?n:null; }

async function parseUploadedFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const batches = []; // {monthName, monthNum, year, key, categories:[{name,items}], source:'letterdoc'|'generic'}
  const planSheets = {};
  const realSheets = {};

  wb.SheetNames.forEach(name=>{
    const trimmed = name.trim();
    if(/^realisasi\s+/i.test(trimmed)){
      const mn = trimmed.replace(/^realisasi\s+/i,'').trim();
      if(MONTH_NUM[mn]) realSheets[mn] = name;
    } else if(MONTH_NUM[trimmed]){
      planSheets[trimmed] = name;
    }
  });

  const monthNamesFound = new Set([...Object.keys(planSheets), ...Object.keys(realSheets)]);

  if(monthNamesFound.size){
    // v2.5.1 — letterdoc field-source map for the Column Mapping page (fields live in
    // column B row-blocks, not dedicated columns).
    LAST_COLUMN_MAPPING = {source:'letterdoc', recognized:[
      {header:'Uraian Kebutuhan (main row)', meaningLabel:'Employee Name', confidence:'High'},
      {header:'Uraian Kebutuhan (sub-row)', meaningLabel:'Contract Number', confidence:'Medium'},
      {header:'Uraian Kebutuhan (sub-row)', meaningLabel:'Contract Progress (N/M)', confidence:'Medium'},
      {header:'Harga Satuan / Jumlah', meaningLabel:'Salary', confidence:'High'},
      {header:'Rencana Transaksi', meaningLabel:'Transaction Date', confidence:'High'},
      {header:'Bank / Nomor Rekening / Email', meaningLabel:'Payment Details', confidence:'High'},
    ], unrecognized:[]};
    monthNamesFound.forEach(mn=>{
      const rowsPlan = planSheets[mn] ? sheetToRows(wb.Sheets[planSheets[mn]]) : null;
      const rowsReal = realSheets[mn] ? sheetToRows(wb.Sheets[realSheets[mn]]) : null;
      const planParsed = rowsPlan ? parseLetterDocSheet(rowsPlan, planSheets[mn], false) : null;
      const realParsed = rowsReal ? parseLetterDocSheet(rowsReal, realSheets[mn], true) : null;
      if(!planParsed && !realParsed) return;

      const year = (planParsed && planParsed.detectedYear) || (realParsed && realParsed.detectedYear) || new Date().getFullYear();
      const merged = {};
      (planParsed ? planParsed.categories : []).forEach(c=>{
        merged[c.code] = merged[c.code] || {code:c.code, name:c.name, planItems:{}, realItems:{}};
        c.items.forEach(it=>{ merged[c.code].planItems[it.no]=it; });
      });
      (realParsed ? realParsed.categories : []).forEach(c=>{
        merged[c.code] = merged[c.code] || {code:c.code, name:c.name, planItems:{}, realItems:{}};
        c.items.forEach(it=>{ merged[c.code].realItems[it.no]=it; });
      });
      const categories = Object.values(merged).map(c=>{
        const allNo = new Set([...Object.keys(c.planItems), ...Object.keys(c.realItems)]);
        const items = [...allNo].map(no=>{
          const p = c.planItems[no], a = c.realItems[no];
          const base = p||a;
          const struct = p||a; // prefer plan for structured fields, fall back to realisasi
          return {
            no, uraian: base.uraian, vol: base.vol, satuan: base.satuan, hargaSatuan: base.hargaSatuan,
            jumlahRencana: p ? (p.jumlahRencana||0) : 0,
            jumlahRealisasi: a ? a.jumlahRealisasi : null,
            rencanaTransaksi: (p && p.rencanaTransaksi) || (a && a.rencanaTransaksi) || null,
            unplanned: !p,
            // v2.5.1 — carry structured payroll fields through the plan/realisasi merge
            subLines: struct.subLines || [],
            employeeName: struct.employeeName, contractNumber: struct.contractNumber,
            progressCurrent: struct.progressCurrent, progressTotal: struct.progressTotal,
            salary: struct.salary,
            // v2.5.2 — carry bank/email evidence (plan sheet only) for employee matching
            bankName: (p&&p.bankName)||(a&&a.bankName)||null, bankAccount: (p&&p.bankAccount)||(a&&a.bankAccount)||null, email: (p&&p.email)||(a&&a.email)||null,
          };
        });
        return {name:c.name, code:c.code, items};
      });
      batches.push({monthName:mn, monthNum:MONTH_NUM[mn], year, key:`${year}-${String(MONTH_NUM[mn]).padStart(2,'0')}`, categories, source:'letterdoc'});
    });
  } else {
    // try generic tabular parse on first non-empty sheet
    for(const name of wb.SheetNames){
      const rows = sheetToRows(wb.Sheets[name]);
      const items = parseGenericTable(rows);
      if(items){
        // v2.5.1 — stash raw rows so the Column Mapping page can re-parse on manual override
        if(LAST_COLUMN_MAPPING){ LAST_COLUMN_MAPPING.rows = rows; LAST_COLUMN_MAPPING.sheetName = name; }
        groupGenericBatches(items).forEach(g=>batches.push(g));
        break;
      }
    }
  }
  return batches;
}

// v2.5.1 — group generic-table items into month batches (extracted so a manual
// column-mapping override can rebuild batches without re-reading the file).
function groupGenericBatches(items){
  const groups = {};
  (items||[]).forEach(it=>{
    let mn = it.month, year=null, mnum=null;
    if(mn){
      const s = String(mn).trim();
      if(MONTH_NUM[s]){ mnum=MONTH_NUM[s]; year=new Date().getFullYear(); mn=s; }
      else{ const d = new Date(s); if(!isNaN(d)){ mnum=d.getMonth()+1; year=d.getFullYear(); mn=NUM_MONTH[mnum]; } }
    }
    if(!mnum && it.rencanaTransaksi){ const d=new Date(it.rencanaTransaksi); if(!isNaN(d)){ mnum=d.getMonth()+1; year=d.getFullYear(); mn=NUM_MONTH[mnum]; } }
    const key = mnum ? `${year}-${String(mnum).padStart(2,'0')}` : 'unknown';
    if(!groups[key]) groups[key] = {monthName:mn||'Unknown', monthNum:mnum, year, key, categories:{}, source:'generic'};
    const catName = it.category || 'Lainnya';
    if(!groups[key].categories[catName]) groups[key].categories[catName] = {name:catName, code:catName[0]||'X', items:[]};
    groups[key].categories[catName].items.push({
      no: groups[key].categories[catName].items.length+1, uraian:it.uraian, vol:it.vol, satuan:it.satuan,
      hargaSatuan:it.hargaSatuan, jumlahRencana:it.jumlahRencana, jumlahRealisasi:it.jumlahRealisasi,
      rencanaTransaksi:it.rencanaTransaksi, unplanned:false, type: it.type,
      employeeName: it.employeeName, contractNumber: it.contractNumber,
      progressCurrent: it.progressCurrent, progressTotal: it.progressTotal, salary: it.salary,
      workingHoursPerDay: it.workingHoursPerDay, workingDaysPerWeek: it.workingDaysPerWeek,
      overtimeHours: it.overtimeHours, subLines: it.subLines||[],
    });
  });
  return Object.values(groups).map(g=>{ g.categories = Object.values(g.categories); return g; });
}

/* ---------- duplicate detection ---------- */
function detectDuplicates(batch){
  const existingInMonth = txnsForMonth(batch.key);
  const monthAlreadyExists = existingInMonth.length>0;
  const flagged = [];
  batch.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      let dup=null;
      if(monthAlreadyExists){
        dup = existingInMonth.find(t=>t.category===cat.name && similarText(t.uraian, item.uraian)>0.86 &&
          Math.abs((t.planned||0)-(item.jumlahRencana||0)) < Math.max(1000,(t.planned||0)*0.01));
      }
      flagged.push({...item, category:cat.name, isDuplicate: !!dup, dupOf: dup?dup.id:null});
    });
  });
  return {monthAlreadyExists, items:flagged};
}

/* v2.6.3b — shared FLOATING Actions menu (finance + HR menus).
   The dropdown is portaled out of the scrolling table container into #menu-root
   and positioned with position:fixed via getBoundingClientRect(), so it is never
   clipped by a table's overflow. It auto-flips up/down, closes on outside click
   and Escape, and repositions on window resize/scroll. One menu is open at a time.
   Both bindHRActions and bindActionMenus use openFloatingMenu/closeFloatingMenu. */
let __floatMenu = null; // { menu, placeholder, toggle, onDoc, onKey, onReposition, onItem }
function isFloatingMenuOpenFor(toggle){ return !!(__floatMenu && __floatMenu.toggle===toggle); }
function positionFloatingMenu(toggle, menu){
  const b = toggle.getBoundingClientRect();
  const mh = menu.offsetHeight || 0, mw = menu.offsetWidth || 0;
  const vh = window.innerHeight || document.documentElement.clientHeight;
  const vw = window.innerWidth || document.documentElement.clientWidth;
  const spaceBelow = vh - b.bottom;
  const flipUp = spaceBelow < mh + 8 && b.top > spaceBelow; // not enough room below and more room above
  let top = flipUp ? (b.top - mh - 4) : (b.bottom + 4);
  top = Math.max(8, Math.min(top, vh - mh - 8));
  let left = b.right - mw;                 // right-aligned to the toggle
  left = Math.max(8, Math.min(left, vw - mw - 8));
  menu.style.top = top + 'px'; menu.style.left = left + 'px'; menu.style.right = 'auto'; menu.style.bottom = 'auto';
  menu.classList.toggle('up', flipUp);
}
function closeFloatingMenu(){
  const s = __floatMenu; if(!s) return; __floatMenu = null;
  document.removeEventListener('click', s.onDoc, true);
  document.removeEventListener('keydown', s.onKey, true);
  window.removeEventListener('resize', s.onReposition, true);
  window.removeEventListener('scroll', s.onReposition, true);
  s.menu.removeEventListener('click', s.onItem, true);
  s.menu.style.display = 'none';
  s.menu.classList.remove('floating','up');
  s.menu.style.position=''; s.menu.style.top=''; s.menu.style.left=''; s.menu.style.right=''; s.menu.style.bottom='';
  // Restore the menu to its original spot if that spot still exists; otherwise drop it
  // (the table was re-rendered by the action, so a fresh menu already exists).
  if(s.placeholder && s.placeholder.parentNode){ s.placeholder.parentNode.replaceChild(s.menu, s.placeholder); }
  else if(s.menu.parentNode){ s.menu.parentNode.removeChild(s.menu); }
}
function openFloatingMenu(toggle, menu){
  closeFloatingMenu();
  const root = document.getElementById('menu-root') || document.body;
  const placeholder = document.createComment('actions-menu');
  if(menu.parentNode) menu.parentNode.replaceChild(placeholder, menu);
  root.appendChild(menu);
  menu.classList.add('floating');
  menu.style.position = 'fixed';
  menu.style.display = 'block';
  positionFloatingMenu(toggle, menu); // measure + place after it is visible
  const onDoc = (e)=>{ if(!menu.contains(e.target) && toggle!==e.target && !toggle.contains(e.target)) closeFloatingMenu(); };
  const onKey = (e)=>{ if(e.key==='Escape'){ e.stopPropagation(); closeFloatingMenu(); } };
  const onReposition = ()=>{ if(__floatMenu) positionFloatingMenu(toggle, menu); };
  // An item click performs its own action (often re-rendering the table); close after it.
  // Capture phase so it still fires even though item handlers call e.stopPropagation().
  const onItem = (e)=>{ if(e.target.closest('.actions-item,[data-hr-action],[data-action]')) setTimeout(closeFloatingMenu, 0); };
  menu.addEventListener('click', onItem, true);
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('resize', onReposition, true);
  window.addEventListener('scroll', onReposition, true);
  // Defer the outside-click closer so the opening click doesn't immediately close it.
  setTimeout(()=>{ if(__floatMenu && __floatMenu.onDoc===onDoc) document.addEventListener('click', onDoc, true); }, 0);
  __floatMenu = { menu, placeholder, toggle, onDoc, onKey, onReposition, onItem };
}

function isoToday(){ return new Date().toISOString().slice(0,10); }
// A transaction's schedule date, ONLY if it is a real calendar date. Free-text
// values such as "Per minggu", "Akhir bulan", or "-" are treated as missing so
// they never mis-sort into Upcoming/Overdue via raw string comparison (v2.3.1).
function execScheduleDate(t){
  const raw = t.scheduledDate || t.txnDate;
  if(raw && /^\d{4}-\d{2}-\d{2}$/.test(raw) && isValidDate(raw)) return raw;
  return null;
}
// Every pending transaction lands in exactly one bucket. Priority:
// Partial → Unscheduled → Today's Planned → Upcoming → Overdue.
function execBuckets(){
  const today = isoToday();
  const pending = State.txns.filter(t=>t.type!=='income' && ['planned','scheduled','partial'].includes(statusOf(t)));
  const partial = pending.filter(t=>statusOf(t)==='partial');
  const nonPartial = pending.filter(t=>statusOf(t)!=='partial'); // planned/scheduled, not fully executed
  const unscheduled = nonPartial.filter(t=>!execScheduleDate(t));
  const dated = nonPartial.filter(t=>execScheduleDate(t));
  const todaysPlanned = dated.filter(t=>execScheduleDate(t)===today);
  const upcoming = dated.filter(t=>execScheduleDate(t)>today);
  const overdue = dated.filter(t=>execScheduleDate(t)<today);
  const completedToday = State.txns.filter(t=>t.execution && t.execution.executionDate===today && ['completed','archived'].includes(statusOf(t)));
  const recent = State.txns.filter(t=>t.execution && t.execution.ts)
    .sort((a,b)=> new Date(b.execution.ts)-new Date(a.execution.ts)).slice(0,15);
  // Pending Execution = unique records across Unscheduled + Today + Upcoming +
  // Overdue + Partial. These are mutually exclusive partitions of `pending`,
  // so the sum equals pending.length with no double-counting.
  const pendingCount = partial.length + unscheduled.length + todaysPlanned.length + upcoming.length + overdue.length;
  return {todaysPlanned, upcoming, overdue, partial, unscheduled, completedToday, recent, planned:pending, pendingCount};
}
// v2.7.1 (Section 13) — deep-link focus. Which tab bucket currently holds a transaction?
function execBucketKeyForTxn(txnId){
  const b = execBuckets();
  const map = {todaysPlanned:'today', upcoming:'upcoming', overdue:'overdue', unscheduled:'unscheduled', partial:'partial', completedToday:'completedToday', recent:'recent'};
  for(const bk in map){ if((b[bk]||[]).some(t=>t.id===txnId)) return map[bk]; }
  return null;
}
// Navigate to the Execution Center and reveal a specific linked transaction, regardless of
// its date bucket. If it sits in a tab, that tab is opened; otherwise a focus card shows it.
// Missing transactions produce a clear warning instead of a silent generic view.

  const bk = execBucketKeyForTxn(txnId);
  if(bk) State.execFilter = bk;
  State.execFocusTxnId = txnId;
  render();
}

/* ---------- execution engine actions ---------- */
function findTxn(id){ return State.txns.find(t=>t.id===id); }

// Build a fully execution-compatible transaction from an import row.
// Status is derived from planned/actual so historical realized rows are never
// reset to Planned, and missing actuals stay missing (null, not zero).
function buildImportedTxn(it, batch){
  const planned = it.planned||0;
  const actual = (it.actual===undefined) ? null : it.actual; // preserve missing as null
  const unplanned = !!it.unplanned;
  const t = {
    id: uid('import'), monthKey:batch.key, month:batch.monthName, year:batch.year, monthNum:batch.monthNum,
    category: it.category, categoryCode: it.categoryCode, no: it.no,
    uraian: it.uraian, vol: it.vol, satuan: it.satuan, hargaSatuan: it.hargaSatuan,
    planned, actual, type: it.type||'expense', txnDate: it.txnDate||null,
    source:'import', unplanned,
    scheduledDate: null,
    paymentMethod: null, bankAccount: null, referenceNumber: null, notes: null, vendor: null,
    executionId: null, executionTimestamp: null,
    execution: null,
    history: [{event:'created', ts:new Date().toISOString(), note:'Imported from Excel/CSV'}],
  };
  // Derive lifecycle status. planned===0 && actual>0 -> Completed (and stays unplanned).
  if(actual===null || actual===undefined){
    t.status = 'planned';
  } else if(actual > 0 && actual < planned){
    t.status = 'partial';
  } else if(actual >= planned && (planned > 0 || actual > 0)){
    t.status = 'completed';
  } else { // actual <= 0
    t.status = 'planned';
  }
  // For rows that arrive already realized, record the execution + history so the
  // detail timeline and Execution Center reflect that they were executed.
  if(actual!==null && actual!==undefined && actual>0){
    const execId = uid('exec');
    const ts = new Date().toISOString();
    t.execution = {
      executionDate: it.txnDate||null, actualAmount: actual, method:null, bank:null,
      reference:null, notes:'Imported as already realized', executedBy:'—', executionId:execId, ts,
    };
    t.executionId = execId; t.executionTimestamp = ts;
    t.history.push({event:'executed', ts, note:`Imported realized amount ${fmtIDR(actual)}`, amount:actual});
  }
  return t;
}
function pushHistory(t, event, note, extra){
  if(!t.history) t.history = [];
  t.history.push(Object.assign({event, ts:new Date().toISOString(), note:note||null}, extra||{}));
}
async function executeTransaction(id, data){
  const t = findTxn(id); if(!t) return {ok:false, reason:'Transaction not found.'};
  // v2.7.2 — deep snapshot BEFORE mutation so a failed persist rolls back exactly.
  const before = JSON.parse(JSON.stringify(t));
  t.actual = data.actualAmount;
  t.execution = {
    executionDate: data.executionDate||null,
    actualAmount: data.actualAmount,
    method: data.method||null,
    bank: data.bank||null,
    reference: data.reference||null,
    notes: data.notes||null,
    executedBy: '—',
    executionId: uid('exec'),
    ts: new Date().toISOString(),
  };
  if(data.executionDate) t.txnDate = data.executionDate;
  // status logic
  let newStatus;
  if(data.actualAmount<=0) newStatus = 'planned';
  else if(data.actualAmount < (t.planned||0)) newStatus = 'partial';
  else newStatus = 'completed';
  if(newStatus==='completed' && State.settings.autoArchiveCompleted) newStatus='archived';
  t.status = newStatus;
  pushHistory(t, 'executed', `Executed ${fmtIDR(data.actualAmount)}${data.method?' via '+data.method:''}`, {amount:data.actualAmount});
  // v2.7.2 — persist FIRST and check the result. If the write fails, restore the exact
  // original transaction in memory and write NO audit event and touch NO supplemental.
  const saved = await persist();
  if(!saved){
    Object.keys(t).forEach(k=>{ if(!(k in before)) delete t[k]; });
    Object.assign(t, before);
    return {ok:false, reason:'Execution was not saved (storage error) — nothing was changed. Try again; if it persists, export a Complete Backup and free up storage.'};
  }
  // Only after the execution is durably saved: write the audit event.
  logActivity({type:'finance.execute', module:'Finance', entity:t.uraian||t.category||'Transaction', entityId:t.id,
    desc:`Executed ${fmtIDR(data.actualAmount)}${data.method?' via '+data.method:''} — status ${newStatus}`,
    refs:{transactionId:t.id, employeeId:t.employeeId||null, payrollPlanId:t.payrollPlanId||null, monthKey:t.monthKey||null}});
  // v2.7.0/2.7.2 — if this transaction settles a supplemental, close it (Executed). The committed
  // transaction is never rewritten; if the supplemental write fails it stays a detectable state.
  let suppWarning = null;
  if(typeof linkSupplementalExecution==='function'){
    const lr = await linkSupplementalExecution(t);
    if(lr && lr.ok===false) suppWarning = lr.reason;
  }
  return {ok:true, suppWarning};
}
async function scheduleTransaction(id, date){
  const t = findTxn(id); if(!t) return;
  t.status = 'scheduled'; t.scheduledDate = date||null;
  if(date) t.txnDate = date;
  pushHistory(t, 'scheduled', date?`Scheduled for ${date}`:'Scheduled');
  await persist();
}
async function cancelTransaction(id){
  const t = findTxn(id); if(!t) return;
  t.status = 'cancelled';
  pushHistory(t, 'cancelled', 'Transaction cancelled');
  await persist();
}
async function archiveTransaction(id){
  const t = findTxn(id); if(!t) return;
  t.status = 'archived';
  pushHistory(t, 'archived', 'Transaction archived');
  await persist();
}
async function duplicateTransaction(id){
  const t = findTxn(id); if(!t) return;
  const copy = JSON.parse(JSON.stringify(t));
  copy.id = uid('txn');
  copy.actual = null; copy.execution = null; copy.status='planned';
  copy.uraian = t.uraian + ' (copy)';
  copy.source = 'manual';
  copy.history = [{event:'created', ts:new Date().toISOString(), note:'Duplicated from '+t.uraian}];
  State.txns.push(copy);
  await persist();
}
async function saveEditedTransaction(id, fields){
  const t = findTxn(id); if(!t) return;
  Object.assign(t, fields);
  if(!t.status) t.status = computeStatus(t);
  pushHistory(t, 'edited', 'Transaction edited');
  await persist();
}

/* ---------- actions menu ---------- */
// context: 'exec' (Execution Center — full lifecycle actions) or
// 'ledger' (Transactions page — record review only: detail / edit / delete).
// Operational payment actions live exclusively in the Execution Center.
function actionsMenuHTML(t, context){
  const st = statusOf(t);
  const items = [];
  if(context!=='ledger'){
    const canExecute = st!=='cancelled' && t.type!=='income';
    if(canExecute) items.push(['execute','Execute']);
    if(st!=='scheduled' && st!=='completed' && st!=='archived' && st!=='cancelled') items.push(['schedule','Schedule']);
  }
  items.push(['detail','View Detail / History']);
  items.push(['edit','Edit']);
  if(context!=='ledger'){
    items.push(['duplicate','Duplicate']);
    if(st!=='cancelled') items.push(['cancel','Cancel']);
    if(st==='completed') items.push(['archive','Archive']);
  }
  items.push(['delete','Delete']);
  return `<div class="actions-menu">
    <button class="btn btn-sm actions-toggle" data-actions="${t.id}">Actions ▾</button>
    <div class="actions-dropdown" data-menu="${t.id}" style="display:none;">
      ${items.map(([a,l])=>`<button class="actions-item ${a==='delete'?'danger':''}" data-action="${a}" data-id="${t.id}">${l}</button>`).join('')}
    </div>
  </div>`;
}
// Binds the action menus of ONE freshly rendered view. Must be called exactly
// once per render — the render functions do this themselves. Never call it
// again after a render call (that double-binds every listener: toggles cancel
// themselves out and actions fire twice — the v2.1.1 Execution Center bug).
function bindActionMenus(main){
  main.querySelectorAll('[data-actions]').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation();
    // v2.6.3b — shared floating menu (portaled out of the table container, never clipped).
    if(isFloatingMenuOpenFor(btn)){ closeFloatingMenu(); return; }
    const menu = main.querySelector(`[data-menu="${btn.dataset.actions}"]`);
    if(menu) openFloatingMenu(btn, menu);
  }));
  main.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click', async e=>{
    e.stopPropagation();
    main.querySelectorAll('.actions-dropdown').forEach(m=>m.style.display='none');
    const id = btn.dataset.id, action = btn.dataset.action;
    const t = findTxn(id); if(!t) return;
    if(action==='execute'){ openExecuteModal(id); }
    else if(action==='schedule'){ const d = prompt('Payment date (YYYY-MM-DD):', t.txnDate||new Date().toISOString().slice(0,10)); if(d){ await scheduleTransaction(id, d.trim()); toast('Transaction scheduled.'); render(); } }
    else if(action==='detail'){ openDetailModal(id); }
    else if(action==='edit'){ openEditModal(id); }
    else if(action==='duplicate'){ await duplicateTransaction(id); toast('Transaction duplicated.'); render(); }
    else if(action==='cancel'){ if(confirm('Cancel this planned transaction? It will be excluded from budget analytics.')){ await cancelTransaction(id); toast('Transaction cancelled.'); render(); } }
    else if(action==='archive'){ await archiveTransaction(id); toast('Transaction archived.'); render(); }
    else if(action==='delete'){ if(confirm('Delete this transaction permanently? This cannot be undone.')){ State.txns = State.txns.filter(x=>x.id!==id); await persist(); toast('Transaction deleted.'); render(); } }
  }));
  main.querySelectorAll('[data-open-detail]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); openDetailModal(b.dataset.openDetail); }));
}

function txnMatchesSearch(t, s){
  if(!s) return true;
  const hay = [t.uraian, t.category, t.execution&&t.execution.reference, t.execution&&t.execution.notes, t.vendor].map(x=>normStr(x||'')).join(' ');
  return hay.includes(s);
}

/* v2.6.1 — Transactions incremental list. applyTxnFilter updates only the <tbody> and
   the "N of M" count; the search box and every filter select call it so typing keeps
   focus/caret/selection and the ledger keeps its scroll position. */
function txnsFiltered(){
  const f = State.txFilter;
  let rows = State.txns.slice();
  if(f.month!=='all') rows = rows.filter(t=>t.monthKey===f.month);
  if(f.category!=='all') rows = rows.filter(t=>t.category===f.category);
  if(f.type!=='all') rows = rows.filter(t=>t.type===f.type);
  if(f.status!=='all') rows = rows.filter(t=>statusOf(t)===f.status);
  if(f.method!=='all') rows = rows.filter(t=>t.execution&&t.execution.method===f.method);
  if(f.bank!=='all') rows = rows.filter(t=>t.execution&&t.execution.bank===f.bank);
  if(f.budget==='over') rows = rows.filter(t=>t.actual!==null && t.actual!==undefined && t.actual>t.planned);
  if(f.budget==='under') rows = rows.filter(t=>t.actual!==null && t.actual!==undefined && t.actual<t.planned);
  if(f.budget==='pending') rows = rows.filter(t=>t.actual===null||t.actual===undefined);
  if(f.search.trim()){ const s = normStr(f.search); rows = rows.filter(t=>txnMatchesSearch(t, s)); }
  return rows.slice().sort((a,b)=> (b.year-a.year)||(b.monthNum-a.monthNum)|| (String(a.category).localeCompare(String(b.category))));
}
function applyTxnFilter(main){
  const tb = document.getElementById('txnRows'); if(!tb) return;
  const rows = txnsFiltered();
  tb.innerHTML = rows.map(rowToTr).join('') || '<tr><td colspan="8" class="empty">No transactions match these filters</td></tr>';
  const c = document.getElementById('txnCount'); if(c) c.textContent = rows.length;
  bindActionMenus(main);
}

function rowToTr(t){
  const st = statusOf(t);
  const diff = (t.actual!==null&&t.actual!==undefined) ? t.actual-t.planned : null;
  let actualCell;
  if(st==='partial'){
    const usedPct = t.planned? Math.min(100,(t.actual/t.planned)*100):0;
    actualCell = `${fmtIDR(t.actual)}<div class="bar-track" style="margin-top:4px;"><div class="bar-fill" style="width:${usedPct}%;background:${STATUS_META.partial.color};"></div></div>`;
  } else {
    actualCell = (t.actual!==null&&t.actual!==undefined)?fmtIDR(t.actual):'<span class="faint">—</span>';
  }
  return `<tr>
    <td class="dim">${escapeHtml(t.month)} ${t.year}</td>
    <td>${categoryPill(t.category)}</td>
    <td><button class="linklike" data-open-detail="${t.id}">${escapeHtml(t.uraian)}</button>${t.unplanned?' <span class="pill pill-dup" style="margin-left:4px;">unplanned</span>':''}</td>
    <td class="num">${fmtIDR(t.planned)}</td>
    <td class="num">${actualCell}</td>
    <td class="num" style="color:${diff===null?'inherit':diff>0?'var(--brick)':diff<0?'var(--green)':'inherit'}">${diff===null?'—':(diff>0?'+':'')+fmtIDR(diff)}</td>
    <td>${statusBadge(st)}</td>
    <td>${actionsMenuHTML(t, 'ledger')}</td>
  </tr>`;
}
function exportCsv(rows){
  const headers = ['Month','Year','Category','No','Description','Planned','Actual','Variance','Status','Type','ExecutionDate','Method','Bank','Reference','Source'];
  const lines = [`# ${APP_NAME} v${APP_VERSION} — ${APP_TAGLINE}`, headers.join(',')];
  rows.forEach(t=>{
    const diff = (t.actual!==null&&t.actual!==undefined) ? t.actual-t.planned : '';
    const ex = t.execution||{};
    const vals = [t.month,t.year,t.category,t.no,csvSafe(t.uraian),t.planned||0,t.actual??'',diff,statusOf(t),t.type,ex.executionDate||'',csvSafe(ex.method||''),csvSafe(ex.bank||''),csvSafe(ex.reference||''),t.source];
    lines.push(vals.join(','));
  });
  downloadBlob(lines.join('\n'), `${FILE_BASE}-transactions.csv`, 'text/csv');
  toast('CSV exported.');
}
function csvSafe(s){ s=String(s??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

const HR_KEYS = {

async function loadHRData(){

async function persistHR(stateKey){

  if(!ok) console.error('persistHR: '+stateKey+' was not persisted');
  return ok === true;
}

// v2.6.9 — one-time, guarded, non-destructive seed of structured Company Bank Accounts
// from the legacy BANK_ACCOUNTS strings, for backward compatibility (existing
// transactions store one of those strings in `bankAccount`, and the seeded accounts'
// labels match those strings so they keep resolving). A FRESH install stays EMPTY —
// nothing is seeded unless the install already carries business data. Existing account
// data is never overwritten. No schema/storage-shape change.
async function migrateSeedCompanyAccounts(){
  try{
    const flagRes = await StorageAdapter.get('tam_migrated_bankaccts_v269');
    if(flagRes && flagRes.value) return;
    if(!Array.isArray(State.companyAccounts)) State.companyAccounts = [];

      || (State.recurringExpenses&&State.recurringExpenses.length) || (State.monthlyPlans&&State.monthlyPlans.length);
    if(State.companyAccounts.length===0 && hasData){
      const now = new Date().toISOString();
      // Metadata for the known legacy labels; the label list itself is the single source
      // of truth (BANK_ACCOUNTS in constants.js) so the two never drift.
      const META = {
        'Mandiri Operational':{bankName:'Bank Mandiri', purpose:'Operational'},
        'Mandiri Payroll':    {bankName:'Bank Mandiri', purpose:'Payroll'},
        'BCA':                {bankName:'BCA', purpose:'Operational'},
        'BSI':                {bankName:'Bank Syariah Indonesia', purpose:'Payroll'},
        'Cash':               {bankName:'', purpose:'Petty Cash'},
      };
      BANK_ACCOUNTS.forEach(label=>{
        const m = META[label] || {bankName:'', purpose:'Other'};
        State.companyAccounts.push({
          id:uid('cacc'), label, bankName:m.bankName, holder:'', accountNumber:'',
          purpose:m.purpose, status:'Active', notes:'Seeded from legacy bank list (v2.6.9)',
          createdAt:now, updatedAt:now,
        });
      });
      await persistCompanyAccounts();
    }
    await StorageAdapter.set('tam_migrated_bankaccts_v269','done');
  }catch(e){ console.error('migrateSeedCompanyAccounts error', e); }
}

// v2.5.0 — one-time, backed-up upgrade to the Native Payroll Operations schema.
// Normalizes ONLY missing fields on existing payroll plans (review status,
// snapshots, split addition/deduction, history). Never rewrites historical
// totals or transaction actual amounts.
async function migrateToPayrollOpsSchema(){
  try{
    const flagRes = await StorageAdapter.get('tam_migrated_payrollops_v25');
    if(flagRes && flagRes.value==='done'){ if(!Array.isArray(State.payrollAdjustments)) State.payrollAdjustments=[]; return; }
    if(State.payrollPlans.length || State.txns.length){
      State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-2.5 (Native Payroll Operations) migration',
        timestamp:new Date().toISOString(), txns:JSON.parse(JSON.stringify(State.txns)), migration:true});
      await saveBackups();
    }
    if(!Array.isArray(State.payrollAdjustments)) State.payrollAdjustments = [];
    let touched=false;
    State.payrollPlans.forEach(p=>{
      // Map legacy lowercase 'committed' → 'Committed'; default others to Draft.
      if(!p.status || p.status==='committed'){ p.status = p.status==='committed'?'Committed':'Draft'; touched=true; }
      else if(!['Draft','Reviewed','Ready','Committed','Cancelled'].includes(p.status)){ p.status='Committed'; touched=true; }
      if(p.otherAddition===undefined){ p.otherAddition = 0; touched=true; }
      if(p.otherDeduction===undefined){ p.otherDeduction = 0; touched=true; }
      if(p.overtimeAmount===undefined){ p.overtimeAmount = num(p.overtime); touched=true; }
      if(p.baseSalarySnapshot===undefined){ p.baseSalarySnapshot = num(p.baseSalary); touched=true; }
      if(p.contractProgressSnapshot===undefined){ p.contractProgressSnapshot = p.contractProgress||null; touched=true; }
      if(!Array.isArray(p.recurringAdjustmentIds)){ p.recurringAdjustmentIds = []; touched=true; }
      if(p.transactionId===undefined){ p.transactionId = p.committedTxnId||null; touched=true; }
      if(!Array.isArray(p.history)){ p.history = [{event:'generated', ts:p.createdAt||null, note:'Existing payroll plan (pre-2.5)'}]; touched=true; }
      if(!p.createdAt){ p.createdAt = new Date().toISOString(); touched=true; }
      if(!p.updatedAt){ p.updatedAt = p.createdAt; touched=true; }
    });
    if(touched) await persistPayrollPlans();
    await persistHR('payrollAdjustments');
    await StorageAdapter.set('tam_migrated_payrollops_v25', 'done');
    if(State.payrollPlans.length) toast('Upgraded to the Native Payroll Operations Engine (v2.5.0).', 4000);
  }catch(e){ console.error('Payroll ops migration error', e); }
}

/* ============================================================
   DATA PORTABILITY (v2.1.1) — complete backup export / restore.
   Moves the full dataset (transactions + settings + backups)
   between browsers, or between the Claude Artifact and the
   standalone HTML file.
   ============================================================ */
function buildCompleteBackup(){
  return {
    app: APP_NAME,
    version: APP_VERSION,
    release: APP_RELEASE_NAME,
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    storageMode: StorageAdapter.mode,
    txns: State.txns,
    settings: State.settings,
    backups: State.backups,
    employees: State.employees,
    contracts: State.contracts,
    payrollPlans: State.payrollPlans,
    recurringExpenses: State.recurringExpenses,
    monthlyPlans: State.monthlyPlans,
    overtimeRecords: State.overtimeRecords,
    importBatches: State.importBatches,
    payrollAdjustments: State.payrollAdjustments,
    companyAccounts: State.companyAccounts,
    supplementalPayments: State.supplementalPayments,
  };
}
// Validates an uploaded complete-backup object. Returns {ok, errors, info}
// where info powers the pre-restore preview. Nothing is modified here.
function validateCompleteBackup(data){
  const errors = [];
  if(!data || typeof data!=='object' || Array.isArray(data)){
    return {ok:false, errors:['File is not a JSON object — expected a Complete Backup exported from Settings → Data Portability.'], info:null};
  }
  if(!Array.isArray(data.txns)){
    errors.push('Missing or invalid "txns" array — this does not look like a Complete Backup file.');
  } else {
    const bad = data.txns.filter(t=>!t || typeof t!=='object' || !t.id || !t.monthKey || t.uraian===undefined);
    if(bad.length) errors.push(bad.length+' transaction(s) are missing required fields (id, monthKey, uraian).');
  }
  if(data.settings!==undefined && data.settings!==null && (typeof data.settings!=='object' || Array.isArray(data.settings))) errors.push('"settings" is present but is not an object.');
  if(data.backups!==undefined && data.backups!==null && !Array.isArray(data.backups)) errors.push('"backups" is present but is not an array.');
  const info = errors.length ? null : {
    txnCount: data.txns.length,
    monthCount: new Set(data.txns.map(t=>t.monthKey)).size,
    hasSettings: !!data.settings,
    companyName: data.settings ? (data.settings.companyName||'—') : '—',
    backupCount: Array.isArray(data.backups) ? data.backups.length : 0,
    employeeCount: Array.isArray(data.employees) ? data.employees.length : 0,
    overtimeCount: Array.isArray(data.overtimeRecords) ? data.overtimeRecords.length : 0,
    companyAccountCount: Array.isArray(data.companyAccounts) ? data.companyAccounts.length : 0,
    supplementalCount: Array.isArray(data.supplementalPayments) ? data.supplementalPayments.length : 0,
    schemaVersion: (data.schemaVersion===undefined||data.schemaVersion===null) ? 'not recorded' : String(data.schemaVersion),
    sourceApp: data.app || 'unknown', sourceVersion: data.version || 'unknown',
    exportedAt: data.exportedAt || null,
  };
  return {ok: errors.length===0, errors, info};
}
// HR datasets carried by a Complete Backup (employeeMerges is audit-only and not exported/restored).
const RESTORE_HR_KEYS = ['employees','contracts','payrollPlans','recurringExpenses','monthlyPlans','overtimeRecords','importBatches','payrollAdjustments','companyAccounts','supplementalPayments'];
// v2.7.2 — transaction-safe Complete Backup restore. Validates first, keeps a full deep-cloned
// pre-restore snapshot, checks every write, and on ANY failure rolls the in-memory state back AND
// re-persists the original values to every key it had already overwritten. Returns {ok, reason}.
async function restoreCompleteBackup(data){
  // 1) Validate the whole file BEFORE mutating any State.
  const v = (typeof validateCompleteBackup==='function') ? validateCompleteBackup(data) : {ok:Array.isArray(data&&data.txns), errors:['Invalid backup.']};
  if(!v.ok) return {ok:false, reason:'Backup file failed validation: '+((v.errors&&v.errors[0])||'invalid file.')};

  // 2) Full deep-cloned snapshot of the pre-restore in-memory State (for rollback).
  const clone = x=>JSON.parse(JSON.stringify(x===undefined?null:x));
  const snap = {txns:clone(State.txns), settings:clone(State.settings), backups:clone(State.backups)};
  RESTORE_HR_KEYS.forEach(k=>{ snap[k]=clone(State[k]||[]); });

  // Automatic safety backup of the CURRENT data before anything is replaced.
  const safety = {
    id: uid('backup'), monthKey:'__all__',
    monthLabel:'Pre-restore safety backup (all months)',
    timestamp: new Date().toISOString(),
    txns: clone(State.txns),
    safety: true,
  };

  // 3) Apply the restore to State (in memory only).
  State.txns = data.txns.map(raw=>{
    const t = {...raw};
    if(!t.status) t.status = computeStatus(t);
    if(!t.history) t.history = [{event:'created', ts:null, note:'Restored from complete backup'}];
    return t;
  });
  if(data.settings) State.settings = {...DEFAULT_SETTINGS, ...data.settings, schemaVersion: SCHEMA_VERSION};
  RESTORE_HR_KEYS.forEach(k=>{ if(Array.isArray(data[k])) State[k] = clone(data[k]); });
  State.backups = [safety, ...(Array.isArray(data.backups)?data.backups:[])].slice(0,25); // safety first survives the cap

  // 4) Persist every dataset with explicit result checks.
  const writes = [];
  writes.push(['transactions', await persist()]);
  writes.push(['settings', await saveSettings()]);
  writes.push(['backups', await saveBackups()]);
  for(const k of RESTORE_HR_KEYS){ writes.push([k, await persistHR(k)]); }
  const failed = writes.filter(w=>!w[1]).map(w=>w[0]);

  if(failed.length){
    // 5) Roll back: restore in-memory state AND re-write the original values to every key.
    State.txns = snap.txns; State.settings = snap.settings; State.backups = snap.backups;
    RESTORE_HR_KEYS.forEach(k=>{ State[k] = snap[k]; });
    const rbFail = [];
    if(!(await persist())) rbFail.push('transactions');
    if(!(await saveSettings())) rbFail.push('settings');
    if(!(await saveBackups())) rbFail.push('backups');
    for(const k of RESTORE_HR_KEYS){ if(!(await persistHR(k))) rbFail.push(k); }
    if(rbFail.length){
      return {ok:false, reason:`Restore failed writing [${failed.join(', ')}], and the automatic rollback could not fully complete [${rbFail.join(', ')}]. Data may be partially changed — do NOT continue: reload the app, then restore from your original backup file. Storage is likely full or unavailable.`};
    }
    return {ok:false, reason:`Restore failed while writing [${failed.join(', ')}] (storage error). Your previous data was rolled back and is intact. Free up storage and try again.`};
  }

  // 6) Success — restored data already carries lifecycle fields; don't re-run those migrations.
  await StorageAdapter.set('tam_migrated_exec_v21', 'done');
  await StorageAdapter.set('tam_migrated_hr_v22', 'done');
  await StorageAdapter.set('tam_migrated_overtime_v23', 'done');
  const months = getMonths();
  State.selectedMonth = months.length ? months[months.length-1].key : null;
  return {ok:true};
}

function monthSortVal(b){ return b.year*12 + b.monthNum; }

async function handleFile(file, main){
  try{
    toast('Reading ' + file.name + '…');
    const rawBatches = await parseUploadedFile(file);
    if(!rawBatches || !rawBatches.length){
      toast('Could not recognize the file structure. Check the column headers and try again.');
      return;
    }
    // Import Mode (Part 12): Smart / Review use the Smart Import wizard; Finance
    // Only keeps the existing finance-transaction preview flow unchanged.
    if(State.importMode==='smart' || State.importMode==='review'){
      const model = buildSmartImport(rawBatches, file.name);
      if(!model.items.length){
        showWarning('No payroll (Gaji) rows detected. Use "Finance Transactions Only" mode for non-payroll files.');
        State.pendingImport = buildPendingImport(file.name, rawBatches); renderAdd(main); return;
      }
      State.smartImport = model; State.smartStep = 7; State.smartTab='all'; State.view='smartImport'; render();
      return;
    }
    State.pendingImport = buildPendingImport(file.name, rawBatches);
    renderAdd(main);
  }catch(err){
    console.error(err);
    showError('Error reading file: ' + err.message, err);
  }
}

function buildPendingImport(fileName, rawBatches){
  const batches = rawBatches.map(batch=>{
    const monthExists = getMonths().some(m=>m.key===batch.key);
    const existingInMonth = txnsForMonth(batch.key);
    const items = [];
    batch.categories.forEach((cat,ci)=>{
      cat.items.forEach((it,ii)=>{
        const planned = it.jumlahRencana||0;
        const actual = (it.jumlahRealisasi===undefined) ? null : it.jumlahRealisasi;
        const isDuplicate = existingInMonth.some(t=>t.category===cat.name && similarText(t.uraian, it.uraian)>0.86 &&
          Math.abs((t.planned||0)-planned) < Math.max(1000,(t.planned||0)*0.01));
        items.push({
          key:`${batch.key}__${ci}__${ii}`, category:cat.name, categoryCode:cat.code, no:it.no,
          uraian:it.uraian, vol:it.vol, satuan:it.satuan, hargaSatuan:it.hargaSatuan,
          planned, actual, unplanned: !!it.unplanned, txnDate: it.rencanaTransaksi||null,
          type: it.type||'expense', isDuplicate,
        });
      });
    });
    return {batch, monthExists, items};
  });
  const hasAnyNewData = batches.some(b=> !b.monthExists || b.items.some(it=>!it.isDuplicate));
  const sortedByNewest = batches.slice().sort((a,b)=>monthSortVal(b.batch)-monthSortVal(a.batch));
  const pending = {
    fileName, batches, mode:'add',
    activeMonthKey: sortedByNewest.length ? sortedByNewest[0].batch.key : null,
    selected: new Set(), hasAnyNewData,
  };
  applyDefaultSelection(pending);
  return pending;
}
function applyDefaultSelection(pending){
  pending.selected = new Set();
  pending.batches.forEach(b=>{
    if(!b.monthExists){ b.items.forEach(it=>{ if(!it.isDuplicate) pending.selected.add(it.key); }); }
  });
}
function importCounts(pending){
  let totalRows=0;
  pending.batches.forEach(b=>totalRows+=b.items.length);
  const existingMonths = pending.batches.filter(b=>b.monthExists).length;
  const newMonths = pending.batches.length - existingMonths;
  const selectedRows = pending.selected.size;
  return {totalRows, existingMonths, newMonths, selectedRows, skippedRows: totalRows-selectedRows};
}

function buildDiff(batchWrap){
  const oldTxns = txnsForMonth(batchWrap.batch.key);
  const usedOldIds = new Set();
  const rows = batchWrap.items.map(it=>{
    let match = null;
    if(it.no!==null && it.no!==undefined && !String(it.no).startsWith('extra_')){
      match = oldTxns.find(t=>t.category===it.category && String(t.no)===String(it.no) && !usedOldIds.has(t.id));
    }
    if(!match) match = oldTxns.find(t=>t.category===it.category && similarText(t.uraian, it.uraian)>0.86 && !usedOldIds.has(t.id));
    if(match) usedOldIds.add(match.id);
    const plannedChanged = match && Math.round(match.planned||0)!==Math.round(it.planned||0);
    const actualChanged = match && Math.round(match.actual||0)!==Math.round(it.actual||0) && !(match.actual==null && it.actual==null);
    const status = !match ? 'new' : (plannedChanged||actualChanged) ? 'changed' : 'unchanged';
    return {...it, old: match, plannedChanged, actualChanged, status};
  });
  const removed = oldTxns.filter(t=>!usedOldIds.has(t.id));
  return {rows, removed, oldTxns};
}

function renderUpdateDiff(tabBody, imp, active, el, main){
  const diff = buildDiff(active);
  const changed = diff.rows.filter(r=>r.status==='changed').length;

  const unchanged = diff.rows.filter(r=>r.status==='unchanged').length;
  tabBody.innerHTML = `
    <div class="insight-item" style="margin-bottom:14px;">
      Comparing uploaded data to the version currently stored for ${escapeHtml(active.batch.monthName)} ${active.batch.year}:
      <b>${changed}</b> changed, <b>${added}</b> new, <b>${unchanged}</b> unchanged, <b>${diff.removed.length}</b> would be removed.
    </div>
    <div class="table-wrap" style="max-height:440px;overflow-y:auto;">
      <table>
        <thead><tr><th>Description</th><th>Category</th><th class="num">Old Planned</th><th class="num">New Planned</th><th class="num">Old Actual</th><th class="num">New Actual</th><th>Status</th></tr></thead>
        <tbody>
          ${diff.rows.map(r=>`<tr>
            <td>${escapeHtml(r.uraian)}</td>
            <td>${categoryPill(r.category)}</td>
            <td class="num ${r.plannedChanged?'dim':''}">${r.old?fmtIDR(r.old.planned):'—'}</td>
            <td class="num" style="${r.plannedChanged?'color:var(--accent);font-weight:700;':''}">${fmtIDR(r.planned)}</td>
            <td class="num ${r.actualChanged?'dim':''}">${r.old && r.old.actual!=null?fmtIDR(r.old.actual):'—'}</td>
            <td class="num" style="${r.actualChanged?'color:var(--accent);font-weight:700;':''}">${r.actual!=null?fmtIDR(r.actual):'—'}</td>
            <td><span class="pill ${r.status==='changed'?'pill-over':r.status==='new'?'pill-under':'pill-onbudget'}">${r.status}</span></td>
          </tr>`).join('')}
          ${diff.removed.map(t=>`<tr>
            <td>${escapeHtml(t.uraian)}</td><td>${categoryPill(t.category)}</td>
            <td class="num">${fmtIDR(t.planned)}</td><td class="num faint">—</td>
            <td class="num">${t.actual!=null?fmtIDR(t.actual):'—'}</td><td class="num faint">—</td>
            <td><span class="pill pill-dup">removed</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions" style="justify-content:flex-start;">
      <button class="btn btn-accent" id="applyUpdateBtn">Apply Update to ${escapeHtml(active.batch.monthName)} ${active.batch.year}</button>
    </div>
  `;
  document.getElementById('applyUpdateBtn').addEventListener('click', ()=>applyMonthUpdate(active, diff, imp, el, main));
}

async function applyMonthUpdate(batchWrap, diff, imp, el, main){
  const label = `${batchWrap.batch.monthName} ${batchWrap.batch.year}`;
  if(!confirm(`Replace all data for ${label} with the uploaded version?\n\n${diff.rows.filter(r=>r.status==='changed').length} changed, ${diff.rows.filter(r=>r.status==='new').length} new, ${diff.removed.length} removed.\n\nA backup of the current data will be created first.`)) return;
  const backup = {
    id: uid('backup'), monthKey: batchWrap.batch.key, monthLabel: label,
    timestamp: new Date().toISOString(), txns: JSON.parse(JSON.stringify(diff.oldTxns)),
  };
  State.backups.unshift(backup);
  await saveBackups();
  State.txns = State.txns.filter(t=>t.monthKey!==batchWrap.batch.key);
  batchWrap.items.forEach(it=>{
    State.txns.push(buildImportedTxn(it, batchWrap.batch));
  });
  await persist();
  toast(`${label} updated. Backup of ${diff.oldTxns.length} items saved to Backup History.`);
  imp.batches = imp.batches.filter(b=>b!==batchWrap);
  if(!imp.batches.length){ State.pendingImport=null; renderAdd(main); return; }
  const sortedByNewest = imp.batches.slice().sort((a,b)=>monthSortVal(b.batch)-monthSortVal(a.batch));
  imp.activeMonthKey = sortedByNewest[0].batch.key;
  renderImportPreview(el, main);
}

function renderPlanVsActual(main){

    const av = (a.actual||0)-(a.planned||0), bv=(b.actual||0)-(b.planned||0);
    return Math.abs(bv)-Math.abs(av);
  });
  const tot = monthTotals(key);
  main.innerHTML = `
    <div class="page-head">

      <div class="card stat-card"><div class="stat-label">Total Actual</div><div class="stat-value">${fmtIDRShort(tot.actual)}</div></div>
      <div class="card stat-card"><div class="stat-label">Variance</div><div class="stat-value" style="color:${tot.variance>=0?'var(--green)':'var(--brick)'}">${fmtIDRShort(tot.variance)}</div></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>By Category</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Category</th><th class="num">Planned</th><th class="num">Actual</th><th class="num">Variance</th><th class="num">% of Plan Used</th></tr></thead>

function applyQuickRange(months, range){
  if(range==='last3') return months.slice(-3);
  if(range==='last6') return months.slice(-6);
  if(range==='last12') return months.slice(-12);
  if(range==='year'){ const y=new Date().getFullYear(); const r=months.filter(m=>m.year===y); return r.length?r:months; }
  return months;
}
function actualPointColor(row){
  if(!row.info.hasData) return '#5E6A87';
  if(!row.info.complete) return '#5E6A87';
  if(row.tot.actual>row.tot.planned) return '#C1543F';
  if(row.tot.actual<row.tot.planned) return '#4FAE7C';
  return '#C9A15C';
}
function budgetStatusLabel(row){
  if(!row.info.hasData) return 'No Actual Recorded';
  if(!row.info.complete) return 'Incomplete';
  if(row.tot.actual>row.tot.planned) return 'Over Budget';
  if(row.tot.actual<row.tot.planned) return 'Under Budget';
  return 'On Budget';
}
function trendTooltip(row){
  const status = budgetStatusLabel(row);
  const statusColor = status==='Over Budget'?'#C1543F':status==='Under Budget'?'#4FAE7C':status==='On Budget'?'#C9A15C':'#96A1BA';
  const v = row.info.hasData ? row.tot.planned-row.tot.actual : null;
  const vp = (v!==null && row.tot.planned) ? v/row.tot.planned : null;
  let mom = '';
  if(row.growthAbs!==null && row.growthAbs!==undefined){
    mom = `<div>MoM Change: <b class="mono" style="color:${row.growthAbs>0?'#C1543F':'#4FAE7C'}">${row.growthAbs>0?'+':''}${fmtIDR(row.growthAbs)}</b> (${pct(row.growthPct)})</div>`;
  }
  return `<div style="font-weight:600;margin-bottom:4px;">${escapeHtml(monthLabel(row.m))}</div>
    <div>Planned: <b class="mono">${fmtIDR(row.tot.planned)}</b></div>
    <div>Actual: <b class="mono">${row.info.hasData?fmtIDR(row.tot.actual):'no data'}</b></div>
    ${v!==null?`<div>Variance: <b class="mono">${fmtIDR(v)}</b> (${pct(vp)})</div>`:''}
    ${mom}
    <div style="margin-top:3px;color:${statusColor};">${status}</div>`;
}

/* ---- MONTHLY TRENDS ---- */
function monthActualInfo(key){
  const txns = txnsForMonth(key).filter(t=>t.type!=='income');
  const known = txns.filter(t=>t.actual!==null && t.actual!==undefined);
  const pending = txns.length - known.length;
  const sum = known.reduce((s,t)=>s+(t.actual||0),0);
  return {hasData: known.length>0, complete: pending===0 && txns.length>0, pending, total: txns.length, sum};
}
function categorySeries(catName, months){
  return months.map(m=>{
    const cb = categoryBreakdown(m.key).find(c=>c.category===catName);
    return {m, planned: cb?cb.planned:0, actual: (cb&&cb.hasActual)?cb.actual:null, hasActual: cb?cb.hasActual:false};
  });
}
function filteredTrendMonths(){
  const months = getMonths();
  const f = State.trendsFilter;
  if(f.range==='year'){ const y=new Date().getFullYear(); const r=months.filter(m=>m.year===y); return r.length?r:months; }
  if(f.range==='last3') return months.slice(-3);
  if(f.range==='last6') return months.slice(-6);
  if(f.range==='last12') return months.slice(-12);
  if(f.range==='custom' && f.start && f.end) return months.filter(m=>m.key>=f.start && m.key<=f.end);
  return months;
}
function trendRows(months){
  const allMonths = getMonths();
  return months.map(m=>{
    const idx = allMonths.findIndex(x=>x.key===m.key);
    const prev = idx>0 ? allMonths[idx-1] : null;
    const tot = monthTotals(m.key), info = monthActualInfo(m.key);
    const prevTot = prev ? monthTotals(prev.key) : null;
    const prevInfo = prev ? monthActualInfo(prev.key) : null;
    const growthAbs = (prev && info.hasData && prevInfo.hasData) ? tot.actual-prevTot.actual : null;
    const growthPct = (growthAbs!==null && prevTot.actual) ? growthAbs/prevTot.actual : null;
    const varianceChange = (prev && info.hasData && prevInfo.hasData) ? tot.variance-prevTot.variance : null;
    return {m, tot, info, prev, growthAbs, growthPct, varianceChange};
  });
}
function computeTrendInsights(months){
  const insights = [];
  if(!months.length) return insights;
  const allMonths = getMonths();
  const rows = trendRows(months);
  const withData = rows.filter(r=>r.info.hasData);
  const lastRow = rows[rows.length-1];
  if(lastRow && lastRow.growthAbs!==null){
    insights.push({type: lastRow.growthAbs>0?'warn':'good', text:`Actual spending ${lastRow.growthAbs>0?'increased':'decreased'} by ${fmtIDR(Math.abs(lastRow.growthAbs))} (${pct(lastRow.growthPct)}) in ${monthLabel(lastRow.m)} versus the prior month.`});
  }
  if(withData.length){
    const highest = withData.reduce((a,b)=>b.tot.actual>a.tot.actual?b:a);
    const lowest = withData.reduce((a,b)=>b.tot.actual<a.tot.actual?b:a);
    insights.push({type:'info', text:`${monthLabel(highest.m)} is the highest-spending month in this period at ${fmtIDR(highest.tot.actual)}; ${monthLabel(lowest.m)} is the lowest at ${fmtIDR(lowest.tot.actual)}.`});
  }
  const gajiSeries = categorySeries('Gaji', months).filter(x=>x.hasActual);
  let payrollStreak=0;
  for(let i=gajiSeries.length-1;i>0;i--){ if(gajiSeries[i].actual>gajiSeries[i-1].actual) payrollStreak++; else break; }
  if(payrollStreak>=2) insights.push({type:'warn', text:`Gaji (payroll) actual spending has risen for ${payrollStreak+1} consecutive months.`});
  const kegVals = categorySeries('Operasional Kegiatan', months).filter(x=>x.hasActual).map(x=>x.actual);
  if(kegVals.length>=3){
    const mean = kegVals.reduce((a,b)=>a+b,0)/kegVals.length;
    const sd = Math.sqrt(kegVals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/kegVals.length);
    const cv = mean ? sd/mean : 0;
    if(cv>0.5) insights.push({type:'warn', text:`Operasional Kegiatan spending shows high month-to-month volatility (~±${Math.round(cv*100)}% relative variation).`});
  }
  let overStreak=0;
  for(let i=withData.length-1;i>=0;i--){ if(withData[i].tot.actual>withData[i].tot.planned) overStreak++; else break; }
  if(overStreak>=2) insights.push({type:'warn', text:`The last ${overStreak} months with recorded actuals each ran over the planned budget.`});
  if(withData.length){
    const avg = withData.reduce((a,x)=>a+x.tot.actual,0)/withData.length;
    insights.push({type:'info', text:`Average actual spending across this period is ${fmtIDR(avg)}/month, based on ${withData.length} month${withData.length!==1?'s':''} with recorded actuals.`});
  }
  return insights;
}
function exportTrendSummaryCsv(rows){
  const headers = ['Month','Year','Planned','Actual','ActualStatus','Variance','MoM Actual Change','MoM Actual %'];
  const lines = [`# ${APP_NAME} v${APP_VERSION} — ${APP_TAGLINE}`, headers.join(',')];
  rows.forEach(r=>{
    const status = !r.info.hasData ? 'missing' : r.info.complete ? 'complete' : 'incomplete';
    lines.push([r.m.month, r.m.year, r.tot.planned, r.info.hasData?r.tot.actual:'', status, r.info.hasData?r.tot.variance:'', r.growthAbs??'', r.growthPct!==null?(r.growthPct*100).toFixed(1)+'%':''].join(','));
  });
  downloadBlob(lines.join('\n'), `${FILE_BASE}-monthly-trend-summary.csv`, 'text/csv');
  toast('Trend summary exported.');
}
function exportCategoryTrendCsv(catName, months){
  const series = categorySeries(catName, months);
  const headers = ['Month','Year','Category','Planned','Actual','ActualStatus'];
  const lines = [`# ${APP_NAME} v${APP_VERSION} — ${APP_TAGLINE}`, headers.join(',')];
  series.forEach(s=>{
    lines.push([s.m.month, s.m.year, catName, s.planned, s.hasActual?s.actual:'', s.hasActual?'recorded':'missing'].join(','));
  });
  downloadBlob(lines.join('\n'), `${FILE_BASE}-category-trend-${catName.replace(/\s+/g,'-')}.csv`, 'text/csv');
  toast('Category trend exported.');
}

/* ---- EXECUTIVE DASHBOARD ---- */
function sparklineSVG(values, color, w, h){
  w=w||100; h=h||28;
  const has = values.some(v=>v!==null&&v!==undefined);
  if(!has) return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:hidden;"></svg>`;
  const known = values.filter(v=>v!==null&&v!==undefined);
  let max=Math.max(...known), min=Math.min(...known);
  if(max===min){ max+=1; }
  const step = values.length>1 ? w/(values.length-1) : 0;
  let d=''; let started=false;
  values.forEach((v,i)=>{
    if(v===null||v===undefined){ started=false; return; }
    const x=i*step, y=h-2-((v-min)/(max-min))*(h-4);
    d += (started?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    started=true;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:hidden;" role="img" aria-label="Recent trend sparkline"><path d="${d.trim()}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function kpiCard(label, value, opts){
  opts = opts||{};
  let subHtml = '';
  if(opts.deltaAbs!==undefined && opts.deltaAbs!==null){
    const up = opts.deltaAbs>0;
    subHtml = `<div class="stat-sub" style="color:${up?'var(--brick)':'var(--green)'};">${up?'▲':'▼'} ${fmtIDR(Math.abs(opts.deltaAbs))}${opts.deltaPct!=null?` (${pct(opts.deltaPct)})`:''} vs prior month</div>`;
  } else if(opts.sub){
    subHtml = `<div class="stat-sub dim">${opts.sub}</div>`;
  }
  return `<div class="card stat-card">
    <div class="stat-label">${escapeHtml(label)}${opts.incomplete?'<span class="pill pill-dup" style="margin-left:6px;">incomplete</span>':''}</div>
    <div class="stat-value">${value}</div>
    ${subHtml}
    ${opts.sparkline?`<div style="margin-top:8px;">${opts.sparkline}</div>`:''}
  </div>`;
}
function computeExecutiveAlerts(key, months){
  const alerts = [];
  const tot = monthTotals(key), info = monthActualInfo(key);
  if(info.hasData && tot.actual>tot.planned) alerts.push({type:'warn', text:`Current month is over budget by ${fmtIDR(tot.actual-tot.planned)}.`});
  if(info.hasData && !info.complete) alerts.push({type:'warn', text:`Current month has ${info.pending} line item${info.pending!==1?'s':''} still missing an actual amount — figures may change.`});
  const unplanned = txnsForMonth(key).filter(t=>t.unplanned && t.actual);
  if(unplanned.length) alerts.push({type:'warn', text:`${unplanned.length} unplanned expense${unplanned.length>1?'s':''} recorded this month with no matching plan line, totaling ${fmtIDR(unplanned.reduce((s,t)=>s+(t.actual||0),0))}.`});
  const idx = months.findIndex(m=>m.key===key);
  if(idx>0){
    const prevTot = monthTotals(months[idx-1].key), prevInfo = monthActualInfo(months[idx-1].key);
    if(info.hasData && prevInfo.hasData && prevTot.actual){
      const change = (tot.actual-prevTot.actual)/prevTot.actual;
      if(change>0.2) alerts.push({type:'warn', text:`Actual spending rose ${pct(change)} versus the prior month — a major increase.`});
    }
  }
  const gajiSeries = categorySeries('Gaji', months).filter(x=>x.hasActual);
  let streak=0;
  for(let i=gajiSeries.length-1;i>0;i--){ if(gajiSeries[i].actual>gajiSeries[i-1].actual) streak++; else break; }
  if(streak>=2) alerts.push({type:'warn', text:`Gaji (payroll) spending has increased for ${streak+1} consecutive months — a recurring cost increase.`});
  const missingMonths = months.slice(-6).filter(m=>!monthActualInfo(m.key).hasData);
  if(missingMonths.length) alerts.push({type:'info', text:`${missingMonths.length} of the last 6 months have no realization data recorded at all: ${missingMonths.map(m=>monthLabel(m)).join(', ')}.`});
  // execution-specific alerts
  const today = isoToday();
  const executedToday = State.txns.filter(t=>t.execution && t.execution.executionDate===today);
  const bigToday = executedToday.filter(t=>(t.actual||0)>=50000000);
  if(bigToday.length) alerts.push({type:'warn', text:`${bigToday.length} large payment${bigToday.length>1?'s':''} executed today (≥${fmtIDR(50000000)} each): ${bigToday.slice(0,3).map(t=>escapeHtml(t.uraian)).join(', ')}.`});
  const highVar = txnsForMonth(key).filter(t=>t.actual!=null && t.planned>0 && (t.actual-t.planned)/t.planned>0.5);
  if(highVar.length) alerts.push({type:'warn', text:`${highVar.length} executed item${highVar.length>1?'s':''} this month exceeded plan by more than 50%.`});
  const cancelledPayroll = txnsForMonth(key).filter(t=>t.category==='Gaji' && statusOf(t)==='cancelled');
  if(cancelledPayroll.length) alerts.push({type:'warn', text:`${cancelledPayroll.length} payroll (Gaji) transaction${cancelledPayroll.length>1?'s were':' was'} cancelled this month.`});
  const overduePlanned = State.txns.filter(t=>t.type!=='income' && ['planned','scheduled'].includes(statusOf(t)) && (t.scheduledDate||t.txnDate) && (t.scheduledDate||t.txnDate)<today);
  if(overduePlanned.length) alerts.push({type:'warn', text:`${overduePlanned.length} planned payment${overduePlanned.length>1?'s are':' is'} overdue (planned date passed, not yet executed).`});
  const partialCount = txnsForMonth(key).filter(t=>statusOf(t)==='partial').length;
  if(partialCount>=2) alerts.push({type:'info', text:`${partialCount} transactions this month are partially paid and awaiting completion.`});
  return alerts;
}

/* ---- CASH FLOW ---- */
function monthIncomeInfo(key){
  const txns = txnsForMonth(key).filter(t=>t.type==='income');
  if(!txns.length) return {status:'none', sum:0, hasAny:false};
  const known = txns.filter(t=>t.actual!==null && t.actual!==undefined);
  const sum = known.reduce((s,t)=>s+(t.actual||0),0);
  if(known.length < txns.length) return {status:'partial', sum, hasAny:true, pending:txns.length-known.length};
  return {status: sum===0?'zero':'recorded', sum, hasAny:true};
}
function renderCashFlow(main){
  const months = getMonths();
  if(!months.length){ main.innerHTML = emptyState('No data yet','Add or upload monthly data first.'); return; }
  const hasAnyIncome = State.txns.some(t=>t.type==='income');
  const rows = months.map(m=>{
    const ii = monthIncomeInfo(m.key);
    const ei = monthActualInfo(m.key);
    const net = (ii.hasAny && ei.hasData) ? ii.sum-monthTotals(m.key).actual : null;
    return {m, ii, ei, net, expenseActual: ei.hasData?monthTotals(m.key).actual:null};
  });
  let running = (State.settings.openingCashBalance===null||State.settings.openingCashBalance===undefined) ? null : State.settings.openingCashBalance;
  const runningRows = rows.map(r=>{
    if(running===null || r.net===null){ running = null; return {...r, running:null}; }
    running = running + r.net;
    return {...r, running};
  });
  main.innerHTML = `
    <div class="page-head"><div><h1>Cash Flow</h1><p class="desc">Recorded income versus actual expenses, month by month.</p></div></div>
    ${!hasAnyIncome ? `<div class="insight-item warn" style="margin-bottom:14px;">No income transactions have been recorded in the system yet, so cash-flow analysis is incomplete — figures below reflect expenses only. Add income transactions (Add / Upload → Manual Entry → Type: Income) to see net cash flow.</div>` : ''}
    ${(State.settings.openingCashBalance===null||State.settings.openingCashBalance===undefined) ? `<div class="insight-item" style="margin-bottom:14px;">No opening cash balance is set, so this page shows net movement only, not a cash position. Add one in Settings to see a running cash position.</div>` : ''}
    <div class="card">
      <h3>Monthly Cash Flow</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Month</th><th class="num">Income</th><th class="num">Actual Expense</th><th class="num">Net Cash Flow</th><th class="num">${State.settings.openingCashBalance!=null?'Running Cash Position':'Running Net Movement'}</th></tr></thead>
        <tbody>${runningRows.map(r=>`<tr>
          <td>${escapeHtml(monthLabel(r.m))}</td>
          <td class="num">${r.ii.status==='none'?'<span class="faint">no income recorded</span>':r.ii.status==='partial'?fmtIDR(r.ii.sum)+' (partial)':fmtIDR(r.ii.sum)}</td>
          <td class="num">${r.ei.hasData?fmtIDR(r.expenseActual):'<span class="faint">missing</span>'}</td>
          <td class="num" style="color:${r.net==null?'inherit':r.net>=0?'var(--green)':'var(--brick)'}">${r.net==null?'<span class="faint">incomplete</span>':fmtIDR(r.net)}</td>
          <td class="num">${r.running==null?'<span class="faint">—</span>':fmtIDR(r.running)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h3>Net Cash Flow Trend</h3>
      <div class="chart-wrap" id="cashFlowChart"></div>
    </div>
  `;
  const el = document.getElementById('cashFlowChart');
  if(el){
    drawBarChart(el, {
      labels: months.map(m=>m.month.slice(0,3)+" '"+String(m.year).slice(2)),
      series: [{key:'net', label:'Net Cash Flow', color:'#4FAE7C', data: rows.map(r=>r.net)}],
      formatY: fmtIDRShort, height:260, signed:true, legend:false,
      emptyMessage:'Not enough income and expense data recorded yet.',
      ariaLabel:'Net cash flow by month',
      tooltipHTML:(i)=>{
        const r = rows[i];
        return `<div style="font-weight:600;margin-bottom:4px;">${escapeHtml(monthLabel(r.m))}</div>
          <div>Income: <b class="mono">${r.ii.status==='none'?'no data':fmtIDR(r.ii.sum)}</b></div>
          <div>Actual Expense: <b class="mono">${r.ei.hasData?fmtIDR(r.expenseActual):'no data'}</b></div>
          <div>Net: <b class="mono">${r.net==null?'incomplete':fmtIDR(r.net)}</b></div>`;
      },
      onBarClick:(i)=>goToMonthOverview(rows[i].m.key),
    });
  }
}

function renderBudgetCenter(main){

  if(!months.length){ main.innerHTML = emptyState('No data yet','Add or upload monthly data first.'); return; }
  const years = [...new Set(months.map(m=>m.year))];
  if(!State.budgetYear || !years.includes(State.budgetYear)) State.budgetYear = years[years.length-1];
  const yearMonths = months.filter(m=>m.year===State.budgetYear);
  const yRows = trendRows(yearMonths);
  const annualPlanned = yearMonths.reduce((s,m)=>s+monthTotals(m.key).planned,0);
  const knownActualRows = yRows.filter(r=>r.info.hasData);
  const annualActual = knownActualRows.reduce((s,r)=>s+r.tot.actual,0);
  const remaining = annualPlanned - annualActual;
  const utilization = annualPlanned ? (annualActual/annualPlanned*100) : 0;
  const catUtil = KNOWN_CATEGORIES.map(cat=>{
    let planned=0, actual=0, hasAny=false;
    yearMonths.forEach(m=>{ const cb=categoryBreakdown(m.key).find(c=>c.category===cat); if(cb){ planned+=cb.planned; if(cb.hasActual){ actual+=cb.actual; hasAny=true; } } });
    return {cat, planned, actual, hasAny, pctUsed: planned?actual/planned*100:0};
  });
  const atRisk = yRows.filter(r=>r.info.hasData && r.tot.planned && (r.tot.actual/r.tot.planned)>=0.9);

  const sim = State.budgetSim;
  const catBase = {};
  KNOWN_CATEGORIES.forEach(cat=>{ const cu=catUtil.find(c=>c.cat===cat); catBase[cat] = cu&&cu.hasAny? cu.actual/Math.max(1,knownActualRows.length) : 0; });
  const projGaji = catBase['Gaji']*(1+sim.payrollPct/100);
  const projRutin = catBase['Operasional Rutin']*(1+sim.opsPct/100);
  const projKegiatan = catBase['Operasional Kegiatan']*(1+sim.opsPct/100);
  const projTotal = (projGaji+projRutin+projKegiatan) * (1+sim.expensePct/100);
  const currentAvgActual = knownActualRows.length ? annualActual/knownActualRows.length : 0;
  const projVariance = currentAvgActual - projTotal;

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Budget Center</h1><p class="desc">Annual and monthly budget utilization for ${escapeHtml(State.settings.companyName||COMPANY_NAME_DEFAULT)}.</p></div>
      <div class="head-controls"><select id="budgetYear" class="input">${years.map(y=>`<option value="${y}" ${y===State.budgetYear?'selected':''}>${y}</option>`).join('')}</select></div>
    </div>
    <div class="grid grid-4" style="margin-bottom:14px;">
      <div class="card stat-card"><div class="stat-label">Annual Planned Budget</div><div class="stat-value">${fmtIDRShort(annualPlanned)}</div></div>
      <div class="card stat-card"><div class="stat-label">Annual Actual Spend</div><div class="stat-value">${fmtIDRShort(annualActual)}</div><div class="stat-sub dim">${knownActualRows.length} of ${yearMonths.length} months recorded</div></div>
      <div class="card stat-card"><div class="stat-label">Remaining Budget</div><div class="stat-value" style="color:${remaining>=0?'var(--green)':'var(--brick)'}">${fmtIDRShort(remaining)}</div></div>
      <div class="card stat-card"><div class="stat-label">Budget Utilization</div><div class="stat-value">${utilization.toFixed(0)}%</div></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Monthly Planned vs. Actual — ${State.budgetYear}</h3>
      <p class="hint">Click a point to open that month's Finance Overview.</p>
      <div class="chart-wrap" id="budgetMonthlyChart"></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Category Utilization</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Category</th><th class="num">Planned</th><th class="num">Actual</th><th class="num">% Used</th></tr></thead>
        <tbody>${catUtil.map(c=>`<tr><td>${categoryPill(c.cat)}</td><td class="num">${fmtIDR(c.planned)}</td><td class="num">${c.hasAny?fmtIDR(c.actual):'<span class="faint">—</span>'}</td><td class="num">${c.hasAny?c.pctUsed.toFixed(0)+'%':'—'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Months at Risk of Overspending<span class="tag">≥90% of plan used</span></h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Month</th><th class="num">Planned</th><th class="num">Actual</th><th class="num">% Used</th></tr></thead>
        <tbody>${atRisk.map(r=>`<tr><td>${escapeHtml(monthLabel(r.m))}</td><td class="num">${fmtIDR(r.tot.planned)}</td><td class="num">${fmtIDR(r.tot.actual)}</td><td class="num" style="color:var(--brick);">${(r.tot.actual/r.tot.planned*100).toFixed(0)}%</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No months at risk this year</td></tr>'}</tbody>
      </table></div>
    </div>
    <div class="card">
      <h3>Scenario Simulator<span class="tag">simulation only — not saved</span></h3>
      <p class="hint">Projects monthly spending from this year's average monthly actuals by category. Nothing here is written to your data.</p>
      <div class="form-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="field"><label>Overall Expense Increase %</label><input class="input" id="simExpense" type="number" step="1" value="${sim.expensePct}"></div>
        <div class="field"><label>Payroll Increase %</label><input class="input" id="simPayroll" type="number" step="1" value="${sim.payrollPct}"></div>
        <div class="field"><label>Operational Cost Increase %</label><input class="input" id="simOps" type="number" step="1" value="${sim.opsPct}"></div>
      </div>
      <div class="grid grid-2" style="margin-top:14px;">
        <div class="card stat-card"><div class="stat-label">Projected Monthly Spending (Simulation)</div><div class="stat-value">${fmtIDRShort(projTotal)}</div></div>
        <div class="card stat-card"><div class="stat-label">Projected Variance vs. Current Average (Simulation)</div><div class="stat-value" style="color:${projVariance>=0?'var(--green)':'var(--brick)'}">${fmtIDRShort(projVariance)}</div></div>
      </div>
    </div>
  `;
  document.getElementById('budgetYear').addEventListener('change', e=>{ State.budgetYear=Number(e.target.value); renderBudgetCenter(main); });
  ['simExpense','simPayroll','simOps'].forEach((id,ix)=>{
    document.getElementById(id).addEventListener('input', e=>{
      const skey = ['expensePct','payrollPct','opsPct'][ix];
      State.budgetSim[skey] = Number(e.target.value)||0;
      renderBudgetCenter(main);
    });
  });
  const bmEl = document.getElementById('budgetMonthlyChart');
  if(bmEl){
    drawLineChart(bmEl, {
      labels: yearMonths.map(m=>m.month.slice(0,3)),
      series: [
        {key:'planned', label:'Planned', color:'#96A1BA', data: yRows.map(r=>r.tot.planned)},
        {key:'actual', label:'Actual', color:'#C9A15C', fill:true, data: yRows.map(r=>r.info.hasData?r.tot.actual:null),
          pointColor: yRows.map(r=>actualPointColor(r)), pointHollow: yRows.map(r=>r.info.hasData && !r.info.complete)},
      ],
      formatY: fmtIDRShort, height:260,
      emptyMessage:'No data for this year.',
      ariaLabel:'Monthly planned versus actual budget',
      tooltipHTML:(i)=>trendTooltip(yRows[i]),
      onIndexClick:(i)=>goToMonthOverview(yRows[i].m.key),
    });
  }
}

/* ---- EXECUTIVE INSIGHTS ---- */
function renderExecutiveInsights(main){
  const months = getMonths();
  if(!months.length){ main.innerHTML = emptyState('No data yet','Add or upload monthly data first.'); return; }
  const rows = trendRows(months);
  const withData = rows.filter(r=>r.info.hasData);
  const insights = [];

  const growthRows = rows.filter(r=>r.growthAbs!==null);
  if(growthRows.length){
    const biggestIncrease = growthRows.reduce((a,b)=>b.growthAbs>a.growthAbs?b:a);
    const biggestDecrease = growthRows.reduce((a,b)=>b.growthAbs<a.growthAbs?b:a);
    if(biggestIncrease.growthAbs>0) insights.push({text:`Largest expense growth: ${fmtIDR(biggestIncrease.growthAbs)} increase in ${monthLabel(biggestIncrease.m)} (${pct(biggestIncrease.growthPct)}).`, basis:'Actual data', type:'warn'});
    if(biggestDecrease.growthAbs<0) insights.push({text:`Largest saving: ${fmtIDR(Math.abs(biggestDecrease.growthAbs))} decrease in ${monthLabel(biggestDecrease.m)} (${pct(biggestDecrease.growthPct)}).`, basis:'Actual data', type:'good'});
  }
  const catTotals = {};
  State.txns.filter(t=>t.type!=='income' && t.actual!=null).forEach(t=>{ catTotals[t.category]=(catTotals[t.category]||0)+t.actual; });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length) insights.push({text:`Highest-spending category overall: ${catEntries[0][0]} at ${fmtIDR(catEntries[0][1])}.`, basis: withData.length===months.length?'Complete data':'Partial data', type:'info'});

  [...new Set([...KNOWN_CATEGORIES, ...State.txns.map(t=>t.category)])].forEach(cat=>{
    const series = categorySeries(cat, months).filter(x=>x.hasActual);
    let streak=0;
    for(let i=series.length-1;i>0;i--){ if(series[i].actual>series[i-1].actual) streak++; else break; }
    if(streak>=2) insights.push({text:`${cat} spending has increased for ${streak+1} consecutive months.`, basis:'Actual data', type:'warn'});
  });
  const unplanned = State.txns.filter(t=>t.unplanned && t.actual);
  if(unplanned.length) insights.push({text:`${unplanned.length} unplanned expense${unplanned.length>1?'s':''} recorded across all history, totaling ${fmtIDR(unplanned.reduce((s,t)=>s+t.actual,0))}.`, basis:'Actual data', type:'warn'});
  const incompleteMonths = rows.filter(r=>r.info.hasData && !r.info.complete);
  if(incompleteMonths.length) insights.push({text:`${incompleteMonths.length} month${incompleteMonths.length>1?'s have':' has'} partially recorded actuals: ${incompleteMonths.map(r=>monthLabel(r.m)).join(', ')}.`, basis:'Partial data', type:'info'});
  const missingMonths = rows.filter(r=>!r.info.hasData);
  if(missingMonths.length) insights.push({text:`${missingMonths.length} month${missingMonths.length>1?'s have':' has'} no realization data at all: ${missingMonths.map(r=>monthLabel(r.m)).join(', ')}.`, basis:'Planned data only', type:'info'});
  let overStreak=0;
  for(let i=withData.length-1;i>=0;i--){ if(withData[i].tot.actual>withData[i].tot.planned) overStreak++; else break; }
  if(overStreak>=2) insights.push({text:`The last ${overStreak} months with recorded actuals each ran over budget — elevated over-budget risk going forward.`, basis:'Actual data', type:'warn'});
  const recurring = recurringItems();
  if(recurring.length) insights.push({text:`${recurring.length} line items recur across 3 or more months — the largest is "${recurring[0].label}" at an average of ${fmtIDR(recurring[0].monthCount?recurring[0].totalActual/recurring[0].monthCount:0)}/month.`, basis:'Actual data', type:'info'});
  if(withData.length) insights.push({text:`Historical average actual spending is ${fmtIDR(withData.reduce((s,r)=>s+r.tot.actual,0)/withData.length)}/month across ${withData.length} recorded months.`, basis: withData.length===months.length?'Complete data':'Partial data', type:'info'});
  const lastRow = rows[rows.length-1];
  if(lastRow && lastRow.growthAbs!==null) insights.push({text:`Most recent month-over-month change: ${lastRow.growthAbs>0?'+':''}${fmtIDR(lastRow.growthAbs)} (${pct(lastRow.growthPct)}) in ${monthLabel(lastRow.m)}.`, basis:'Actual data', type: lastRow.growthAbs>0?'warn':'good'});

  main.innerHTML = `
    <div class="page-head"><div><h1>Executive Insights</h1><p class="desc">Observations generated only from recorded data — each labeled with how complete that data is.</p></div></div>
    <div class="card">
      <div class="insight-list">
        ${insights.map(i=>`<div class="insight-item ${i.type}" style="display:block;">
          <div>${i.text}</div>
          <div class="faint" style="font-size:10.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.4px;">Based on: ${escapeHtml(i.basis)}</div>
        </div>`).join('') || '<div class="empty">Not enough data yet for insights.</div>'}
      </div>
    </div>
  `;
}

    ['Duplicate Employee Records', (function(){ const g=findEmployeeDuplicateGroups(); const n=g.reduce((a,x)=>a+x.employees.length,0); return n?`<span style="color:var(--brick);">${n}</span>`:'0'; })()],
    ['Last Employee Merge', (function(){ const m=(State.employeeMerges||[])[0]; return m?escapeHtml(new Date(m.ts).toLocaleString('id-ID'))+' → '+escapeHtml(m.canonicalCode||m.canonicalEmployeeId):'<span class="faint">never</span>'; })()],
    ['Last Smart Import Unique Employees', (function(){ const s=State.lastSmartImportUnique; return s?`${s.uniqueEmployees} of ${s.rows} row(s) (${s.newEmployees} new · ${s.matchedEmployees} matched)`:'<span class="faint">—</span>'; })()],
    ['Contracts', String(State.contracts.length)],

// Integrity findings block (Phase 14) — read-only, never deletes anything.
function buildIntegrityHTML(res){
  if(!res) return '';
  const head = `<p class="hint" style="margin-bottom:8px;">Ran ${escapeHtml(new Date(res.ranAt).toLocaleString('id-ID'))} · ${res.counts.critical} critical · ${res.counts.warning} warning · ${res.counts.info} info. Findings are reported only — nothing is deleted or changed automatically.</p>`;
  if(!res.findings.length) return head + `<div class="insight-item good" style="display:block;">No integrity issues detected. All records have valid IDs, links, dates, and amounts.</div>`;
  return head + `<div class="insight-list">${res.findings.map(f=>`<div class="insight-item ${f.severity==='critical'?'warn':f.severity==='warning'?'warn':''}">${severityPill(f.severity)} <span style="margin-left:6px;">${escapeHtml(f.message)}</span></div>`).join('')}</div>`;
}
