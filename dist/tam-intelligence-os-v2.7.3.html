/* ============================================================
   SMART IMPORT & MASTER DATA SYNC ENGINE (v2.4.0, Parts 1-12)
   Extracts employees / contracts / payroll from a payroll workbook,
   matches them against master data, lets the user review conflicts,
   then commits with structured IDs, an audit batch, and undo.
   Nothing is written to storage during parsing/review — only on Commit.
   ============================================================ */

/* ---------- extraction (Parts 3, 4) ---------- */
function parseProgressText(text){
  const m = /(?:^|[^\d])(\d{1,2})\s*\/\s*(\d{1,2})(?:[^\d]|$)/.exec(String(text||''));
  if(m){ const cur=+m[1], tot=+m[2]; if(tot>=1 && tot<=60 && cur>=0 && cur<=tot) return {current:cur, total:tot}; }
  return null;
}
function parseContractNumber(text){
  const m = /(\d+\s*\/\s*[A-Za-z0-9.\-]+\s*\/\s*[IVXLCDM]+\s*\/\s*\d{4})/.exec(String(text||''));
  return m ? m[1].replace(/\s+/g,'') : null;
}
// Roman month/year embedded in a contract number (e.g. XI/2025) — supporting evidence only.
function contractNumberMonthYear(cn){
  const m = /\/([IVXLCDM]+)\/(\d{4})\s*$/.exec(cn||'');
  if(!m) return null;
  const rom={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
  const mn = rom[m[1].toUpperCase()]; if(!mn) return null;
  return {monthNum:mn, year:+m[2]};
}
function parseRpValue(text){
  const m = /Rp\s*([\d.,]+)/i.exec(String(text||''));
  if(!m) return null;
  const v = Number(m[1].replace(/[.,]/g,''));
  return isFinite(v) ? v : null;
}
function extractEmployeeName(text){
  const lines = String(text||'').split(/[\n\r]+/).map(s=>s.trim()).filter(Boolean);
  for(const ln of lines){
    if(parseContractNumberFlexible(ln) || looksLikeContractNumber(ln)) continue;  // v2.5.1 flexible
    if(/^\d{1,2}(?:[.,]\d)?\s*\/\s*\d{1,2}$/.test(ln)) continue;                    // bare progress
    if(/^rp\b|^\d[\d.,]*$/i.test(ln)) continue;
    if(/^bulan\b/i.test(ln)) continue;                                             // "bulan Juni" note
    return ln;
  }
  return (lines[0]||'').trim();
}
// Infer the proposed contract start: Payroll Month − (current − 1), first of month.
// v2.5.1 — current may be fractional (e.g. 8,5/12); round to the nearest whole month.
function inferContractStart(monthKey, current){
  if(current==null || current<1) return null;
  const cur = Math.round(current);
  const abs = keyAbs(monthKey) - (cur-1);
  const y = Math.floor(abs/12), m = (abs%12)+1;
  return mkKey(y,m)+'-01';
}
// Extract payroll rows from the parsed workbook's salary (Gaji / code A) items.
function smartExtractRows(rawBatches){
  const rows = [];
  (rawBatches||[]).forEach(batch=>{
    (batch.categories||[]).forEach(cat=>{
      const isGaji = cat.code==='A' || /gaji|salary|payroll/i.test(cat.name||'');
      if(!isGaji) return;
      (cat.items||[]).forEach(it=>{
        const text = it.uraian || '';
        // v2.5.1 — full evidence text = name cell + sub-rows (letterdoc) for regex fallback.
        const evidence = [text, ...((it.subLines||[]))].filter(Boolean).join('\n');
        const planned = it.jumlahRencana||0;
        const actual = (it.jumlahRealisasi===undefined) ? null : it.jumlahRealisasi;
        // Prefer structured fields carried from the parser; fall back to regex on the evidence text.
        const hasStructProgress = (it.progressCurrent!=null || it.progressTotal!=null);
        const prog = hasStructProgress ? {current:it.progressCurrent, total:it.progressTotal} : parseProgressFlexible(evidence);
        const employeeName = (it.employeeName && String(it.employeeName).trim()) || extractEmployeeName(evidence);
        const contractNumber = (it.contractNumber && String(it.contractNumber).trim()) || parseContractNumberFlexible(evidence);
        const salary = (it.salary!=null && it.salary!=='') ? Number(it.salary)||0 : (planned || parseRpValue(evidence) || 0);
        rows.push({
          importRowId: uid('irow'), monthKey: batch.key, month: batch.monthName, year: batch.year, monthNum: batch.monthNum,
          rawText: text, evidenceText: evidence, subLines: it.subLines||[], originalPlanned: planned, originalActual: actual,
          employeeName, contractNumber,
          progressCurrent: prog?prog.current:null, progressTotal: prog?prog.total:null,
          progressRaw: prog ? (prog.current+'/'+prog.total) : null,
          salary, planned, actual, overtime:0, allowance:0, deduction:0,
          workingHoursPerDay: it.workingHoursPerDay!=null?it.workingHoursPerDay:null,
          workingDaysPerWeek: it.workingDaysPerWeek!=null?it.workingDaysPerWeek:null,
          overtimeHours: it.overtimeHours!=null?it.overtimeHours:null,
          // v2.5.2 — supporting identity evidence for cross-month employee grouping
          bankAccount: it.bankAccount||null, bankName: it.bankName||null, email: it.email||null,
        });
      });
    });
  });
  return rows;
}

/* ---------- matching (Parts 5, 6) ---------- */
function smartMatchEmployee(row){
  const nn = normStr(row.employeeName);
  if(!nn) return {status:'No Match', employee:null, confidence:0};
  const exact = State.employees.find(e=>normStr(e.fullName)===nn);
  if(exact) return {status:'Exact', employee:exact, confidence:1};
  let best=null, score=0;
  State.employees.forEach(e=>{ const s=similarText(e.fullName, row.employeeName); if(s>score){ score=s; best=e; } });
  if(best && score>=0.9) return {status:'High Confidence', employee:best, confidence:score};
  if(best && score>=0.72) return {status:'Needs Review', employee:best, confidence:score};
  return {status:'No Match', employee:null, confidence:score};
}
function smartMatchContract(row, empMatch){
  const emp = empMatch.employee;
  // Start inference: progress relative to the payroll month is primary (most precise); the
  // contract number's own month/year is only supporting evidence used when progress is absent.
  const cnMY = row.contractNumber ? contractNumberMonthYearFlex(row.contractNumber) : null;
  const startFromCN = cnMY ? (mkKey(cnMY.year, cnMY.monthNum)+'-01') : null;
  const startFromProgress = inferContractStart(row.monthKey, row.progressCurrent);
  const inferredStart = startFromProgress || startFromCN;
  if(row.contractNumber){
    const byNum = State.contracts.find(c=>normStr(c.contractNumber)===normStr(row.contractNumber));
    if(byNum){
      // Conflicts are only raised against EXISTING master data — never overwritten automatically.
      const conflicts=[];
      if(row.progressTotal && byNum.durationMonths && +byNum.durationMonths!==row.progressTotal) conflicts.push({field:'Duration', existing:byNum.durationMonths, imported:row.progressTotal});
      if(startFromProgress && byNum.startDate && byNum.startDate.slice(0,7)!==startFromProgress.slice(0,7)) conflicts.push({field:'Start', existing:byNum.startDate, imported:startFromProgress});
      if(row.salary && byNum.monthlySalary && Math.abs(byNum.monthlySalary-row.salary)>1) conflicts.push({field:'Salary', existing:byNum.monthlySalary, imported:row.salary});
      return {status: conflicts.length?'Conflict':'Existing', contract:byNum, conflicts, inferredStart};
    }
  }
  if(emp && row.progressTotal && startFromProgress){
    const match = State.contracts.find(c=>c.employeeId===emp.id && +c.durationMonths===row.progressTotal && c.startDate && c.startDate.slice(0,7)===startFromProgress.slice(0,7));
    if(match) return {status:'Existing', contract:match, conflicts:[], inferredStart};
  }
  // v2.5.1 — no contract number AND no progress: infer a default contract from the payroll month
  // instead of blocking. Still flagged (missingInfo) so it is reviewed, not silently guessed.
  if(!row.contractNumber && row.progressTotal==null){
    return {status:'New', contract:null, conflicts:[], inferredStart:(row.monthKey+'-01'), missingInfo:true};
  }
  return {status:'New', contract:null, conflicts:[], inferredStart};
}

/* ============================================================
   EMPLOYEE DEDUPLICATION & MASTER DATA CONSOLIDATION (v2.5.2)
   Employees are master data — one record per real person. Smart Import
   builds ONE canonical employee index across the whole workbook and all
   existing TAM data, then reuses the same employeeId across every month.
   ============================================================ */

// Part 2 — shared employee-name normalization. Trims, collapses spaces,
// removes line breaks, normalizes apostrophes/hyphens and trailing harmless
// punctuation, case-insensitive. The original display name is preserved
// separately by the caller. Genuinely different names are never merged.
function normalizeEmployeeName(name){
  return String(name==null?'':name)
    .replace(/[\r\n\t]+/g,' ')                 // remove accidental line breaks
    .replace(/[‘’ʼ`´']/g,"'")  // normalize apostrophes
    .replace(/[‐-―−\-]+/g,'-')  // normalize hyphens/dashes
    .replace(/\s+/g,' ')                        // collapse repeated spaces
    .trim()
    .replace(/[.,;:]+$/,'')                     // trailing harmless punctuation
    .trim()
    .toLowerCase();
}

// Part 6 helpers — how many linked records reference an employee, contact/bank
// completeness, and the employee sequence number (from the EMP-xxx code).
function employeeLinkCount(id){
  return State.contracts.filter(c=>c.employeeId===id).length
    + State.payrollPlans.filter(p=>p.employeeId===id).length
    + State.txns.filter(t=>t.employeeId===id).length
    + State.overtimeRecords.filter(o=>o.employeeId===id).length
    + State.payrollAdjustments.filter(a=>a.employeeId===id).length;
}
function employeeCompleteness(e){
  let s=0; ['bankAccount','email','phone','department','jobTitle','joinDate','monthlyBaseSalary'].forEach(f=>{ if(e[f]!=null && String(e[f]).trim()!=='') s++; }); return s;
}
function employeeSeqNum(e){ const m=/(\d+)/.exec(e&&e.employeeId||''); return m?+m[1]:Infinity; }
// Canonical-record priority: most linked records → most complete profile → oldest createdAt → lowest sequence.
function pickCanonicalEmployee(list){
  return list.slice().sort((a,b)=>{
    const lc=employeeLinkCount(b.id)-employeeLinkCount(a.id); if(lc) return lc;
    const cc=employeeCompleteness(b)-employeeCompleteness(a); if(cc) return cc;
    const ta=Date.parse(a.createdAt||'')||Infinity, tb=Date.parse(b.createdAt||'')||Infinity; if(ta!==tb) return ta-tb;
    return employeeSeqNum(a)-employeeSeqNum(b);
  })[0];
}

// Part 3 — resolve one workbook candidate to an existing employee using the
// matching priority: (2) existing contract already linked to a person, then
// (3) exact normalized full name. Bank/email/salary are supporting evidence
// only — never merge on fuzzy similarity or on salary alone.
function resolveEmployeeCandidate(cand){
  for(const cn of cand.contractNumbers){
    const ct = State.contracts.find(c=>c.contractNumber && normStr(c.contractNumber)===normStr(cn) && c.employeeId);
    if(ct){ const e=State.employees.find(x=>x.id===ct.employeeId); if(e) return {matchedEmployee:e, matchedEmployeeId:e.id, status:'Exact Existing Match', confidence:0.98, via:'contract'}; }
  }
  const byName = State.employees.filter(e=>normalizeEmployeeName(e.fullName)===cand.key);
  if(byName.length===1) return {matchedEmployee:byName[0], matchedEmployeeId:byName[0].id, status:'Exact Existing Match', confidence:1, via:'name'};
  if(byName.length>1){
    const canon = pickCanonicalEmployee(byName);
    return {matchedEmployee:canon, matchedEmployeeId:canon.id, status:'Possible Duplicate', confidence:0.9, via:'name-dup', possibleDuplicate:true, dupGroupIds:byName.map(e=>e.id)};
  }
  return {matchedEmployee:null, matchedEmployeeId:null, status:'New Employee', confidence: cand.sourceNames.size>1?0.85:0.95, via:'new'};
}

// Parts 1 & 4 — scan ALL workbook rows first and group into unique employee
// candidates (one per normalized name). Every monthly row for the same person
// references the same candidate. Sets row._candidateKey. Returns a Map.
function buildEmployeeCandidates(rows){
  const map = new Map();
  (rows||[]).forEach(row=>{
    const key = normalizeEmployeeName(row.employeeName);
    if(!key){ row._candidateKey=null; return; }
    let cand = map.get(key);
    if(!cand){
      cand = {key, canonicalName:(row.employeeName||'').trim(), sourceNames:new Set(), workbookMonths:new Set(),
        contractNumbers:new Set(), salariesObserved:new Set(), bankAccountsObserved:new Set(), emailsObserved:new Set(), sourceRowIds:[]};
      map.set(key, cand);
    }
    if(row.employeeName) cand.sourceNames.add(String(row.employeeName).trim());
    if(row.monthKey) cand.workbookMonths.add(row.monthKey);
    if(row.contractNumber) cand.contractNumbers.add(row.contractNumber);
    if(row.salary) cand.salariesObserved.add(row.salary);
    if(row.bankAccount) cand.bankAccountsObserved.add(String(row.bankAccount));
    if(row.email) cand.emailsObserved.add(String(row.email).toLowerCase());
    cand.sourceRowIds.push(row.importRowId);
    row._candidateKey = key;
  });
  map.forEach(cand=>{ Object.assign(cand, resolveEmployeeCandidate(cand)); });
  return map;
}

// Map a resolved candidate to the empMatch shape the rest of Smart Import expects.
function candidateEmpMatch(cand){
  if(!cand) return {status:'No Match', employee:null, confidence:0, candidateStatus:null};
  if(cand.status==='Exact Existing Match') return {status:'Exact', employee:cand.matchedEmployee, confidence:cand.confidence, candidateStatus:cand.status};
  if(cand.status==='Possible Duplicate')  return {status:'Needs Review', employee:cand.matchedEmployee, confidence:cand.confidence, candidateStatus:cand.status, possibleDuplicate:true};
  return {status:'No Match', employee:null, confidence:cand.confidence, candidateStatus:cand.status};
}

/* ---------- model (Part 7) ---------- */
function buildSmartImport(rawBatches, fileName){
  const rows = smartExtractRows(rawBatches);
  const months = [...new Set(rows.map(r=>r.monthKey))];
  const candidates = buildEmployeeCandidates(rows);   // workbook-wide grouping (Parts 1,4); sets row._candidateKey
  const items = rows.map(row=>{
    const cand = row._candidateKey ? candidates.get(row._candidateKey) : null;
    const empMatch = candidateEmpMatch(cand);
    const ctMatch = smartMatchContract(row, empMatch);
    const reviewRequired = empMatch.status==='Needs Review' || ctMatch.status==='Conflict' || ctMatch.missingInfo || !row.employeeName || !!(cand&&cand.possibleDuplicate);
    const actions = {
      createEmployee: !!(cand && !cand.matchedEmployeeId) && !!row.employeeName,  // resolved once per candidate at commit
      linkEmployee: !!(cand && cand.matchedEmployeeId),
      createContract: ctMatch.status==='New',
      updateContract: false,          // never auto-update
      generatePayroll: true,
      createTransaction: true,
      skip: false,
    };
    const proposed = {
      contractNumber: row.contractNumber || null,
      start: ctMatch.inferredStart, duration: row.progressTotal || Number(State.settings.defaultContractDuration)||12,
      salary: row.salary,
    };
    return {row, candidateKey: row._candidateKey, empMatch, ctMatch, actions, reviewRequired, proposed, selected: !reviewRequired};
  });
  // Record workbook-wide unique-employee count for diagnostics.
  State.lastSmartImportUnique = {ts:new Date().toISOString(), fileName, rows:rows.length, uniqueEmployees:candidates.size,
    newEmployees:[...candidates.values()].filter(c=>!c.matchedEmployeeId).length,
    matchedEmployees:[...candidates.values()].filter(c=>c.matchedEmployeeId).length};
  return {fileName, createdAt:new Date().toISOString(), batchId:uid('imp'), rows, items, months, candidates,
    mapping: LAST_COLUMN_MAPPING ? Object.assign({}, LAST_COLUMN_MAPPING) : null,
    source: (rawBatches[0] && rawBatches[0].source) || (LAST_COLUMN_MAPPING && LAST_COLUMN_MAPPING.source) || 'unknown'};
}

// v2.5.1 — rebuild the whole Smart Import model from a manually overridden generic column map.
function rebuildSmartImportFromOverride(model, overrideColMap){
  const map = model.mapping;
  if(!map || map.source!=='generic' || !map.rows) return model;
  const items = buildGenericItems(map.rows, map.headerIdx, overrideColMap);
  const batches = groupGenericBatches(items);
  // refresh mapping report so recognized/unrecognized reflect the override
  parseGenericTable(map.rows); // recomputes LAST_COLUMN_MAPPING base
  if(LAST_COLUMN_MAPPING){ LAST_COLUMN_MAPPING.colMap = Object.assign({}, overrideColMap); LAST_COLUMN_MAPPING.rows = map.rows; LAST_COLUMN_MAPPING.sheetName = map.sheetName; }
  const fresh = buildSmartImport(batches, model.fileName);
  return fresh;
}
function smartCounts(model){
  const c={months:model.months.length, rows:model.items.length, employees:0, matchedEmp:0, newEmp:0, contracts:0, matchedCt:0, newCt:0, conflicts:0, reviewRequired:0, ready:0, skipped:0, payroll:0, txns:0, duplicates:0,
    uniqueEmployees:0, existingMatched:0, newEmployees:0, possibleDuplicates:0};
  // v2.5.2 — employee counts are workbook-wide UNIQUE candidates, not per-row.
  const cands = model.candidates ? [...model.candidates.values()] : [];
  c.uniqueEmployees = cands.length;
  c.existingMatched = cands.filter(x=>x.matchedEmployeeId && !x.possibleDuplicate).length;
  c.newEmployees   = cands.filter(x=>!x.matchedEmployeeId).length;
  c.possibleDuplicates = cands.filter(x=>x.possibleDuplicate).length;
  c.matchedEmp = c.existingMatched; c.newEmp = c.newEmployees; c.employees = c.uniqueEmployees;
  // Unique contracts = distinct (candidate + contract number), plus one AUTO contract per candidate that has missing-info rows.
  const ctKeys = new Set(), matchedCtIds = new Set(), autoEmp = new Set();
  model.items.forEach(i=>{
    if(i.ctMatch.status==='Conflict') c.conflicts++;
    if(i.reviewRequired) c.reviewRequired++;
    if(i.actions.skip) c.skipped++;
    else if(!i.reviewRequired) c.ready++;
    if(i.actions.generatePayroll) c.payroll++;
    if(i.actions.createTransaction) c.txns++;
    if(i.ctMatch.contract){ matchedCtIds.add(i.ctMatch.contract.id); }
    else if(i.row.contractNumber){ ctKeys.add((i.candidateKey||'?')+'|'+normStr(i.row.contractNumber)); }
    else if(i.candidateKey){ autoEmp.add(i.candidateKey); }
    // duplicate payroll (employee+contract+month already exists)
    const emp=i.empMatch.employee; const ct=i.ctMatch.contract;
    if(emp && State.payrollPlans.some(p=>p.monthKey===i.row.monthKey && p.employeeId===emp.id && (ct?p.contractId===ct.id:true))) c.duplicates++;
  });
  c.newCt = ctKeys.size + autoEmp.size;
  c.matchedCt = matchedCtIds.size;
  c.contracts = c.newCt + c.matchedCt;
  return c;
}

/* ---------- commit (Parts 9, 10, 11) ---------- */
async function commitSmartImport(model){
  const now = new Date().toISOString(), batchId = model.batchId;
  // Part 11 — automatic safety backup + audit before commit.
  State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-Smart-Import backup ('+model.fileName+')', timestamp:now, txns:JSON.parse(JSON.stringify(State.txns)), migration:true});
  await saveBackups();
  const created = {employees:[], contracts:[], payrollPlans:[], txns:[], monthlyPlanTxns:[]};
  let skipped=0, dupSkipped=0, contractConflicts=0;
  // Part 9 — ONE shared employee-resolution map for the whole commit, plus a
  // per-employee contract map so the same contract number is never duplicated
  // across months. Employees are never created independently per monthly row.
  const empMap = new Map();       // candidateKey -> employeeId
  const ctMap  = new Map();       // employeeId + '|' + contractKey -> contractId
  const candidateMap = {};        // candidateKey -> employeeId (persisted for re-import stability)

  // Phase A — resolve or create each unique employee candidate exactly once.
  const selByCand = new Map();
  model.items.forEach(i=>{ if(!i.selected || i.actions.skip || !i.candidateKey) return; if(!selByCand.has(i.candidateKey)) selByCand.set(i.candidateKey, []); selByCand.get(i.candidateKey).push(i); });
  selByCand.forEach((items, key)=>{
    const cand = model.candidates.get(key);
    const existingId = cand && cand.matchedEmployeeId;
    if(existingId && State.employees.some(e=>e.id===existingId)){ empMap.set(key, existingId); candidateMap[key]=existingId; return; }
    const first = items[0].row;
    const emp = {id:uid('emp'), employeeId:nextEmployeeCode(), fullName:(cand&&cand.canonicalName)||first.employeeName, employmentStatus:'Active', active:true,
      monthlyBaseSalary: first.salary||null,
      bankAccount: (items.map(x=>x.row.bankAccount).find(Boolean))||null,
      email: (items.map(x=>x.row.email).find(Boolean))||null,
      source:'Smart Import', importBatchId:batchId, candidateKey:key, createdAt:now, updatedAt:now,
      history:[{event:'created', ts:now, note:'Created by Smart Import from '+model.fileName+' — canonical across '+((cand&&cand.workbookMonths.size)||1)+' month(s)'}]};
    State.employees.push(emp); created.employees.push(emp.id); empMap.set(key, emp.id); candidateMap[key]=emp.id;
  });

  // Phase B — contracts (deduped per employee + contract number), payroll, transactions.
  for(const item of model.items){
    if(!item.selected || item.actions.skip){ skipped++; continue; }
    const row = item.row;
    const empId = item.candidateKey ? empMap.get(item.candidateKey) : null;
    const emp = empId ? State.employees.find(e=>e.id===empId) : null;
    if(!emp){ skipped++; continue; }
    let ct = item.ctMatch.contract || null;   // existing matched contract (reused)
    if(!ct){
      const cnKey = row.contractNumber ? normStr(row.contractNumber) : 'AUTO';
      const mapKey = emp.id+'|'+cnKey;
      if(ctMap.has(mapKey)){ ct = State.contracts.find(c=>c.id===ctMap.get(mapKey)) || null; } // reuse within this commit
      // v2.5.2 — re-import safety for missing-info rows: reuse this employee's existing AUTO
      // contract instead of creating a duplicate one (AUTO contracts have no number to match).
      if(!ct && !row.contractNumber){
        const existingAuto = State.contracts.find(c=>c.employeeId===emp.id && (/^AUTO-/.test(c.contractNumber||'') || (c.importEvidence && c.importEvidence.startInferred)));
        if(existingAuto){ ct = existingAuto; ctMap.set(mapKey, ct.id); }
      }
      if(!ct && row.contractNumber){
        // Part 5 — same contract number on a DIFFERENT employee = critical conflict; never link across people.
        const clash = State.contracts.find(c=>c.contractNumber && normStr(c.contractNumber)===cnKey && c.employeeId && c.employeeId!==emp.id);
        if(clash) contractConflicts++;
      }
      if(!ct && item.actions.createContract){
        const start = item.proposed.start || (row.monthKey+'-01');
        ct = {id:uid('ct'), employeeId:emp.id, employeeName:emp.fullName,
          contractNumber: row.contractNumber || ('AUTO-'+emp.employeeId),
          startDate:start, durationMonths:item.proposed.duration, monthlySalary:item.proposed.salary||row.salary||null,
          status:'Active', source:'Smart Import', importBatchId:batchId,
          importEvidence:{progress: row.progressCurrent!=null?(row.progressCurrent+'/'+row.progressTotal):null, fromMonth:row.monthKey, contractNumberRaw:row.contractNumber, startInferred:!row.contractNumber},
          createdAt:now, updatedAt:now,
          history:[{event:'created', ts:now, note:'Created by Smart Import — start '+(row.contractNumber?'from contract evidence':'inferred from payroll month + progress')}]};
        State.contracts.push(ct); created.contracts.push(ct.id); ctMap.set(mapKey, ct.id);
      }
    }
    if(item.actions.generatePayroll){
      const dup = State.payrollPlans.find(p=>p.monthKey===row.monthKey && p.employeeId===emp.id && (ct? p.contractId===ct.id : true));
      if(dup){ dupSkipped++; continue; } // Prevent duplicates: Employee + Contract + Month
      const mo = keyToMonthObj(row.monthKey);
      const plannedAmt = (row.planned||row.salary||0) + num(row.overtime) + num(row.allowance) - num(row.deduction);
      // v2.5.1 — progress snapshot derives from the structured contract when available
      // (calculated from start + duration + month); raw N/M is only a fallback label.
      const progress = ct ? contractCalc(ct,row.monthKey).progress : (row.progressCurrent!=null ? (Math.round(row.progressCurrent)+'/'+(row.progressTotal||'')) : null);
      const pp = {id:uid('pp'), monthKey:row.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
        employeeId:emp.id, employeeName:emp.fullName, contractId:ct?ct.id:null, contractNumber:ct?ct.contractNumber:row.contractNumber, contractProgress:progress,
        baseSalary:row.salary||0, overtime:num(row.overtime), allowance:num(row.allowance), deduction:num(row.deduction), bonus:0, benefits:0, otherAdjustment:0, overtimeIds:[],
        plannedAmount:plannedAmt, actual:(row.actual!=null?row.actual:null), notes:'Imported', status:'Committed',
        source:'Smart Import', importBatchId:batchId, importRowId:row.importRowId, createdAt:now, updatedAt:now};
      State.payrollPlans.push(pp); created.payrollPlans.push(pp.id);
      if(item.actions.createTransaction){
        const mplan = ensureMonthlyPlan(row.monthKey);
        const uraian = `${emp.fullName}${ct?' · '+ct.contractNumber:''}${progress?' · '+progress:''}`;
        const txn = {id:uid('pay'), monthKey:row.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
          category:State.settings.defaultPayrollCategory||'Gaji', categoryCode:'A', no:null, uraian, vol:1, satuan:'bulan', hargaSatuan:plannedAmt,
          planned:plannedAmt, actual:(row.actual!=null?row.actual:null), type:'expense', txnDate:null, source:'payroll', unplanned:false,
          scheduledDate:null, paymentMethod:null, bankAccount:null, referenceNumber:null, notes:'Smart Import', vendor:null,
          execution:null, status:'planned', employeeId:emp.id, contractId:ct?ct.id:null, payrollPlanId:pp.id, overtimeIds:[],
          monthlyPlanId:mplan.id, importBatchId:batchId, importRowId:row.importRowId,
          payrollMeta:{employeeName:emp.fullName, contractNumber:ct?ct.contractNumber:row.contractNumber, contractProgress:progress},
          history:[{event:'created', ts:now, note:'Created by Smart Import'}]};
        if(txn.actual!=null){ txn.status = computeStatus(txn); if(txn.actual>0){ txn.execution={executionDate:null, actualAmount:txn.actual, method:null, bank:null, reference:null, notes:'Imported as realized', executedBy:'—', executionId:uid('exec'), ts:now}; txn.history.push({event:'executed', ts:now, note:'Imported realized amount '+fmtIDR(txn.actual), amount:txn.actual}); } }
        State.txns.push(txn); pp.committedTxnId=txn.id; created.txns.push(txn.id);
        if(!mplan.committedTxnIds.includes(txn.id)){ mplan.committedTxnIds.push(txn.id); created.monthlyPlanTxns.push(txn.id); }
        mplan.status='Committed';
      }
    }
  }
  const audit = {batchId, fileName:model.fileName, ts:now, mode:'smart', created, candidateMap,
    uniqueEmployees: Object.keys(candidateMap).length,
    counts:{employees:created.employees.length, contracts:created.contracts.length, payrollPlans:created.payrollPlans.length, txns:created.txns.length, skipped, duplicatesSkipped:dupSkipped, contractConflicts, uniqueEmployees:Object.keys(candidateMap).length}, undone:false};
  State.importBatches.unshift(audit);
  await saveAllData();
  const c=audit.counts;
  logActivity({type:'import.commit', module:'Import', entity:model.fileName||'Smart Import', entityId:batchId,
    desc:`Committed — ${c.employees} employee(s), ${c.contracts} contract(s), ${c.payrollPlans} payroll plan(s), ${c.txns} transaction(s)${c.skipped?', '+c.skipped+' skipped':''}`,
    refs:{importBatchId:batchId}});
  return audit;
}

/* ---------- undo (Part 11) ---------- */
function smartRollbackPreview(batch){
  const c = batch.created;
  const removableTxns = c.txns.filter(id=>{ const t=findTxn(id); return t && t.actual==null && statusOf(t)==='planned' && (!t.history || t.history.length<=1); });
  return {removableTxns, blockedTxns: c.txns.length - removableTxns.length, employees:c.employees.length, contracts:c.contracts.length, payrollPlans:c.payrollPlans.length};
}
async function undoLastSmartImport(){
  const batch = State.importBatches.find(b=>!b.undone);
  if(!batch){ showWarning('No Smart Import batch available to undo.'); return; }
  const pv = smartRollbackPreview(batch);
  if(!confirmAction(`Undo Smart Import "${batch.fileName}"?\n\nWill remove: ${pv.employees} employee(s), ${pv.contracts} contract(s), ${pv.payrollPlans} payroll plan(s), ${pv.removableTxns.length} planned transaction(s).\n${pv.blockedTxns?('\n'+pv.blockedTxns+' executed or modified transaction(s) will be KEPT (rollback never removes them).'):''}`)) return;
  const c = batch.created;
  const removeTxn = new Set(pv.removableTxns);
  State.txns = State.txns.filter(t=>!removeTxn.has(t.id));
  // Drop created payroll plans unless their transaction survived (executed/kept).
  State.payrollPlans = State.payrollPlans.filter(p=>!c.payrollPlans.includes(p.id) || (p.committedTxnId && !removeTxn.has(p.committedTxnId)));
  const refEmp = new Set([].concat(State.txns.map(t=>t.employeeId), State.payrollPlans.map(p=>p.employeeId)).filter(Boolean));
  const refCt = new Set([].concat(State.txns.map(t=>t.contractId), State.payrollPlans.map(p=>p.contractId)).filter(Boolean));
  State.contracts = State.contracts.filter(ct=>!c.contracts.includes(ct.id) || refCt.has(ct.id));
  State.employees = State.employees.filter(e=>!c.employees.includes(e.id) || refEmp.has(e.id));
  // Clean removed txn ids out of monthly plans.
  State.monthlyPlans.forEach(mp=>{ if(Array.isArray(mp.committedTxnIds)) mp.committedTxnIds = mp.committedTxnIds.filter(id=>!removeTxn.has(id)); });
  batch.undone = true; batch.undoneAt = new Date().toISOString(); batch.keptTxns = pv.blockedTxns;
  await saveAllData();
  showSuccess(`Smart Import undone.${pv.blockedTxns?(' '+pv.blockedTxns+' executed/modified record(s) preserved.'):''}`, 6000);
  render();
}

/* ============================================================
   EMPLOYEE DUPLICATE REVIEW & MERGE (Parts 6, 7, 11, 12)
   Detect-only; never merges without explicit user confirmation.
   ============================================================ */
const MERGE_PROFILE_FIELDS = ['bankAccount','email','phone','jobTitle','department','joinDate','monthlyBaseSalary','employmentStatus'];

// Groups of existing employees that share a normalized name (Part 6 detection).
function findEmployeeDuplicateGroups(){
  const byKey = new Map();
  State.employees.forEach(e=>{ const k=normalizeEmployeeName(e.fullName); if(!k) return; if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(e); });
  const groups=[];
  byKey.forEach((emps,key)=>{ if(emps.length>1) groups.push({key, name:emps[0].fullName, employees:emps, canonical:pickCanonicalEmployee(emps)}); });
  return groups;
}
// All records linked to an employee id.
function employeeLinkedRecords(id){
  return {
    contracts: State.contracts.filter(c=>c.employeeId===id),
    payrollPlans: State.payrollPlans.filter(p=>p.employeeId===id),
    txns: State.txns.filter(t=>t.employeeId===id),
    overtime: State.overtimeRecords.filter(o=>o.employeeId===id),
    adjustments: State.payrollAdjustments.filter(a=>a.employeeId===id),
  };
}
function employeeLinkTotals(id){ const r=employeeLinkedRecords(id); return {contracts:r.contracts.length, payrollPlans:r.payrollPlans.length, txns:r.txns.length, overtime:r.overtime.length, adjustments:r.adjustments.length}; }

// Part 7 — merge duplicates into one canonical employee. Backup first; relink
// every record; never delete contracts/payroll/txns/overtime or change amounts;
// apply only chosen profile values; write an audit record.
async function mergeEmployeeGroup(canonicalId, duplicateIds, profileChoices){
  const now = new Date().toISOString();
  const canon = State.employees.find(e=>e.id===canonicalId);
  if(!canon || !duplicateIds.length) return null;
  const dupSet = new Set(duplicateIds.filter(id=>id!==canonicalId));
  if(!dupSet.size) return null;
  // Complete safety backup (full master-data snapshot + transactions).
  State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-employee-merge backup ('+canon.fullName+')', timestamp:now, migration:true,
    txns: JSON.parse(JSON.stringify(State.txns)),
    masterSnapshot: JSON.parse(JSON.stringify({employees:State.employees, contracts:State.contracts, payrollPlans:State.payrollPlans, overtimeRecords:State.overtimeRecords, payrollAdjustments:State.payrollAdjustments}))});
  await saveBackups();
  const relinked = {contracts:[], payrollPlans:[], txns:[], overtime:[], adjustments:[]};
  State.contracts.forEach(c=>{ if(dupSet.has(c.employeeId)){ c.employeeId=canonicalId; c.employeeName=canon.fullName; c.updatedAt=now; relinked.contracts.push(c.id);} });
  State.payrollPlans.forEach(p=>{ if(dupSet.has(p.employeeId)){ p.employeeId=canonicalId; p.employeeName=canon.fullName; p.updatedAt=now; relinked.payrollPlans.push(p.id);} });
  State.txns.forEach(t=>{ if(dupSet.has(t.employeeId)){ t.employeeId=canonicalId; if(t.payrollMeta) t.payrollMeta.employeeName=canon.fullName; relinked.txns.push(t.id);} });
  State.overtimeRecords.forEach(o=>{ if(dupSet.has(o.employeeId)){ o.employeeId=canonicalId; if(o.employeeName!==undefined) o.employeeName=canon.fullName; o.updatedAt=now; relinked.overtime.push(o.id);} });
  State.payrollAdjustments.forEach(a=>{ if(dupSet.has(a.employeeId)){ a.employeeId=canonicalId; a.updatedAt=now; relinked.adjustments.push(a.id);} });
  // Apply chosen profile values (user-selected; empties fall back to canonical's own value — never silent overwrite of non-empty).
  const appliedProfile={};
  MERGE_PROFILE_FIELDS.forEach(f=>{ if(profileChoices && profileChoices[f]!=null && profileChoices[f]!=='' ){ if(canon[f]!==profileChoices[f]){ canon[f]=profileChoices[f]; appliedProfile[f]=profileChoices[f]; } } });
  canon.updatedAt=now; canon.history=canon.history||[];
  canon.history.push({event:'merged', ts:now, note:`Merged ${dupSet.size} duplicate record(s) into this canonical employee`});
  // Remove the now-empty duplicate employee master records (their links were repointed).
  const removedCodes = State.employees.filter(e=>dupSet.has(e.id)).map(e=>e.employeeId||e.id);
  State.employees = State.employees.filter(e=>!dupSet.has(e.id));
  const auditRec = {id:uid('merge'), ts:now, canonicalEmployeeId:canonicalId, canonicalCode:canon.employeeId, canonicalName:canon.fullName,

// Rows that will actually be committed (selected and not skipped).
function smartSelectedCount(model){ return model ? model.items.filter(i=>i.selected && !i.actions.skip).length : 0; }

// Run a mutation that re-renders the wizard while preserving the review list's scroll position
// (both the inner .table-wrap and the window) and the focused control — restored AFTER layout via
// requestAnimationFrame, using focus({preventScroll:true}) so nothing is scrolled into view.
function preserveSmartImportView(main, mutate){
  const wrapBefore = main.querySelector('.table-wrap');
  const st = wrapBefore ? wrapBefore.scrollTop : 0;
  const sl = wrapBefore ? wrapBefore.scrollLeft : 0;
  const winY = (typeof window!=='undefined') ? (window.scrollY || window.pageYOffset || 0) : 0;
  const act = document.activeElement;
  let focusKey = null;
  if(act && act.dataset){
    if(act.dataset.sisel!=null) focusKey = {attr:'data-sisel', val:act.dataset.sisel};
    else if(act.dataset.simap!=null) focusKey = {attr:'data-simap', val:act.dataset.simap};
    else if(act.dataset.sitab!=null) focusKey = {attr:'data-sitab', val:act.dataset.sitab};
  }
  mutate();
  // Restore after the new DOM is laid out. Primary path is requestAnimationFrame (matches the
  // sidebar-scroll pattern); a guarded setTimeout backstop also runs it once even when the tab
  // is hidden (rAF is paused while hidden). Reading scrollHeight forces layout first so the
  // scrollTop assignment sticks instead of clamping against a stale height.
  let done = false;
  const restore = ()=>{
    if(done) return; done = true;
    const wrapAfter = main.querySelector('.table-wrap');
    if(wrapAfter){ void wrapAfter.scrollHeight; wrapAfter.scrollTop = st; wrapAfter.scrollLeft = sl; }
    if(typeof window!=='undefined' && typeof window.scrollTo==='function') window.scrollTo(0, winY);
    if(focusKey){
      const el = main.querySelector(`[${focusKey.attr}="${focusKey.val}"]`);
      if(el){ try{ el.focus({preventScroll:true}); }catch(_e){ try{ el.focus(); }catch(_e2){} } }
    }
  };
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(restore);
  setTimeout(restore, 0);
}

/* ============================================================
   NATIVE PAYROLL OPERATIONS ENGINE (v2.5.0)
   Persistent monthly payroll worksheet driven entirely by master
   data (employees, contracts, work schedules, approved overtime,
   recurring adjustments) — no Excel required for the monthly cycle.
   Payroll plans are the persistent records; review lifecycle is
   Draft → Reviewed → Ready → Committed (or Cancelled).
   ============================================================ */
const PAYROLL_STATUSES = ['Draft','Reviewed','Ready','Committed','Cancelled'];
const PAYROLL_STATUS_META = {
  'Draft':{pill:'pill-status-planned'}, 'Reviewed':{pill:'pill-status-scheduled'},
  'Ready':{pill:'pill-status-partial'}, 'Committed':{pill:'pill-status-completed'}, 'Cancelled':{pill:'pill-status-cancelled'},
};
const CYCLE_STATUSES = ['Not Generated','Draft','In Review','Ready to Commit','Committed','Partially Executed','Fully Executed'];

/* ---------- centralized payroll calculation (Part 5) ---------- */
function payrollBaseSalary(pp){ return num(pp.salaryOverride ? pp.salaryOverride.overridden : pp.baseSalary); }
function computePayrollPlanned(pp){
  // Full precision internally; round ONLY the final currency result.
  const base = payrollBaseSalary(pp);
  const ot = num(pp.overtimeAmount!=null ? pp.overtimeAmount : pp.overtime);
  const adds = num(pp.allowance)+num(pp.bonus)+num(pp.benefits)+num(pp.otherAddition!=null?pp.otherAddition:pp.otherAdjustment);
  const deds = num(pp.deduction)+num(pp.otherDeduction);
  return Math.round(base + ot + adds - deds);
}
function payrollIsNegative(pp){ return computePayrollPlanned(pp) < 0; }
function payrollTxnOf(pp){ return findTxn(pp.committedTxnId || pp.transactionId); }
function sameIdSet(a,b){ a=a||[]; b=b||[]; if(a.length!==b.length) return false; const sb=new Set(b); return a.every(x=>sb.has(x)); }

/* ---------- immutable overtime snapshot (v2.7.1) ----------
   Frozen at payroll posting/commit — the historical breakdown must survive later
   edits/deletion of the source overtime records. Per-ID basis mirrors the drift/
   supplemental money formula (approvedAmount when set, else calculatedAmount). */
function buildPayrollOvertimeSnapshot(ids){
  return (ids||[]).map(id=>{ const o=overtimeById(id); if(!o) return null;
    return {id:o.id, overtimeDate:o.overtimeDate||null, overtimeHours:num(o.overtimeHours),
      approvedAmount:(o.approvedAmount!=null?num(o.approvedAmount):null), calculatedAmount:num(o.calculatedAmount),
      workDescription:o.workDescription||'', statusAtCommit:o.status||null};
  }).filter(Boolean);
}
// Lightweight audit metadata for a frozen overtime snapshot array (v2.7.1). Stored alongside
// the snapshot on the committed transaction so Payroll Reporting and Integrity Checks can read
// recordCount / totalHours without re-iterating the array or re-resolving live overtime.
function overtimeSnapshotMeta(otSnap){
  otSnap = otSnap || [];
  return {recordCount: otSnap.length, totalHours: otSnap.reduce((s,o)=>s+num(o.overtimeHours),0)};
}
// A committed-payroll snapshot object stored on the plan at post time (v2.7.1). This is
// the strongest historical evidence and is never reconstructed from current master data.
function buildPayrollCommittedSnapshot(pp){
  const otSnap = buildPayrollOvertimeSnapshot(pp.overtimeIds||[]);
  const otAmt = num(pp.overtimeAmount!=null?pp.overtimeAmount:pp.overtime);
  return {baseSalary:payrollBaseSalary(pp), overtimeAmount:otAmt,
    overtimeHours:num(pp.overtimeHours), overtimeRecordCount:otSnap.length,
    totalPayroll:num(pp.plannedAmount!=null?pp.plannedAmount:computePayrollPlanned(pp)),
    overtimeSnapshot:otSnap, committedAt:new Date().toISOString(), schemaTag:'v2.7.1'};
}

/* ---------- stage-aware historical source-of-truth (v2.7.1, Part 5) ----------
   ONE centralized view model for how a payroll row should be displayed.
   Draft/Review/Approved → live working-plan values (unchanged behavior).
   Posted/Executed → immutable committed evidence, in priority order:
     1) explicit committed payroll snapshot on the plan (v2.7.1+)
     2) the immutable linked finance transaction
     3) persisted committed plan fields (broken linkage → integrity finding)
     4) legacy fallback (clearly marked)
   It NEVER reconstructs a historical payroll from current master data and never
   mutates the plan or its transaction. Unknown historical hours are returned as
   null (render "— / unavailable"), which is distinct from an explicit zero. */
function payrollHistoricalSnapshot(pp){
  if(!pp) return null;
  const stage = payrollStage(pp);
  const committed = (stage==='Posted' || stage==='Executed');
  const planTotal = num(pp.plannedAmount!=null?pp.plannedAmount:computePayrollPlanned(pp));
  const planOt = num(pp.overtimeAmount!=null?pp.overtimeAmount:pp.overtime);
  if(!committed){
    return {baseSalary:payrollBaseSalary(pp), overtimeAmount:planOt, overtimeHours:num(pp.overtimeHours),
      overtimeRecordCount:(pp.overtimeIds||[]).length, totalPayroll:planTotal,
      source:'working', sourceLabel:'Working plan', integrityStatus:'ok', differences:[]};
  }
  const txn = payrollTxnOf(pp);
  const diffs = [];
  // priority 1 — explicit committed snapshot on the plan
  const cs = pp.committedSnapshot;
  if(cs && cs.totalPayroll!=null){
    if(txn && Math.abs(num(txn.planned)-num(cs.totalPayroll))>1) diffs.push({label:'Committed snapshot vs posted transaction', a:num(cs.totalPayroll), b:num(txn.planned)});
    return {baseSalary:num(cs.baseSalary), overtimeAmount:num(cs.overtimeAmount),
      overtimeHours: cs.overtimeHours!=null?num(cs.overtimeHours):null,
      overtimeRecordCount: cs.overtimeRecordCount!=null?cs.overtimeRecordCount:(Array.isArray(cs.overtimeSnapshot)?cs.overtimeSnapshot.length:null),
      totalPayroll:num(cs.totalPayroll), overtimeSnapshot:Array.isArray(cs.overtimeSnapshot)?cs.overtimeSnapshot:null,
      source:'snapshot', sourceLabel:'Committed snapshot', integrityStatus: diffs.length?'mismatch':'ok', differences:diffs};
  }
  // priority 2 — the immutable linked finance transaction
  if(txn){
    const total = num(txn.planned);
    const ot = num(txn.overtimeAmount);
    const base = total - ot;
    let hours=null, recCount=null, src='transaction', srcLabel='Posted transaction';
    if(txn.overtimeSnapshotMeta){                                 // v2.7.1 frozen audit metadata (no recompute)
      hours = num(txn.overtimeSnapshotMeta.totalHours); recCount = num(txn.overtimeSnapshotMeta.recordCount);
    } else if(Array.isArray(txn.overtimeSnapshot) && txn.overtimeSnapshot.length){
      hours = txn.overtimeSnapshot.reduce((s,o)=>s+num(o.overtimeHours),0); recCount = txn.overtimeSnapshot.length;
    } else {
      const ids = (txn.overtimeIds && txn.overtimeIds.length) ? txn.overtimeIds : (pp.overtimeIds||[]);
      const live = ids.map(overtimeById).filter(Boolean);
      if(ids.length && live.length===ids.length){ hours = live.reduce((s,o)=>s+num(o.overtimeHours),0); recCount = live.length; src='legacy-live'; srcLabel='Legacy (live overtime)'; }
      else if(ot===0){ hours = 0; recCount = ids.length; } // explicit known-zero overtime
      else { hours = null; recCount = ids.length || null; src='legacy-fallback'; srcLabel='Legacy (transaction only)'; } // unknown — do NOT invent
    }
    if(Math.abs(planTotal-total)>1) diffs.push({label:'Payroll plan total vs posted transaction', a:planTotal, b:total});
    if(Math.abs(planOt-ot)>1) diffs.push({label:'Payroll plan overtime vs committed overtime', a:planOt, b:ot});
    return {baseSalary:base, overtimeAmount:ot, overtimeHours:hours, overtimeRecordCount:recCount,
      totalPayroll:total, overtimeSnapshot:Array.isArray(txn.overtimeSnapshot)?txn.overtimeSnapshot:null,
      source:src, sourceLabel:srcLabel, integrityStatus: diffs.length?'mismatch':(src==='transaction'?'ok':'legacy'), differences:diffs};
  }
  // priority 3/4 — committed plan fields with no linked transaction (broken linkage)
  return {baseSalary:payrollBaseSalary(pp), overtimeAmount:planOt, overtimeHours:num(pp.overtimeHours),
    overtimeRecordCount:(pp.overtimeIds||[]).length, totalPayroll:planTotal, overtimeSnapshot:null,
    source:'plan-committed', sourceLabel:'Plan (no transaction)', integrityStatus:'no-transaction',
    differences:[{label:'Posted payroll has no linked finance transaction', a:planTotal, b:null}]};
}
// Convenience: is a committed row's displayed history in conflict with its evidence?
function payrollSnapshotHasIssue(pp){ const s=payrollHistoricalSnapshot(pp); return !!(s && (s.integrityStatus==='mismatch' || s.integrityStatus==='no-transaction')); }
// v2.7.x reporting aggregate (read-only) — combines the IMMUTABLE payroll snapshot with the
// committed supplementals linked to the same plan into a realized "total compensation". It NEVER
// mutates anything and NEVER redefines the base payroll total: baseTotal stays exactly
// payrollHistoricalSnapshot().totalPayroll, and supplemental is a separate, additive figure.
//   totalCompensation = baseTotal (= base + payroll overtime) + committed supplementals
// Only Posted/Executed supplementals count as realized; Draft/Review/Approved are surfaced
// separately as pending (never added to the total); Cancelled is excluded. Supplemental amounts
// follow the same "committed transaction is authoritative" rule as the payroll snapshot: the linked
// finance transaction (actual for Executed, planned for Posted) with a fallback to the frozen amount.
function payrollTotalCompensation(pp){
  const snap = payrollHistoricalSnapshot(pp);
  if(!snap) return null;
  let committed=0, committedCount=0, pending=0, pendingCount=0;
  const supps = (typeof supplementalsForPlan==='function') ? supplementalsForPlan(pp.id) : [];
  supps.forEach(s=>{
    if(s.status==='Posted' || s.status==='Executed'){
      const t = (typeof supplementalTxnOf==='function') ? supplementalTxnOf(s) : null;
      let amt = num(s.amount);
      if(t){ amt = (s.status==='Executed' && t.actual!=null) ? num(t.actual) : num(t.planned); }
      committed += amt; committedCount++;
    } else if(s.status==='Draft' || s.status==='Review' || s.status==='Approved'){
      pending += num(s.amount); pendingCount++;
    } // Cancelled excluded
  });
  return {
    baseSalary: snap.baseSalary, overtimeAmount: snap.overtimeAmount, baseTotal: num(snap.totalPayroll),
    supplemental: committed, supplementalCount: committedCount,
    pendingSupplemental: pending, pendingCount: pendingCount,
    totalCompensation: num(snap.totalPayroll) + committed,
    source: snap.source, integrityStatus: snap.integrityStatus,
  };
}
// Shared "hours known?" formatter — explicit zero shows "0 hrs", unknown shows unavailable.
function payrollHoursDisplay(snap){
  if(!snap) return '—';
  if(snap.overtimeHours==null) return '<span class="dim" title="Historical overtime hours are not recoverable for this legacy record">— hrs <span class="faint">(unavailable)</span></span>';
  return `${num(snap.overtimeHours)} hrs`;
}
// Compact integrity indicator for Payroll Detail (v2.7.1) — summarizes the source-of-truth
// state at a glance; the full explanation (payrollIntegrityNoticeHTML) stays below on mismatch.
function payrollIntegrityBadge(pp){
  const s=payrollHistoricalSnapshot(pp); if(!s || s.source==='working') return '';
  const bad=(s.integrityStatus==='mismatch' || s.integrityStatus==='no-transaction');
  return bad
    ? '<span class="pill pill-status-partial" title="Mismatch detected — the committed transaction is authoritative. See the details below.">🟡 Snapshot Mismatch</span>'
    : '<span class="pill pill-status-completed" title="Snapshot verified — the committed transaction is authoritative.">🟢 Integrity Verified</span>';
}
// Read-only integrity notice rendered between base payroll and its transaction on mismatch.
function payrollIntegrityNoticeHTML(pp){
  const s = payrollHistoricalSnapshot(pp);
  if(!s || !(s.integrityStatus==='mismatch' || s.integrityStatus==='no-transaction')) return '';
  const rows = (s.differences||[]).map(d=>`<div>${escapeHtml(d.label)}: <b class="mono">${fmtIDR(d.a)}</b>${d.b!=null?` vs <b class="mono">${fmtIDR(d.b)}</b> <span class="faint">(difference ${fmtIDR(Math.abs(num(d.a)-num(d.b)))})</span>`:''}</div>`).join('');
  return `<div class="card" style="margin-bottom:14px;border-left:3px solid var(--brick);">
    <h3 style="color:var(--brick);">Payroll snapshot mismatch</h3>
    <div style="font-size:13px;line-height:1.8;">${rows}</div>
    <p class="hint" style="margin-top:8px;">The posted transaction is the committed record and remains unchanged. The historical figures shown above are read from the strongest available committed evidence (${escapeHtml(s.sourceLabel)}); the payroll plan's current figures differ. Nothing was altered.</p>
  </div>`;
}

/* ---------- recurring payroll adjustments (Part 14) ---------- */
function adjustmentsForMonth(empId, monthKey){
  return State.payrollAdjustments.filter(a=>{
    if(a.active===false) return false;
    if(a.employeeId!==empId) return false;
    if(a.startMonth && monthKey < a.startMonth) return false;
    if(a.endMonth && monthKey > a.endMonth) return false;
    return true;
  });
}

/* ---------- eligibility & exclusion reasons (Part 3) ---------- */
function payrollExclusionReason(e, monthKey){
  if(e.active===false) return 'Inactive employee (record deactivated)';
  if(e.employmentStatus!=='Active') return 'Inactive employee (status: '+e.employmentStatus+')';
  const cts = contractsForEmployee(e.id);
  const ct = coveringContract(e.id, monthKey);
  if(!ct){
    if(!cts.length) return 'No active contract';
    // classify why none covers this month
    let notStarted=false, expired=false, cancelled=false;
    cts.forEach(c=>{ const es=contractEffectiveStatus(c, monthKey); const cc=contractCalc(c, monthKey);
      if(c.status==='Cancelled') cancelled=true;
      else if(cc.valid && cc.current<1) notStarted=true;
      else if(cc.valid && cc.current>cc.total) expired=true; });
    if(cancelled) return 'Cancelled contract';
    if(notStarted) return 'Contract not started';
    if(expired) return 'Contract expired';
    return 'No active contract covering this month';
  }
  if(overlappingActiveContracts(e.id).length) return 'Overlapping contract conflict';
  return null; // eligible (missing salary / schedule are flagged on the row, not excluded — see commit gating)
}

/* ---------- generate persistent payroll (Parts 3, 9, 14) ---------- */
function generatePayrollForMonth(monthKey){
  const mo = keyToMonthObj(monthKey); const now = new Date().toISOString();
  const result = {generated:0, refreshed:0, changed:0, excluded:[], skippedCommitted:0};
  State.employees.forEach(e=>{
    const reason = payrollExclusionReason(e, monthKey);
    if(reason){ result.excluded.push({employeeId:e.id, name:e.fullName, reason}); return; }
    const ct = coveringContract(e.id, monthKey);
    const cc = contractCalc(ct, monthKey);
    const sched = effectiveSchedule(e, ct);
    const base = (ct.monthlySalary!=null?ct.monthlySalary:e.monthlyBaseSalary)||0;
    const ot = approvedOvertimeForMonth(e.id, monthKey);
    const existing = State.payrollPlans.find(p=>p.monthKey===monthKey && p.employeeId===e.id && p.contractId===ct.id && p.status!=='Cancelled');
    if(existing && existing.status==='Committed'){
      // Committed payroll is never silently regenerated — detect overtime drift and flag.
      if(!sameIdSet(existing.overtimeIds, ot.ids)) { existing.otChanged=true; existing.updatedAt=now; }
      result.skippedCommitted++; return;
    }
    let pp = existing;
    if(!pp){
      pp = {id:uid('pp'), createdAt:now, status:'Draft', allowance:0, bonus:0, benefits:0, otherAddition:0, deduction:0, otherDeduction:0, notes:'', history:[]};
      const adjs = adjustmentsForMonth(e.id, monthKey);
      pp.otherAddition = adjs.filter(a=>a.type==='Addition').reduce((s,a)=>s+num(a.amount),0);
      pp.otherDeduction = adjs.filter(a=>a.type==='Deduction').reduce((s,a)=>s+num(a.amount),0);
      pp.recurringAdjustmentIds = adjs.map(a=>a.id);
      pp.adjustmentsSnapshot = adjs.map(a=>({id:a.id, name:a.name, type:a.type, amount:num(a.amount)}));
      State.payrollPlans.push(pp);
      pp.history.push({event:'generated', ts:now, note:`Generated for ${mo.month} ${mo.year}`});
      result.generated++;
    } else {
      // refresh system values on an existing non-committed row; preserve manual edits + review status.
      // Any change in the approved-overtime set (including none → some) flags the row Changed.
      if(!sameIdSet(pp.overtimeIds||[], ot.ids)){ pp.otChanged=true; result.changed++; }
      result.refreshed++;
      pp.history = pp.history || []; pp.history.push({event:'generated', ts:now, note:'Re-generated (system values refreshed)'});
    }
    pp.monthKey=monthKey; pp.month=mo.month; pp.year=mo.year; pp.monthNum=mo.monthNum;
    pp.employeeId=e.id; pp.employeeName=e.fullName; pp.department=e.department||null; pp.contractId=ct.id; pp.contractNumber=ct.contractNumber;
    if(!pp.salaryOverride) pp.baseSalary = base;                 // keep overridden base if present
    pp.baseSalarySnapshot = base;
    pp.contractProgress = cc.progress; pp.contractProgressSnapshot = cc.progress;
    pp.workScheduleSnapshot = {hoursPerDay:sched.hoursPerDay, daysPerWeek:sched.daysPerWeek, weeksPerMonth:sched.weeksPerMonth, source:sched.source, valid:sched.valid};
    pp.overtimeIds = ot.ids.slice(); pp.overtimeAmount = ot.amount; pp.overtimeHours = ot.records.reduce((s,o)=>s+num(o.overtimeHours),0);
    pp.missingSalary = base<=0; pp.missingSchedule = !sched.valid;
    pp.plannedAmount = computePayrollPlanned(pp);
    pp.updatedAt = now;
  });
  logActivity({type:'payroll.generate', module:'Payroll', entity:`${mo.month} ${mo.year}`, entityId:monthKey,
    desc:`Generated payroll — ${result.generated} new, ${result.refreshed} refreshed, ${result.excluded.length} excluded`,
    refs:{monthKey}});
  return result;
}

/* ---------- cycle status (Part 2) ---------- */
function payrollPlansForMonth(monthKey, includeCancelled){
  return State.payrollPlans.filter(p=>p.monthKey===monthKey && (includeCancelled || p.status!=='Cancelled'));
}
function payrollCycleStatus(monthKey){
  const plans = payrollPlansForMonth(monthKey);
  if(!plans.length) return 'Not Generated';
  const committed = plans.filter(p=>p.status==='Committed');
  if(committed.length===plans.length && committed.length){
    const txns = committed.map(payrollTxnOf).filter(Boolean);
    if(txns.length){
      if(txns.every(t=>['completed','archived'].includes(statusOf(t)))) return 'Fully Executed';
      if(txns.some(t=>['completed','partial','archived'].includes(statusOf(t)))) return 'Partially Executed';
    }
    return 'Committed';
  }
  if(committed.length){
    const anyExec = committed.some(p=>{ const t=payrollTxnOf(p); return t && ['completed','partial','archived'].includes(statusOf(t)); });
    return anyExec ? 'Partially Executed' : 'Committed';
  }
  if(plans.some(p=>p.status==='Ready')) return 'Ready to Commit';
  if(plans.some(p=>p.status==='Reviewed')) return 'In Review';
  return 'Draft';
}
function payrollMonthTotals(monthKey){
  const plans = payrollPlansForMonth(monthKey);
  const t={base:0, overtime:0, additions:0, deductions:0, planned:0, count:plans.length,
    committed:0, ready:0, reviewed:0, draft:0, paid:0, remaining:0};
  plans.forEach(p=>{
    const snap = payrollHistoricalSnapshot(p);            // v2.7.1 stage-aware
    t.base += num(snap.baseSalary);
    t.overtime += num(snap.overtimeAmount);
    t.additions += num(p.allowance)+num(p.bonus)+num(p.benefits)+num(p.otherAddition!=null?p.otherAddition:p.otherAdjustment);
    t.deductions += num(p.deduction)+num(p.otherDeduction);
    t.planned += num(snap.totalPayroll);
    if(p.status==='Committed') t.committed++; else if(p.status==='Ready') t.ready++; else if(p.status==='Reviewed') t.reviewed++; else t.draft++;
    const txn = payrollTxnOf(p);
    if(txn && txn.actual!=null){ t.paid += num(txn.actual); }
  });
  t.remaining = t.planned - t.paid;
  return t;
}

/* ---------- review lifecycle (Part 7) ---------- */
function payrollCommitBlockers(pp){
  const b=[];
  if(!pp.employeeId || !empById(pp.employeeId)) b.push('invalid employee');
  if(!pp.contractId || !contractById(pp.contractId)) b.push('invalid contract');
  if(payrollBaseSalary(pp)<=0) b.push('missing salary');
  if(pp.workScheduleSnapshot && pp.workScheduleSnapshot.valid===false) b.push('invalid work schedule');
  if(payrollIsNegative(pp)) b.push('negative final payroll');
  const dup = State.payrollPlans.filter(x=>x.id!==pp.id && x.monthKey===pp.monthKey && x.employeeId===pp.employeeId && x.status!=='Cancelled');
  if(dup.length) b.push('duplicate payroll for this month');
  return b;
}
// v2.6.4 — map a stored status change to an Activity Log event type.
function payrollAuditType(status){
  return status==='Reviewed'?'payroll.review':status==='Ready'?'payroll.approve':status==='Draft'?'payroll.return':status==='Cancelled'?'payroll.cancel':'payroll.edit';
}
/* ============================================================
   PR-5J "The Accountant" — Payroll lifecycle transition HANDLER.
   The IMPLEMENTATION AUTHORITY for the payroll.lifecycle.transition command.
   The business authority is PayrollLifecycleAggregate (js/domain); this handler
   keeps its own defense-in-depth guards and owns mutation, updatedAt, PayrollPlan
   history, persistence, rollback, and best-effort audit. It receives the sanitized
   { from, to } decision from the aggregate (via Domain.command), mutates ONLY
   PayrollPlan.status, and NEVER touches calculations, transactions, overtime,
   monthly plans, committedSnapshot, posting, generation, or salary override.
   Atomic: on a failed persist it reverts the status, updatedAt, and history entry
   and returns PersistFailed; no audit is written on failure. It replaces the former
   setPayrollStatus / bulkPayrollStatus procedural mutators (now routed through the
   Domain command — single-record per row, one independently-atomic command each).
   The history event preserves the EXISTING status-specific convention consumed by
   buildPayrollTimeline (Reviewed←'reviewed', Approved←'marked-ready') so the derived
   Payroll Timeline is unchanged; the note records the previous → target status. */
async function transitionPayrollLifecycle(id, transition){
  const pp = payrollPlanById(id);
  if(!pp) return { success:false, error:'PayrollPlanNotFound' };
  transition = transition || {};
  const to = transition.to;
  const from = pp.status;
  // Defense-in-depth (the aggregate validated first): lock, committed-immutability, transition graph.
  if(isPayrollLocked(pp.monthKey)) return { success:false, error:'PayrollPeriodLocked' };
  if(from==='Committed' && to!=='Committed') return { success:false, error:'PayrollCommittedImmutable' };
  const allowed = (typeof PAYROLL_LIFECYCLE_TRANSITIONS !== 'undefined' && PAYROLL_LIFECYCLE_TRANSITIONS[from]) || [];
  if(!to || allowed.indexOf(to)===-1) return { success:false, error:'IllegalPayrollLifecycleTransition' };
  const prevStatus = pp.status, prevUpdatedAt = pp.updatedAt;
  pp.status = to;
  pp.updatedAt = new Date().toISOString();
  // Preserve the established status-specific history event (buildPayrollTimeline reads these);
  // the note additionally records the stored from → to status.
  const evt = to==='Reviewed'?'reviewed':to==='Ready'?'marked-ready':to==='Cancelled'?'cancelled':'edited';
  (pp.history = pp.history || []).push({ event:evt, ts:pp.updatedAt, from:from, to:to, note:'Lifecycle '+from+' → '+to });
  const ok = await persistPayrollPlans();
  if(ok !== true){
    // Atomic rollback — restore status, timestamp, and drop the history entry.
    pp.status = prevStatus;
    pp.history.pop();
    pp.updatedAt = prevUpdatedAt;
    return { success:false, error:'PersistFailed' };
  }
  // Best-effort audit — ONLY after persistence succeeds; its failure never alters the result.
  try {
    logActivity({type:payrollAuditType(to), module:'Payroll', entity:pp.employeeName, entityId:pp.id,
      desc:`${pp.employeeName} → ${payrollStage(pp)} (status ${to})`,
      refs:{employeeId:pp.employeeId, payrollPlanId:pp.id, contractId:pp.contractId, monthKey:pp.monthKey}});
  } catch(e){ /* audit is best-effort; PayrollPlan persistence is the business commit */ }
  return { success:true, data:pp };
}

function commitPayrollPreview(monthKey, ids){
  const plans = ids.map(payrollPlanById).filter(Boolean);
  const s={employees:plans.length, base:0, overtime:0, additions:0, deductions:0, planned:0, newTxn:0, existingTxn:0, changedTxn:0, conflicts:0, skipped:0};
  plans.forEach(p=>{
    if(p.status!=='Ready'){ s.skipped++; return; }
    s.base+=payrollBaseSalary(p); s.overtime+=num(p.overtimeAmount); s.additions+=num(p.allowance)+num(p.bonus)+num(p.benefits)+num(p.otherAddition); s.deductions+=num(p.deduction)+num(p.otherDeduction); s.planned+=num(p.plannedAmount);
    const txn=payrollTxnOf(p);
    if(!txn) s.newTxn++; else if(txn.actual==null && txn.planned!==p.plannedAmount) s.changedTxn++; else s.existingTxn++;
    if(payrollCommitBlockers(p).length) s.conflicts++;
  });
  return s;
}
async function commitReadyPayroll(monthKey, ids){
  if(isPayrollLocked(monthKey)){ showWarning('This payroll period is locked — finance posting cannot run again.'); return {created:0, updated:0, skipped:ids.length, posted:[], skippedDetails:[], locked:true}; }
  const mo=keyToMonthObj(monthKey); const plan=ensureMonthlyPlan(monthKey); const now=new Date().toISOString();
  let created=0, updated=0, skipped=0;
  const posted=[], skippedDetails=[];   // v2.6.4 — per-row outcome for the Post result summary
  for(const id of ids){
    const pp=payrollPlanById(id);
    if(!pp){ skipped++; continue; }
    // Only Approved rows post. Blocked rows are SKIPPED (never posted), stay Approved, and
    // the exact reason is reported. Blocker rules are unchanged (payrollCommitBlockers).
    if(pp.status!=='Ready'){ skipped++; skippedDetails.push({name:pp.employeeName||'—', reasons:['not Approved (current stage: '+payrollStage(pp)+')']}); continue; }
    const blockers = payrollCommitBlockers(pp);
    if(blockers.length){ skipped++; skippedDetails.push({name:pp.employeeName, reasons:blockers}); continue; }
    pp.status='Committed'; pp.monthlyPlanId=plan.id; pp.plannedAmount=computePayrollPlanned(pp); pp.committedAt=now; pp.updatedAt=now;
    if(!pp.committedSnapshot) pp.committedSnapshot = buildPayrollCommittedSnapshot(pp); // v2.7.1 freeze historical evidence at first post
    let txn = payrollTxnOf(pp); let wasCreated=false;
    if(!txn){ txn=payrollCommitTxn(pp, mo); State.txns.push(txn); pp.committedTxnId=txn.id; pp.transactionId=txn.id; created++; wasCreated=true; (pp.history=pp.history||[]).push({event:'transaction-created', ts:now, note:'Planned Gaji transaction created'}); }
    else if(txn.actual==null){ txn.planned=pp.plannedAmount; txn.hargaSatuan=pp.plannedAmount; txn.overtimeIds=(pp.overtimeIds||[]).slice(); txn.overtimeAmount=num(pp.overtimeAmount); pushHistory(txn,'edited','Payroll re-committed'); updated++; }
    // flip approved overtime → Committed to Payroll (prevent double inclusion)
    (pp.overtimeIds||[]).forEach(oid=>{ const o=overtimeById(oid); if(o && o.status==='Approved'){ o.status='Committed to Payroll'; o.payrollPlanId=pp.id; o.committedTxnId=pp.committedTxnId; o.updatedAt=now; (o.history=o.history||[]).push({event:'committed', ts:now, note:'Committed to payroll'}); } });
    if(pp.committedTxnId && !plan.committedTxnIds.includes(pp.committedTxnId)) plan.committedTxnIds.push(pp.committedTxnId);
    pp.otChanged=false;
    posted.push({name:pp.employeeName||'—', txnId:pp.committedTxnId, created:wasCreated});
    (pp.history=pp.history||[]).push({event:'committed', ts:now, note:'Committed to monthly plan'});
  }
  if(plan.status==='Draft'||plan.status==='Reviewed') plan.status='Committed';
  plan.committedAt=now; plan.updatedAt=now;
  await persistPayrollPlans(); await persistMonthlyPlans(); await persistOvertime(); await persist();
  logActivity({type:'payroll.post', module:'Payroll', entity:`${mo.month} ${mo.year}`, entityId:monthKey,
    desc:`Posted to finance — ${created} created, ${updated} updated, ${skipped} skipped`, refs:{monthKey}});
  return {created, updated, skipped, posted, skippedDetails};
}

/* ============================================================
   PAYROLL INTELLIGENCE (v2.6.3) — display lifecycle stages, period
   lock, deterministic health rules, and period summary. Additive:
   the operational lifecycle Draft → Review → Approved → Posted →
   Executed is a display mapping over the stored status values
   (Reviewed/Ready/Committed) with Executed derived from the linked
   finance transaction — so no data migration, storage key, or
   SCHEMA_VERSION change is needed. Locks live in settings.
   Payroll = Base Salary + Approved Overtime (TAM uses no other
   components), so computePayrollPlanned is the read-only Total.
   ============================================================ */
const PAYROLL_STAGE_META = {
  'Draft':    {pill:'pill-status-planned'},
  'Review':   {pill:'pill-status-scheduled'},
  'Approved': {pill:'pill-status-partial'},
  'Posted':   {pill:'pill-status-completed'},
  'Executed': {pill:'pill-status-completed'},
  'Cancelled':{pill:'pill-status-cancelled'},
};
const PAYROLL_STAGES = ['Draft','Review','Approved','Posted','Executed'];
// Map a stored payroll plan to its operational stage (Executed derived from its transaction).
function payrollStage(pp){
  if(!pp || pp.status==='Cancelled') return 'Cancelled';
  if(pp.status==='Committed'){
    const t=payrollTxnOf(pp);
    if(t && ['completed','archived'].includes(statusOf(t))) return 'Executed';
    return 'Posted';
  }
  if(pp.status==='Ready') return 'Approved';
  if(pp.status==='Reviewed') return 'Review';
  return 'Draft';
}
function payrollStagePill(pp){ return hrStatusBadge(payrollStage(pp), PAYROLL_STAGE_META); }
/* v2.6.8 (Issue 1) — GENERIC bulk-selection model.
   The selection set is stage-agnostic: it simply holds the rows the user picked.
   Each bulk action declares its OWN eligible stages here, so a row that is not
   eligible for one action (e.g. a Posted row for Approve) can still be selected and
   acted on by another action (e.g. a future Export). Adding a new action = adding one
   entry below; no change to the selection model. This is display/selection only — no
   payroll status rule and no committed-payroll immutability changes. */
const PAYROLL_BULK_ACTIONS = {
  review:  { label:'Review',  eligibleLabel:'Draft',            eligible:(p)=>payrollStage(p)==='Draft' },
  approve: { label:'Approve', eligibleLabel:'Draft and Review', eligible:(p)=>['Draft','Review'].includes(payrollStage(p)) },
  post:    { label:'Post',    eligibleLabel:'Approved',         eligible:(p)=>payrollStage(p)==='Approved' },
};
// Human-readable reason a selected row is skipped by a given action (for eligible/skipped reporting).
function payrollActionSkipReason(action, stage){
  if(action==='post' && (stage==='Draft' || stage==='Review')) return `not yet Approved (currently ${stage})`;
  return `already at ${stage} stage`;
}
// Partition a set of selected ids for one action into { eligible:[ids], skipped:[{id,name,stage,reason}] }.
function partitionPayrollSelection(ids, action){
  const spec = PAYROLL_BULK_ACTIONS[action];
  const eligible=[], skipped=[];
  (ids||[]).forEach(id=>{ const p=payrollPlanById(id); if(!p) return;
    if(spec.eligible(p)) eligible.push(id);
    else { const stage=payrollStage(p); skipped.push({id, name:p.employeeName||'—', stage, reason:payrollActionSkipReason(action, stage)}); }
  });
  return {eligible, skipped};
}
// Compact "2 already at Posted stage; 1 not yet Approved (currently Draft)" summary.
function payrollSkipSummary(skipped){
  const byReason={};
  (skipped||[]).forEach(s=>{ byReason[s.reason]=(byReason[s.reason]||0)+1; });
  return Object.entries(byReason).map(([r,n])=>`${n} ${r}`).join('; ');
}
// Does the active period contain any row eligible for this action? (drives button disabling)
function payrollPeriodHasEligible(monthKey, action){
  return payrollPlansForMonth(monthKey).some(PAYROLL_BULK_ACTIONS[action].eligible);
}
function payrollStageCounts(monthKey){
  const c={Draft:0, Review:0, Approved:0, Posted:0, Executed:0};
  payrollPlansForMonth(monthKey).forEach(p=>{ const s=payrollStage(p); if(c[s]!=null) c[s]++; });
  return c;
}
// Period summary: totals + average/highest/lowest (Feature 9).
function payrollSummary(monthKey){
  const plans=payrollPlansForMonth(monthKey);
  const snaps=plans.map(payrollHistoricalSnapshot);        // v2.7.1 stage-aware
  const amts=snaps.map(s=>num(s.totalPayroll));
  const total=amts.reduce((s,x)=>s+x,0);
  return {count:plans.length, total, overtime:snaps.reduce((s,x)=>s+num(x.overtimeAmount),0),
    average: plans.length?Math.round(total/plans.length):0,
    highest: amts.length?Math.max(...amts):0, lowest: amts.length?Math.min(...amts):0};
}
// Deterministic (no AI) payroll health rules for the active period (Feature 7).
function payrollHealth(monthKey){
  const out=[]; const prevKey=prevMonthKey(monthKey);
  payrollPlansForMonth(monthKey).forEach(p=>{
    const ct=contractById(p.contractId);
    if(ct){ const cc=contractCalc(ct, monthKey); if(cc.valid && cc.daysUntilEnd!=null && cc.daysUntilEnd>=0 && cc.daysUntilEnd<=30) out.push({sev:'warn', title:'Contract expiring within 30 days', detail:`${p.employeeName}: ${ct.contractNumber||'contract'} ends in ${cc.daysUntilEnd} day(s).`}); }
    const prev=State.payrollPlans.find(x=>x.monthKey===prevKey && x.employeeId===p.employeeId && x.status!=='Cancelled');
    if(prev){ const a=computePayrollPlanned(prev), b=computePayrollPlanned(p); if(a>0){ const d=(b-a)/a;
      if(d>=0.2) out.push({sev:'warn', title:'Payroll increased more than 20%', detail:`${p.employeeName}: ${fmtIDRShort(a)} → ${fmtIDRShort(b)} (+${Math.round(d*100)}%).`});
      else if(d<=-0.2) out.push({sev:'warn', title:'Payroll decreased more than 20%', detail:`${p.employeeName}: ${fmtIDRShort(a)} → ${fmtIDRShort(b)} (${Math.round(d*100)}%).`}); } }
    const base=payrollBaseSalary(p);
    if(base>0 && num(p.overtimeAmount) > 0.5*base) out.push({sev:'warn', title:'Unusually high overtime', detail:`${p.employeeName}: overtime ${fmtIDRShort(p.overtimeAmount)} exceeds 50% of base salary.`});
    else if(num(p.overtimeHours) > 60) out.push({sev:'warn', title:'Unusually high overtime hours', detail:`${p.employeeName}: ${num(p.overtimeHours)} overtime hours this period.`});
  });
  State.employees.forEach(e=>{ if(e.active===false || e.employmentStatus!=='Active') return;
    const reason=payrollExclusionReason(e, monthKey);
    if(reason) out.push({sev:'info', title: /contract/i.test(reason)?'Employee missing active contract':'Employee not in payroll', detail:`${e.fullName}: ${reason}.`});
  });
  return out;
}
/* ---------- payroll period lock (Feature 6) ---------- */
function isPayrollLocked(monthKey){ return !!(State.settings.payrollLocks && State.settings.payrollLocks[monthKey]); }
async function setPayrollLock(monthKey, locked){
  if(!State.settings.payrollLocks) State.settings.payrollLocks={};
  if(locked) State.settings.payrollLocks[monthKey]=true; else delete State.settings.payrollLocks[monthKey];
