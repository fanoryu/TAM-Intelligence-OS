function catCode(category){ return category==='Gaji'?'A':category==='Operasional Rutin'?'B':category==='Operasional Kegiatan'?'C':null; }
function buildPlannedExpenseTxn(monthKey, mo, o){
  const ts=new Date().toISOString();
  return {id:uid(o.source||'plan'), monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
    category:o.category, categoryCode:catCode(o.category), no:null,
    uraian:o.uraian, vol:1, satuan:'bulan', hargaSatuan:o.amount, planned:o.amount, actual:null, type:'expense', txnDate:null,
    source:o.source||'manual', unplanned:false, scheduledDate:null, paymentMethod:o.paymentMethod||null, bankAccount:o.bankAccount||null,
    referenceNumber:null, notes:o.notes||null, vendor:o.vendor||null,
    executionId:null, executionTimestamp:null, execution:null, status:'planned',
    monthlyPlanId:o.monthlyPlanId||null, recurringId:o.recurringId||null,
    history:[{event:'created', ts, note:'Generated by Monthly Plan Generator'}]};
}
function prevMonthKey(monthKey){ const a=keyAbs(monthKey)-1; return mkKey(Math.floor(a/12), (a%12)+1); }
// Non-payroll, non-recurring planned expense items from a month — the only
// things eligible to copy forward (actuals are never copied).
function manualItemsForMonth(monthKey){
  return State.txns.filter(t=>t.monthKey===monthKey && t.type!=='income' && t.source!=='payroll' && !t.recurringId && statusOf(t)!=='cancelled');
}
function buildMonthlyPreview(monthKey, opts){
  const rows=[], warnings=[];
  if(opts.payroll){
    // Part 11: the Monthly Plan CONSUMES payroll committed in Payroll Planning —
    // it never generates payroll independently. Committed payroll already carries
    // its own planned Gaji transaction, so these rows are informational (locked).
    const committed = State.payrollPlans.filter(p=>p.monthKey===monthKey && p.status==='Committed');
    committed.forEach(p=>{
      const txn = payrollTxnOf(p);
      rows.push({type:'payroll', label:`${p.employeeName}${p.contractNumber?' · '+p.contractNumber:''}${p.contractProgress?' · '+p.contractProgress:''}`, category:State.settings.defaultPayrollCategory||'Gaji', planned:num(p.plannedAmount), selected:false, dup:'committed', warn:null, committedTxnId: txn?txn.id:null});
    });
    const cyc = payrollCycleStatus(monthKey);
    if(cyc==='Not Generated') warnings.push('Payroll has not been generated for this month — open Payroll Planning to generate and commit payroll.');
    else if(!committed.length) warnings.push('Payroll generated but not committed yet — commit Ready payroll in Payroll Planning.');
    else if(cyc==='Ready to Commit' || cyc==='In Review' || cyc==='Draft') warnings.push('Some payroll rows are not yet committed — commit them in Payroll Planning to include them.');
  }
  if(opts.recurring){
    recurringDueInMonth(monthKey).forEach(r=>{
      const dupTxn = State.txns.find(t=>t.recurringId===r.id && t.monthKey===monthKey);
      rows.push({type:'recurring', label:r.name, category:r.category||'Operasional Rutin', planned:num(r.defaultAmount), selected:!dupTxn, dup:dupTxn?'duplicate':'new', recurringId:r.id, vendor:r.vendor, paymentMethod:r.paymentMethod, bankAccount:r.bankAccount, warn: num(r.defaultAmount)<=0?'zero-value':null});
    });
  }
  (opts.copyRows||[]).forEach(cr=>{
    const dupTxn = State.txns.find(t=>t.monthKey===monthKey && normStr(t.uraian)===normStr(cr.uraian) && t.category===cr.category);
    rows.push({type:'manual', label:cr.uraian, category:cr.category, planned:num(cr.planned), selected:!dupTxn, dup:dupTxn?'duplicate':'new', warn:null});
  });
  return {monthKey, rows, warnings};
}
function previewTotals(preview){
  const sel = preview.rows.filter(r=>r.selected);
  const by = t=>sel.filter(r=>r.type===t).reduce((s,r)=>s+num(r.planned),0);
  // Payroll is already committed (informational rows) — count all of it.
  const payroll = preview.rows.filter(r=>r.type==='payroll').reduce((s,r)=>s+num(r.planned),0);
  const dup = preview.rows.filter(r=>r.dup==='duplicate').length;
  const missing = preview.rows.filter(r=>r.warn==='missing salary').length;
  const zero = preview.rows.filter(r=>r.warn==='zero-value').length;
  return {payroll, recurring:by('recurring'), manual:by('manual'), total: payroll + sel.filter(r=>r.type!=='payroll').reduce((s,r)=>s+num(r.planned),0), rows:sel.filter(r=>r.type!=='payroll').length, dup, missing, zero};
}
async function commitMonthlyPlan(preview){
  const mo = keyToMonthObj(preview.monthKey);
  const plan = ensureMonthlyPlan(preview.monthKey);
  // Payroll rows are consumed from Payroll Planning (already committed) — never
  // re-created here. Only recurring/manual rows create transactions.
  const sel = preview.rows.filter(r=>r.selected && r.dup!=='duplicate' && r.dup!=='committed' && r.type!=='payroll');
  let created=0;
  for(const r of sel){
    const txn = buildPlannedExpenseTxn(preview.monthKey, mo, {
      uraian:r.label, category:r.category, amount:num(r.planned), source:r.type==='recurring'?'recurring':'manual',
      recurringId:r.recurringId||null, vendor:r.vendor||null, paymentMethod:r.paymentMethod||null, bankAccount:r.bankAccount||null, monthlyPlanId:plan.id,
    });
    State.txns.push(txn); plan.committedTxnIds.push(txn.id); created++;
  }
  plan.status='Committed'; plan.committedAt=new Date().toISOString(); plan.updatedAt=plan.committedAt;
  await persist(); await persistMonthlyPlans();
  return {created};
}

    </div>
    <div id="planArea"></div>`;

  const syncMonth = ()=>{ const m=+document.getElementById('planMonthSel').value; const y=+document.getElementById('planYearSel').value; State.planGenMonth=mkKey(y,m); State.planPreview=null; renderMonthlyPlanGenerator(main); };
  document.getElementById('planMonthSel').addEventListener('change', syncMonth);
  document.getElementById('planYearSel').addEventListener('change', syncMonth);
  const opb=document.getElementById('openPay'); if(opb) opb.addEventListener('click', ()=>{ State.payrollMonth=monthKey; hrNavTo('payroll'); });
  document.getElementById('buildPreview').addEventListener('click', ()=>{ State.planPreview = buildMonthlyPreview(monthKey, {payroll:true, recurring:true, copyRows:(State.planPreview&&State.planPreview.monthKey===monthKey)?State.planPreview.rows.filter(r=>r.type==='manual').map(r=>({uraian:r.label,category:r.category,planned:r.planned})):[]}); renderMonthlyPlanGenerator(main); });

/* ============================================================
   LEGACY PAYROLL MAPPING
   Conservatively links historical Gaji transactions (imported from
   Excel, where the description is the employee name) to employee &
   contract master data. Never guesses aggressively, never creates
   contracts, always requires confirmation, preserves descriptions.
   ============================================================ */
function unlinkedGajiTxns(){
  return State.txns.filter(t=>t.type!=='income' && (t.category==='Gaji') && !t.employeeId && t.source!=='payroll');
}
function suggestEmployeeForName(name){
  const n = normStr(name);
  let exact = State.employees.find(e=>normStr(e.fullName)===n);
  if(exact) return {emp:exact, confidence:'high'};
  let best=null, bestScore=0;
  State.employees.forEach(e=>{ const s=similarText(e.fullName, name); if(s>bestScore){ bestScore=s; best=e; } });
  if(best && bestScore>=0.82) return {emp:best, confidence:'medium', score:bestScore};
  return {emp:null, confidence:'none'};
}
function renderLegacyPayrollMapping(main){
  const unlinked = unlinkedGajiTxns();
  // group by description (employee name as written on the historical row)
  const groups = {};
  unlinked.forEach(t=>{ const k=t.uraian||'(blank)'; (groups[k]=groups[k]||{name:t.uraian, txns:[]}).txns.push(t); });
  const rows = Object.values(groups).map(g=>({...g, suggestion:suggestEmployeeForName(g.name)}))
    .sort((a,b)=>b.txns.length-a.txns.length);

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Legacy Payroll Mapping</h1><p class="desc">Link historical Gaji transactions to employee and contract master data. Matching is conservative — review every suggestion before applying. Descriptions are preserved.</p></div>
      <div class="head-controls"><button class="btn" id="backPay">← Payroll Planning</button></div>
    </div>
    ${!State.employees.length?`<div class="insight-item warn" style="margin-bottom:14px;">No employees exist yet. Add employees first (People &amp; Contracts → Employees), then return here to map historical payroll to them.</div>`:''}
    <div class="card">
      <h3>Unmapped Historical Payroll <span class="tag">${unlinked.length} transaction(s) · ${rows.length} distinct name(s)</span></h3>
      ${rows.length?`
      <div class="table-wrap" style="max-height:560px;overflow-y:auto;">
        <table>
          <thead><tr><th>Historical Description</th><th class="num">Txns</th><th>Match Confidence</th><th>Map to Employee</th><th>Auto-link Contract</th></tr></thead>
          <tbody>${rows.map((g,i)=>`<tr>
            <td><b>${escapeHtml(g.name||'—')}</b></td>
            <td class="num">${g.txns.length}</td>
            <td>${g.suggestion.confidence==='high'?'<span class="pill pill-status-completed">high</span>':g.suggestion.confidence==='medium'?`<span class="pill pill-status-partial">medium ${(g.suggestion.score*100).toFixed(0)}%</span>`:'<span class="pill pill-status-archived">no match</span>'}</td>
            <td><select class="input" data-map="${i}"><option value="">— do not map —</option>${State.employees.map(e=>`<option value="${e.id}" ${g.suggestion.emp&&g.suggestion.emp.id===e.id&&g.suggestion.confidence==='high'?'selected':''}>${escapeHtml(e.fullName)} (${escapeHtml(e.employeeId||'')})</option>`).join('')}</select></td>
            <td><label class="checkbox-row"><input type="checkbox" data-autoct="${i}" checked> match by month</label></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:14px;">
        <button class="btn btn-accent" id="applyMap">Apply Mappings</button>
        <span class="hint" style="align-self:center;">Only rows with an employee selected are linked. Contracts are linked only where one already covers that transaction's month — none are created.</span>
      </div>`:'<div class="empty">All Gaji transactions are already linked to employees, or there is no historical payroll to map.</div>'}
    </div>`;
  document.getElementById('backPay').addEventListener('click', ()=>hrNavTo('payroll'));
  const applyBtn = document.getElementById('applyMap');
  if(applyBtn) applyBtn.addEventListener('click', async ()=>{
    let linked=0, ctLinked=0;
    rows.forEach((g,i)=>{
      const sel = main.querySelector(`[data-map="${i}"]`); const empId = sel && sel.value;
      if(!empId) return;
      const emp = empById(empId); if(!emp) return;
      const autoCt = main.querySelector(`[data-autoct="${i}"]`).checked;
      g.txns.forEach(t=>{
        t.employeeId = empId;
        if(!t.payrollMeta) t.payrollMeta = {employeeName:emp.fullName, contractNumber:null, contractProgress:null};
        pushHistory(t, 'linked', `Mapped to employee ${emp.fullName} via Legacy Payroll Mapping`);
        if(autoCt){ const ct = coveringContract(empId, t.monthKey); if(ct){ t.contractId=ct.id; const cc=contractCalc(ct,t.monthKey); t.payrollMeta.contractNumber=ct.contractNumber; t.payrollMeta.contractProgress=cc.progress; ctLinked++; } }
        linked++;
      });
    });
    if(!linked){ toast('No rows had an employee selected.'); return; }
    await persist();
    toast(`Linked ${linked} transaction(s) to employees${ctLinked?`, ${ctLinked} to contracts`:''}. Descriptions preserved.`, 6000);
    render();
  });
}

function hrDashboardStats(monthKey){
  const activeEmployees = State.employees.filter(empEligible).length;
  const activeContracts = State.contracts.filter(c=>contractEffectiveStatus(c)==='Active').length;
  const expiringSoon = State.contracts.filter(c=>contractEffectiveStatus(c)==='Expiring Soon').length;
  const plans = State.payrollPlans.filter(p=>p.monthKey===monthKey && p.status==='committed');
  const payrollPlanned = plans.reduce((s,p)=>s+(p.plannedAmount||0),0);
  const plan = monthlyPlanFor(monthKey);
  // payroll generation status for the month
  let payrollGen='Not generated';
  const eligible = State.employees.filter(empEligible).filter(e=>coveringContract(e.id, monthKey));
  if(plans.length){ payrollGen = plans.length>=eligible.length ? 'Committed' : 'Partially committed'; }
  else if(State.payrollDraft && State.payrollDraft.monthKey===monthKey){ payrollGen='Generated, not committed'; }
  return {activeEmployees, activeContracts, expiringSoon, payrollPlanned, payrollCount:plans.length, planStatus:plan?plan.status:'Not started', payrollGen, eligibleCount:eligible.length};
}
function hrDashboardAlerts(monthKey){
  const alerts = [];
  const warn = Number(State.settings.contractExpiryWarningDays)||90;
  const soon = State.contracts.filter(c=>contractEffectiveStatus(c)==='Expiring Soon');
  soon.slice(0,4).forEach(c=>{ const cc=contractCalc(c); alerts.push({type:'warn', text:`Contract ${escapeHtml(c.contractNumber||'')} (${escapeHtml(c.employeeName||'')}) is expiring soon — ${cc.daysUntilEnd} days left.`}); });
  const expired = State.contracts.filter(c=>contractEffectiveStatus(c)==='Expired' && c.status==='Active');
  expired.slice(0,3).forEach(c=>alerts.push({type:'warn', text:`Contract ${escapeHtml(c.contractNumber||'')} (${escapeHtml(c.employeeName||'')}) has expired — renew or close it.`}));
  State.employees.filter(empEligible).forEach(e=>{ if(!activeContractToday(e.id)) alerts.push({type:'warn', text:`${escapeHtml(e.fullName)} is Active with no current contract.`}); });
  const st = hrDashboardStats(monthKey);
  if(st.eligibleCount>0 && st.payrollGen==='Not generated') alerts.push({type:'info', text:`Payroll for ${escapeHtml(keyToMonthObj(monthKey).month)} has not been generated yet (${st.eligibleCount} eligible employee${st.eligibleCount>1?'s':''}).`});
  if(st.payrollGen==='Generated, not committed') alerts.push({type:'warn', text:`Payroll for ${escapeHtml(keyToMonthObj(monthKey).month)} is generated but not committed to the monthly plan.`});
  if(st.planStatus==='Draft') alerts.push({type:'info', text:`Monthly plan for ${escapeHtml(keyToMonthObj(monthKey).month)} is still in Draft.`});
  // duplicate payroll safety check
  const seen={}; let dup=0;
  State.txns.filter(t=>t.source==='payroll' && t.monthKey===monthKey).forEach(t=>{ const k=t.employeeId+'|'+t.contractId; if(seen[k]) dup++; else seen[k]=1; });
  if(dup) alerts.push({type:'warn', text:`${dup} potential duplicate payroll transaction(s) detected for ${escapeHtml(keyToMonthObj(monthKey).month)}.`});
  return alerts;
}

      rows:ps.map(p=>{ const s=payrollHistoricalSnapshot(p); return [p.employeeName,p.contractNumber,p.contractProgress,p.department,fmtIDR(s.baseSalary),fmtIDR(s.overtimeAmount),fmtIDR(num(p.allowance)+num(p.bonus)+num(p.benefits)+num(p.otherAddition)),fmtIDR(num(p.deduction)+num(p.otherDeduction)),fmtIDR(s.totalPayroll),p.status]; })};
  }
  if(id==='payroll-department'){
    const map={}; payrollPlansForMonth(monthKey).forEach(p=>{ const d=p.department||'—'; (map[d]=map[d]||{n:0,sum:0}); map[d].n++; map[d].sum+=num(payrollHistoricalSnapshot(p).totalPayroll); });
    return {headers:['Department','Employees','Total Planned'], rows:Object.entries(map).map(([k,v])=>[k,v.n,fmtIDR(v.sum)])};
  }
  if(id==='payroll-components'){
    const ps=payrollPlansForMonth(monthKey);
    return {headers:['Employee','Base','Overtime','Allowance','Bonus','Benefits','Other +','Deduction','Other −','Planned'],
      rows:ps.map(p=>{ const s=payrollHistoricalSnapshot(p); return [p.employeeName,fmtIDR(s.baseSalary),fmtIDR(s.overtimeAmount),fmtIDR(p.allowance),fmtIDR(p.bonus),fmtIDR(p.benefits),fmtIDR(p.otherAddition),fmtIDR(p.deduction),fmtIDR(p.otherDeduction),fmtIDR(s.totalPayroll)]; })};
  }
  if(id==='payroll-execution'){
    const ps=payrollPlansForMonth(monthKey).filter(p=>p.status==='Committed');
    return {headers:['Employee','Planned','Actual Paid','Remaining','Transaction Status','Execution Date'],
      rows:ps.map(p=>{ const t=payrollTxnOf(p); return [p.employeeName,fmtIDR(payrollHistoricalSnapshot(p).totalPayroll),t&&t.actual!=null?fmtIDR(t.actual):'—',t?fmtIDR(num(t.planned)-num(t.actual)):'—',t?statusOf(t):'—',(t&&t.execution&&t.execution.executionDate)||'—']; })};
  }
  if(id==='payroll-excluded'){
    const ex=State.employees.map(e=>({e,reason:payrollExclusionReason(e,monthKey)})).filter(x=>x.reason);
    return {headers:['Employee','Department','Reason'], rows:ex.map(x=>[x.e.fullName,x.e.department||'—',x.reason])};
  }
  return {headers:[], rows:[]};
}

/* ============================================================
   v2.2.1 — STABILIZATION LAYER
   Additive only. Save coordinator, non-destructive normalization,
   reusable validators, the integrity checker, and shared UI/a11y
   helpers. No storage keys renamed, no business logic changed.
   ============================================================ */

/* ---------- unified persistence coordinator (Phase 4) ---------- */
// Persists every dataset through StorageAdapter in one call. Used by restore
// and available for any flow that changes several collections at once. Each
// underlying save already surfaces its own failures; this simply coordinates.
async function saveAllData(){
  // v2.5.2 — persist every dataset (previously only a subset), so Smart Import
  // audit batches, overtime, adjustments and employee-merge audits are durable.
  await Promise.all([
    persist(), saveSettings(), saveBackups(),
    ...Object.keys(HR_KEYS).map(k=>persistHR(k)),
  ]);
  return true;
}

/* ---------- non-destructive normalization migration (Phase 2) ---------- */
// Runs once. Fills MISSING id / createdAt / updatedAt on every entity so
// diagnostics and future features can rely on them. Never edits an existing
// value, never touches a financial amount, never renames a key. Relationships
// already use IDs (employeeId / contractId / payrollPlanId) and are left as-is.
function isValidDate(iso){ if(!iso) return false; const d = new Date(String(iso).length<=10 ? iso+'T00:00:00' : iso); return !isNaN(d.getTime()); }
async function migrateNormalizeEntities(){
  try{
    const flag = await StorageAdapter.get('tam_migrated_norm_v221');
    if(flag && flag.value==='done'){ if(!State.settings.lastMigrationAt){ /* record for older sessions */ } return; }
    let changed = 0; const nowIso = new Date().toISOString();
    const norm = (arr, prefix)=>{ (arr||[]).forEach(r=>{
      if(r && typeof r==='object'){
        if(!r.id){ r.id = uid(prefix); changed++; }
        if(!r.createdAt){ r.createdAt = r.updatedAt || nowIso; changed++; }
        if(!r.updatedAt){ r.updatedAt = r.createdAt; changed++; }
      }
    }); };
    norm(State.employees,'emp'); norm(State.contracts,'ct'); norm(State.payrollPlans,'pp');
    norm(State.recurringExpenses,'re'); norm(State.monthlyPlans,'mp');
    // Give transactions a stable createdAt from their first history entry where
    // one exists — additive, no financial value is read or written.
    State.txns.forEach(t=>{ if(t && !('createdAt' in t)){ t.createdAt = (t.history && t.history[0] && t.history[0].ts) || null; } });
    if(changed){
      // Backup-before-migration, only when something is actually normalized.
      State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-2.2.1 normalization', timestamp:nowIso, txns:JSON.parse(JSON.stringify(State.txns)), migration:true});
      await saveBackups();
      await Promise.all(['employees','contracts','payrollPlans','recurringExpenses','monthlyPlans'].map(persistHR));
      await persist();
    }
    State.settings.lastMigrationAt = nowIso;
    await saveSettings();
    await StorageAdapter.set('tam_migrated_norm_v221','done');
  }catch(e){ showError('Normalization step skipped — existing data is unchanged.', e); }
}

/* ---------- reusable validators (Phase 9) ----------
   Every validator returns {valid, errors[], warnings[]}. errors block; warnings
   inform. Shared by forms, imports, the integrity checker, and restore. */
function vNew(){ return {valid:true, errors:[], warnings:[]}; }
function vDone(r){ r.valid = r.errors.length===0; return r; }
function isNum(v){ return v!==null && v!==undefined && v!=='' && isFinite(Number(v)); }
function validateEmployee(e){
  const r = vNew();
  if(!e || typeof e!=='object'){ r.errors.push('Employee record is not an object'); return vDone(r); }
  if(!e.id) r.errors.push('Missing stable id');
  if(!String(e.fullName||'').trim()) r.errors.push('Full name is required');
  if(e.employmentStatus && !EMPLOYMENT_STATUSES.includes(e.employmentStatus)) r.warnings.push('Unrecognized employment status: '+e.employmentStatus);
  if(e.monthlyBaseSalary!=null && (!isNum(e.monthlyBaseSalary) || Number(e.monthlyBaseSalary)<0)) r.warnings.push('Base salary is negative or non-numeric');
  if(e.joinDate && !isValidDate(e.joinDate)) r.warnings.push('Join date is not a valid date');
  return vDone(r);
}
function validateContract(c){
  const r = vNew();
  if(!c || typeof c!=='object'){ r.errors.push('Contract record is not an object'); return vDone(r); }
  if(!c.id) r.errors.push('Missing stable id');
  if(!c.employeeId) r.errors.push('Contract has no employeeId link');
  else if(!empById(c.employeeId)) r.warnings.push('Contract references an employee that no longer exists');
  if(!String(c.contractNumber||'').trim()) r.errors.push('Contract number is required');
  if(!isValidDate(c.startDate)) r.errors.push('Start date is missing or invalid');
  if(!isNum(c.durationMonths) || Number(c.durationMonths)<1) r.errors.push('Duration must be a positive number of months');
  if(c.monthlySalary!=null && (!isNum(c.monthlySalary) || Number(c.monthlySalary)<0)) r.warnings.push('Monthly salary is negative or non-numeric');
  if(c.status && !CONTRACT_STORED_STATUSES.includes(c.status)) r.warnings.push('Unrecognized stored contract status: '+c.status);
  return vDone(r);
}
function validatePayrollPlan(p){
  const r = vNew();
  if(!p || typeof p!=='object'){ r.errors.push('Payroll plan is not an object'); return vDone(r); }
  if(!p.id) r.errors.push('Missing stable id');
  if(!p.monthKey) r.errors.push('Missing monthKey');
  if(!p.employeeId) r.errors.push('Missing employeeId link'); else if(!empById(p.employeeId)) r.warnings.push('Payroll plan references a missing employee');
  if(!p.contractId) r.warnings.push('Missing contractId link'); else if(!contractById(p.contractId)) r.warnings.push('Payroll plan references a missing contract');
  ['baseSalary','overtime','allowance','deduction','bonus','benefits','otherAdjustment'].forEach(k=>{ if(p[k]!=null && !isNum(p[k])) r.warnings.push(`Component ${k} is non-numeric`); });
  if(p.plannedAmount!=null && !isNum(p.plannedAmount)) r.warnings.push('Planned amount is non-numeric');
  return vDone(r);
}
function validateRecurring(x){
  const r = vNew();
  if(!x || typeof x!=='object'){ r.errors.push('Recurring template is not an object'); return vDone(r); }
  if(!x.id) r.errors.push('Missing stable id');
  if(!String(x.name||'').trim()) r.errors.push('Name is required');
  if(x.defaultAmount!=null && (!isNum(x.defaultAmount) || Number(x.defaultAmount)<0)) r.warnings.push('Default amount is negative or non-numeric');
  if(x.frequency && !RECUR_FREQUENCIES[x.frequency]) r.warnings.push('Unrecognized frequency: '+x.frequency);
  if(x.startMonth && !/^\d{4}-\d{2}$/.test(x.startMonth)) r.warnings.push('Start month should be YYYY-MM');
  if(x.endMonth && !/^\d{4}-\d{2}$/.test(x.endMonth)) r.warnings.push('End month should be YYYY-MM');
  return vDone(r);
}
function validateMonthlyPlan(m){
  const r = vNew();
  if(!m || typeof m!=='object'){ r.errors.push('Monthly plan is not an object'); return vDone(r); }
  if(!m.id) r.errors.push('Missing stable id');
  if(!m.monthKey) r.errors.push('Missing monthKey');
  if(m.status && !PLAN_STATUSES.includes(m.status)) r.warnings.push('Unrecognized plan status: '+m.status);
  if(m.committedTxnIds && !Array.isArray(m.committedTxnIds)) r.errors.push('committedTxnIds must be an array');
  return vDone(r);
}
function validateTransaction(t){
  const r = vNew();
  if(!t || typeof t!=='object'){ r.errors.push('Transaction is not an object'); return vDone(r); }
  if(!t.id) r.errors.push('Missing stable id');
  if(!t.monthKey) r.errors.push('Missing monthKey');
  if(t.uraian===undefined) r.errors.push('Missing description (uraian)');
  if(t.planned!=null && !isNum(t.planned)) r.warnings.push('Planned amount is non-numeric');
  if(t.actual!=null && !isNum(t.actual)) r.warnings.push('Actual amount is non-numeric');
  if(t.planned!=null && Number(t.planned)<0) r.warnings.push('Planned amount is negative');
  return vDone(r);
}
// Imported row (pre-transaction) — used by the Excel/CSV import review.
function validateImportedRow(it){
  const r = vNew();
  if(!it || typeof it!=='object'){ r.errors.push('Row is not an object'); return vDone(r); }
  if(!String(it.uraian||'').trim()) r.warnings.push('Row has no description');
  if(it.planned!=null && !isNum(it.planned)) r.warnings.push('Planned amount is non-numeric');
  return vDone(r);
}
// Overtime record validator (v2.3.0).
function validateOvertime(o){
  const r = vNew();
  if(!o || typeof o!=='object'){ r.errors.push('Overtime record is not an object'); return vDone(r); }
  if(!o.id) r.errors.push('Missing stable id');
  if(!o.employeeId) r.errors.push('Missing employeeId link'); else if(!empById(o.employeeId)) r.warnings.push('Overtime references a missing employee');
  if(o.contractId && !contractById(o.contractId)) r.warnings.push('Overtime references a missing contract');
  if(!o.monthKey) r.errors.push('Missing monthKey');
  if(num(o.overtimeHours)<0) r.errors.push('Overtime hours are negative');
  if(o.status && !OVERTIME_STATUSES.includes(o.status)) r.warnings.push('Unrecognized overtime status: '+o.status);
  if(!(num(o.monthlyStandardHours)>0)) r.warnings.push('Invalid monthly standard hours snapshot');
  return vDone(r);
}
// Backup JSON — thin wrapper over the existing structural validator so imports
// and restore share one entry point returning the standard shape.
function validateBackupJSON(data){
  const base = validateCompleteBackup(data);
  return {valid: base.ok, errors: base.errors||[], warnings: [], info: base.info};
}

/* ---------- data integrity checker (Phase 14) ----------
   Read-only. Never deletes or edits anything. Returns findings ranked
   Critical → Warning → Info. */
function runIntegrityCheck(){
  const findings = [];
  const add = (severity, category, message)=>findings.push({severity, category, message});
  const empIds = new Set(State.employees.map(e=>e.id));
  const ctIds = new Set(State.contracts.map(c=>c.id));
  const ppIds = new Set(State.payrollPlans.map(p=>p.id));
  const txIds = new Set(State.txns.map(t=>t.id));

  // duplicate IDs (critical)
  const dupIds = (arr, label)=>{ const seen=new Set(), dup=new Set(); arr.forEach(r=>{ if(r&&r.id){ if(seen.has(r.id)) dup.add(r.id); else seen.add(r.id); } }); if(dup.size) add('critical','duplicate-id',`${dup.size} duplicate id(s) in ${label}`); };
  dupIds(State.txns,'transactions'); dupIds(State.employees,'employees'); dupIds(State.contracts,'contracts');
  dupIds(State.payrollPlans,'payroll plans'); dupIds(State.recurringExpenses,'recurring expenses'); dupIds(State.monthlyPlans,'monthly plans');

  // broken links (warning)
  let brokenEmp=0, brokenCt=0, brokenPay=0;
  State.contracts.forEach(c=>{ if(c.employeeId && !empIds.has(c.employeeId)) brokenEmp++; });
  State.payrollPlans.forEach(p=>{ if(p.employeeId && !empIds.has(p.employeeId)) brokenEmp++; if(p.contractId && !ctIds.has(p.contractId)) brokenCt++; });
  State.txns.forEach(t=>{ if(t.employeeId && !empIds.has(t.employeeId)) brokenEmp++; if(t.contractId && !ctIds.has(t.contractId)) brokenCt++; if(t.payrollPlanId && !ppIds.has(t.payrollPlanId)) brokenPay++; });
  if(brokenEmp) add('warning','broken-employee-link',`${brokenEmp} record(s) reference a missing employee`);
  if(brokenCt) add('warning','broken-contract-link',`${brokenCt} record(s) reference a missing contract`);
  if(brokenPay) add('warning','broken-payroll-link',`${brokenPay} transaction(s) reference a missing payroll plan`);

  // duplicate payroll rows (warning)
  const seenPay={}; let dupPay=0;
  State.payrollPlans.forEach(p=>{ const k=p.monthKey+'|'+p.employeeId+'|'+p.contractId; if(seenPay[k]) dupPay++; else seenPay[k]=1; });
  if(dupPay) add('warning','duplicate-payroll',`${dupPay} duplicate payroll plan row(s) (same month + employee + contract)`);
  // duplicate payroll transactions
  const seenTx={}; let dupTx=0;
  State.txns.filter(t=>t.source==='payroll').forEach(t=>{ const k=t.monthKey+'|'+t.employeeId+'|'+t.contractId; if(seenTx[k]) dupTx++; else seenTx[k]=1; });
  if(dupTx) add('warning','duplicate-payroll-txn',`${dupTx} duplicate payroll transaction(s) for the same month/employee/contract`);

  // overlapping active contracts (warning)
  let overlap=0; State.employees.forEach(e=>{ overlap += overlappingActiveContracts(e.id).length; });
  if(overlap) add('warning','overlapping-contracts',`${overlap} pair(s) of overlapping active contracts`);

  // orphan payroll transactions (warning)
  let orphan=0; State.txns.filter(t=>t.source==='payroll').forEach(t=>{ if(!t.employeeId || !t.contractId) orphan++; });
  if(orphan) add('warning','orphan-transaction',`${orphan} payroll transaction(s) missing an employee or contract link`);

  // invalid dates (warning)
  let badDates=0; State.contracts.forEach(c=>{ if(!isValidDate(c.startDate)) badDates++; }); State.employees.forEach(e=>{ if(e.joinDate && !isValidDate(e.joinDate)) badDates++; });
  if(badDates) add('warning','invalid-date',`${badDates} record(s) with a missing or invalid date`);

  // negative / invalid amounts (warning)
  let badAmt=0;
  State.txns.forEach(t=>{ if(t.planned!=null && (!isNum(t.planned)||Number(t.planned)<0)) badAmt++; });
  State.payrollPlans.forEach(p=>{ if(p.plannedAmount!=null && (!isNum(p.plannedAmount)||Number(p.plannedAmount)<0)) badAmt++; });
  State.contracts.forEach(c=>{ if(c.monthlySalary!=null && (!isNum(c.monthlySalary)||Number(c.monthlySalary)<0)) badAmt++; });
  if(badAmt) add('warning','invalid-amount',`${badAmt} record(s) with a negative or non-numeric amount`);

  // corrupt monthly-plan references (warning)
  let badRefs=0; State.monthlyPlans.forEach(m=>{ (m.committedTxnIds||[]).forEach(id=>{ if(!txIds.has(id)) badRefs++; }); });
  if(badRefs) add('warning','corrupt-plan-ref',`${badRefs} monthly-plan transaction reference(s) point to a missing transaction`);

  // ----- Overtime integrity (v2.3.0) -----
  dupIds(State.overtimeRecords,'overtime records');
  let otBrokenEmp=0, otBrokenCt=0, otBrokenPay=0, otNegHours=0, otBadSnap=0, otOutside=0;
  State.overtimeRecords.forEach(o=>{
    if(o.employeeId && !empIds.has(o.employeeId)) otBrokenEmp++;
    if(o.contractId && !ctIds.has(o.contractId)) otBrokenCt++;
    if(o.payrollPlanId && !ppIds.has(o.payrollPlanId)) otBrokenPay++;
    if(num(o.overtimeHours)<0) otNegHours++;
    if(!(num(o.monthlyStandardHours)>0) || !(num(o.hourlyRate)>=0) || !isNum(o.calculatedAmount)) otBadSnap++;
    if(o.contractId){ const c=contractById(o.contractId); if(c && !contractCalc(c, o.monthKey).coversMonth) otOutside++; }
  });
  if(otBrokenEmp) add('warning','overtime-broken-employee',`${otBrokenEmp} overtime record(s) reference a missing employee`);
  if(otBrokenCt) add('warning','overtime-broken-contract',`${otBrokenCt} overtime record(s) reference a missing contract`);
  if(otBrokenPay) add('warning','overtime-broken-payroll',`${otBrokenPay} overtime record(s) reference a missing payroll plan`);
  if(otNegHours) add('critical','overtime-negative-hours',`${otNegHours} overtime record(s) have negative hours`);
  if(otBadSnap) add('warning','overtime-bad-snapshot',`${otBadSnap} overtime record(s) have an invalid calculation snapshot`);
  if(otOutside) add('warning','overtime-outside-contract',`${otOutside} overtime record(s) fall outside their contract's covered months`);
  // approved overtime committed twice (same record referenced by >1 payroll plan)
  const otCommitRefCount={};
  State.payrollPlans.forEach(p=>{ (p.overtimeIds||[]).forEach(id=>{ otCommitRefCount[id]=(otCommitRefCount[id]||0)+1; }); });
  const otDoubleCommit = Object.values(otCommitRefCount).filter(n=>n>1).length;
  if(otDoubleCommit) add('critical','overtime-double-commit',`${otDoubleCommit} overtime record(s) are committed to more than one payroll plan`);
  // payroll amount inconsistent with linked overtime
  let otMismatch=0;
  State.payrollPlans.forEach(p=>{ if(p.status==='Committed' && Array.isArray(p.overtimeIds) && p.overtimeIds.length){ const sum=p.overtimeIds.map(id=>overtimeById(id)).filter(Boolean).reduce((s,o)=>s+num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount),0); if(Math.abs(sum-num(p.overtimeAmount!=null?p.overtimeAmount:p.overtime))>1) otMismatch++; } });
  if(otMismatch) add('warning','overtime-payroll-mismatch',`${otMismatch} payroll plan(s) have an overtime total that differs from their linked overtime records`);

  // ----- Smart Import integrity (v2.4.0) -----
  let payNoEmp=0; State.payrollPlans.forEach(p=>{ if(!p.employeeId || !empIds.has(p.employeeId)) payNoEmp++; });
  if(payNoEmp) add('warning','payroll-without-employee',`${payNoEmp} payroll plan(s) have no valid employee`);
  // duplicate employees (same normalized name or same employeeId code)
  const seenName={}, seenCode={}; let dupName=0, dupCode=0;
  State.employees.forEach(e=>{ const n=normStr(e.fullName); if(n){ if(seenName[n]) dupName++; else seenName[n]=1; } if(e.employeeId){ if(seenCode[e.employeeId]) dupCode++; else seenCode[e.employeeId]=1; } });
  if(dupName) add('warning','duplicate-employee',`${dupName} employee(s) share a name with another record`);
  if(dupCode) add('warning','duplicate-employee-id',`${dupCode} employee(s) share an Employee ID with another record`);
  // duplicate payroll plans (employee+contract+month)
  const seenPP={}; let dupPP=0; State.payrollPlans.forEach(p=>{ const k=p.monthKey+'|'+p.employeeId+'|'+p.contractId; if(seenPP[k]) dupPP++; else seenPP[k]=1; });
  if(dupPP) add('warning','duplicate-payroll-plan',`${dupPP} duplicate payroll plan(s) (same employee + contract + month)`);
  // broken import links: records referencing a missing import batch
  const batchIds = new Set(State.importBatches.map(b=>b.batchId));
  let brokenImport=0;
  State.txns.concat(State.payrollPlans, State.employees, State.contracts).forEach(r=>{ if(r && r.importBatchId && !batchIds.has(r.importBatchId)) brokenImport++; });
  if(brokenImport) add('warning','broken-import-link',`${brokenImport} record(s) reference a missing import batch`);
  // rollback conflicts: undone batch whose created records still exist and are executed
  let rbConflict=0; State.importBatches.filter(b=>b.undone).forEach(b=>{ (b.created&&b.created.txns||[]).forEach(id=>{ const t=findTxn(id); if(t && t.actual!=null) rbConflict++; }); });
  if(rbConflict) add('info','rollback-preserved',`${rbConflict} executed transaction(s) were preserved from an undone import (expected, informational)`);
  // invalid contract evidence
  let badEvidence=0; State.contracts.forEach(c=>{ if(c.importEvidence && c.startDate && !isValidDate(c.startDate)) badEvidence++; });
  if(badEvidence) add('warning','invalid-contract-evidence',`${badEvidence} imported contract(s) have invalid start-date evidence`);

  // ----- Native Payroll Operations integrity (v2.5.0) -----
  let pNoEmp=0, pNoCt=0, pOutside=0, pNeg=0, pInconsistent=0, pMissingPlan=0, pMissingTxn=0, pTxnMismatch=0, pOverrideNoReason=0, pDupMonth=0, pOtBroken=0;
  const seenPM={};
  State.payrollPlans.forEach(p=>{
    if(p.status==='Cancelled') return;
    if(!p.employeeId || !empIds.has(p.employeeId)) pNoEmp++;
    if(!p.contractId || !ctIds.has(p.contractId)) pNoCt++;
    else { const c=contractById(p.contractId); if(c && !contractCalc(c, p.monthKey).coversMonth) pOutside++; }
    if(computePayrollPlanned(p)<0) pNeg++;
    if(p.plannedAmount!=null && Math.abs(num(p.plannedAmount)-computePayrollPlanned(p))>1) pInconsistent++;
    if(p.monthlyPlanId && !State.monthlyPlans.some(m=>m.id===p.monthlyPlanId)) pMissingPlan++;
    if(p.status==='Committed'){ const t=payrollTxnOf(p); if(!t) pMissingTxn++; else if(t.actual==null && Math.abs(num(t.planned)-num(p.plannedAmount))>1) pTxnMismatch++; }
    if(p.salaryOverride && !String(p.salaryOverride.reason||'').trim()) pOverrideNoReason++;
    const k=p.monthKey+'|'+p.employeeId; if(seenPM[k]) pDupMonth++; else seenPM[k]=1;
    (p.overtimeIds||[]).forEach(oid=>{ if(!overtimeById(oid)) pOtBroken++; });
  });
  if(pNoEmp) add('warning','payroll-no-employee',`${pNoEmp} payroll plan(s) without a valid employee`);
  if(pNoCt) add('warning','payroll-no-contract',`${pNoCt} payroll plan(s) without a valid contract`);
  if(pOutside) add('warning','payroll-outside-contract',`${pOutside} payroll plan(s) outside their contract's covered months`);
  if(pDupMonth) add('warning','payroll-duplicate-month',`${pDupMonth} duplicate employee payroll for the same month`);
  if(pNeg) add('critical','payroll-negative',`${pNeg} payroll plan(s) with a negative final amount`);
  if(pOtBroken) add('warning','payroll-overtime-broken',`${pOtBroken} broken overtime link(s) in payroll plans`);
  if(pInconsistent) add('warning','payroll-total-inconsistent',`${pInconsistent} payroll plan(s) whose stored total differs from the component sum`);
  if(pMissingPlan) add('warning','payroll-missing-monthlyplan',`${pMissingPlan} payroll plan(s) linked to a missing monthly plan`);
  if(pMissingTxn) add('warning','payroll-missing-transaction',`${pMissingTxn} committed payroll plan(s) with no linked transaction`);
  if(pTxnMismatch) add('warning','payroll-txn-mismatch',`${pTxnMismatch} transaction(s) whose amount differs from the payroll plan`);
  if(pOverrideNoReason) add('warning','payroll-override-no-reason',`${pOverrideNoReason} salary override(s) without a reason`);
  // recurring adjustment outside effective period is prevented at generation; flag stored snapshots that fall outside
  let adjOutside=0; State.payrollAdjustments.forEach(a=>{ if(a.endMonth && a.startMonth && a.endMonth < a.startMonth) adjOutside++; });
  if(adjOutside) add('warning','adjustment-invalid-period',`${adjOutside} recurring adjustment(s) with an end month before the start month`);

  // ----- Employee deduplication integrity (v2.5.2) -----
  const dupGroups = findEmployeeDuplicateGroups();
  if(dupGroups.length){
    const dupRecords = dupGroups.reduce((n,g)=>n+g.employees.length,0);
    add('critical','duplicate-employee-name',`${dupGroups.length} duplicate employee name group(s) covering ${dupRecords} record(s) — same person under multiple IDs (open Employee Duplicate Review)`);
    let splitPay=0, splitOt=0, conflictContact=0, orphanDup=0;
    dupGroups.forEach(g=>{
      const ids=new Set(g.employees.map(e=>e.id));
      if(new Set(State.payrollPlans.filter(p=>ids.has(p.employeeId)).map(p=>p.employeeId)).size>1) splitPay++;
      if(new Set(State.overtimeRecords.filter(o=>ids.has(o.employeeId)).map(o=>o.employeeId)).size>1) splitOt++;
      ['bankAccount','email'].forEach(f=>{ if(new Set(g.employees.map(e=>e[f]).filter(v=>v&&String(v).trim())).size>1) conflictContact++; });
      g.employees.forEach(e=>{ if(employeeLinkCount(e.id)===0) orphanDup++; });
    });
    if(splitPay) add('warning','payroll-split-across-duplicates',`${splitPay} person(s) have payroll plans split across multiple duplicate employee IDs`);
    if(splitOt) add('warning','overtime-split-across-duplicates',`${splitOt} person(s) have overtime split across multiple duplicate employee IDs`);
    if(conflictContact) add('info','duplicate-contact-conflict',`${conflictContact} duplicate group(s) have conflicting bank account or email values to reconcile`);
    if(orphanDup) add('info','orphan-duplicate-employee',`${orphanDup} duplicate employee record(s) have no linked data (safe to merge or remove)`);
  }
  // contract number linked to more than one employee (critical)
  const cnToEmp={}; let cnMultiEmp=0;
  State.contracts.forEach(c=>{ if(!c.contractNumber) return; const k=normStr(c.contractNumber); (cnToEmp[k]=cnToEmp[k]||new Set()).add(c.employeeId); });
  Object.values(cnToEmp).forEach(s=>{ if(s.size>1) cnMultiEmp++; });
  if(cnMultiEmp) add('critical','contract-multiple-employees',`${cnMultiEmp} contract number(s) linked to more than one employee`);
  // Smart Import batch that created multiple employees for a single candidate
  let batchMultiCand=0;
  (State.importBatches||[]).forEach(b=>{ if(b.undone || !b.candidateMap) return; const created=(b.created&&b.created.employees)||[]; if(created.length > new Set(Object.values(b.candidateMap)).size) batchMultiCand++; });
  if(batchMultiCand) add('warning','import-multiple-employees-per-candidate',`${batchMultiCand} Smart Import batch(es) created more than one employee for a single candidate`);

  // ----- Payroll historical source-of-truth & Supplemental integrity (v2.7.1) -----
  // NEVER auto-repairs; only detects and classifies. Uses the immutable transaction as truth.
  let pPostedNoTxn=0, pTxnNoPlanId=0, pPlanTxnTotalDiff=0, pPlanTxnOtDiff=0, pMissingOtIds=0, pNewNoSnapshot=0, pSnapTxnDiff=0;
  State.payrollPlans.forEach(p=>{
    if(p.status==='Cancelled') return;
    const stage = (typeof payrollStage==='function') ? payrollStage(p) : (p.status==='Committed'?'Posted':'Draft');
    if(stage!=='Posted' && stage!=='Executed') return;
    const t = payrollTxnOf(p);
    if(!t){ pPostedNoTxn++; return; }
    if(!t.payrollPlanId) pTxnNoPlanId++;
    const planTotal = num(p.plannedAmount!=null?p.plannedAmount:computePayrollPlanned(p));
    const planOt = num(p.overtimeAmount!=null?p.overtimeAmount:p.overtime);
    if(Math.abs(planTotal-num(t.planned))>1) pPlanTxnTotalDiff++;
    if(Math.abs(planOt-num(t.overtimeAmount))>1) pPlanTxnOtDiff++;
    if(num(t.overtimeAmount)>0 && !((p.overtimeIds||[]).length) && !((t.overtimeIds||[]).length)) pMissingOtIds++;
    // v2.7.1-committed rows must carry a frozen snapshot; legacy rows are exempt (warning only if new)
    if(p.committedSnapshot){ if(Math.abs(num(p.committedSnapshot.totalPayroll)-num(t.planned))>1) pSnapTxnDiff++; }
    else if(p.committedAt && new Date(p.committedAt).getTime() >= Date.parse('2026-07-31')) pNewNoSnapshot++;
  });
  if(pPostedNoTxn) add('critical','payroll-posted-no-transaction',`${pPostedNoTxn} Posted/Executed payroll(s) with no linked finance transaction`);
  if(pTxnNoPlanId) add('warning','payroll-txn-missing-planid',`${pTxnNoPlanId} linked payroll transaction(s) missing payrollPlanId`);
  if(pPlanTxnTotalDiff) add('warning','payroll-plan-txn-total-diff',`${pPlanTxnTotalDiff} payroll plan total(s) differ from the linked transaction planned amount`);
  if(pPlanTxnOtDiff) add('warning','payroll-plan-txn-overtime-diff',`${pPlanTxnOtDiff} payroll plan overtime amount(s) differ from the committed transaction overtime`);
  if(pMissingOtIds) add('warning','payroll-missing-overtime-ids',`${pMissingOtIds} committed payroll transaction(s) carry overtime but no linked overtime IDs`);
  if(pNewNoSnapshot) add('warning','payroll-missing-committed-snapshot',`${pNewNoSnapshot} newly posted payroll(s) are missing the immutable overtime snapshot`);
  if(pSnapTxnDiff) add('warning','payroll-snapshot-txn-diff',`${pSnapTxnDiff} committed payroll snapshot total(s) differ from the linked transaction`);

  const supps = State.supplementalPayments||[];
  let sMissingTxn=0, sOrphanTxn=0, sDupOtId=0, sPostedNoSnapLegacy=0, sPostedNoSnapModern=0, sMutable=0;
  // Source-overtime snapshots are frozen at Approve only since v2.7.1 (Payroll Integrity release).
  // A Posted/Executed supplemental approved BEFORE that date legitimately has none — a legacy
  // display-provenance gap, not a data-integrity fault. One approved on/after that date should have
  // one, so its absence is a genuine concern worth investigating.
  const V271_SNAPSHOT_DATE = Date.parse('2026-07-31');
  supps.forEach(s=>{
    if(s.financeTransactionId && !txIds.has(s.financeTransactionId)) sMissingTxn++;
    if(['Posted','Executed'].includes(s.status) && !(Array.isArray(s.sourceOvertimeSnapshot) && s.sourceOvertimeSnapshot.length)){
      const ts = Date.parse(s.approvedAt||s.postedAt||s.createdAt||s.updatedAt||'') || 0;
      if(ts && ts >= V271_SNAPSHOT_DATE) sPostedNoSnapModern++; else sPostedNoSnapLegacy++;
    }
    if(['Posted','Executed'].includes(s.status)){
      // amount must equal the frozen source snapshot / source IDs basis (mutation detection)
      const basis = (Array.isArray(s.sourceOvertimeSnapshot)&&s.sourceOvertimeSnapshot.length)
        ? s.sourceOvertimeSnapshot.reduce((n,o)=>n+num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount),0)
        : null;
      if(basis!=null && Math.abs(basis-num(s.amount))>1) sMutable++;
    }
  });
  // finance transaction linked to a missing supplemental
  State.txns.forEach(t=>{ if(t.supplementalId && !supps.some(s=>s.id===t.supplementalId)) sOrphanTxn++; });
  // an overtime ID captured by more than one non-cancelled supplemental anywhere
  const suppOtCount={};
  supps.filter(s=>s.status!=='Cancelled').forEach(s=>{ (s.sourceOvertimeIds||[]).forEach(id=>{ suppOtCount[id]=(suppOtCount[id]||0)+1; }); });
  sDupOtId = Object.values(suppOtCount).filter(n=>n>1).length;
  if(sMissingTxn) add('critical','supplemental-missing-transaction',`${sMissingTxn} supplemental(s) linked to a missing finance transaction`);
  if(sOrphanTxn) add('critical','supplemental-orphan-transaction',`${sOrphanTxn} finance transaction(s) linked to a missing supplemental`);
  if(sDupOtId) add('critical','supplemental-overtime-double-capture',`${sDupOtId} overtime record(s) captured by more than one non-cancelled supplemental`);
  if(sPostedNoSnapModern) add('warning','supplemental-missing-source-snapshot',`${sPostedNoSnapModern} Posted/Executed supplemental(s) approved under v2.7.1+ are missing a frozen source snapshot — investigate (source overtime may have been unresolvable at approval)`);
  if(sPostedNoSnapLegacy) add('info','supplemental-missing-source-snapshot-legacy',`${sPostedNoSnapLegacy} legacy (pre-v2.7.1) Posted/Executed supplemental(s) have no frozen source snapshot — display-only; the payment and its amount are unaffected`);
  if(sMutable) add('warning','supplemental-amount-drift',`${sMutable} Posted/Executed supplemental(s) whose amount differs from their frozen source snapshot`);

  // run schema validators across every entity, roll warnings/errors up
  let vErr=0, vWarn=0;
  const runV = (arr, fn)=>arr.forEach(x=>{ const r=fn(x); vErr+=r.errors.length; vWarn+=r.warnings.length; });
  runV(State.employees, validateEmployee); runV(State.contracts, validateContract);
  runV(State.payrollPlans, validatePayrollPlan); runV(State.recurringExpenses, validateRecurring);
  runV(State.monthlyPlans, validateMonthlyPlan); runV(State.txns, validateTransaction);
  runV(State.overtimeRecords, validateOvertime);
  if(vErr) add('critical','schema-error',`${vErr} field-level validation error(s) across all records`);
  if(vWarn) add('info','schema-warning',`${vWarn} field-level validation warning(s) across all records`);

  const order = {critical:0, warning:1, info:2};
  findings.sort((a,b)=>order[a.severity]-order[b.severity]);
  const counts = {critical:findings.filter(f=>f.severity==='critical').length, warning:findings.filter(f=>f.severity==='warning').length, info:findings.filter(f=>f.severity==='info').length};
  const status = counts.critical? 'Critical issues found' : counts.warning? 'Warnings found' : 'Healthy';
  const result = {findings, counts, status, ranAt:new Date().toISOString()};
  State.lastIntegrity = result;
  return result;
}

/* ---------- appearance / theme (Part 15) ---------- */
function resolveTheme(pref){
  pref = pref || (State.settings && State.settings.appearance) || 'system';
  if(pref==='dark') return 'dark';
  if(pref==='light') return 'light';
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
// Sets the semantic theme on <html>; all CSS variables and charts follow it.
function applyTheme(){
  const eff = resolveTheme();
  document.documentElement.dataset.theme = eff;
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content', eff==='light' ? '#F3F5F8' : '#0E1420');
  return eff;
}
let __themeMediaBound = false;
function bindSystemThemeListener(){
  if(__themeMediaBound || !window.matchMedia) return; __themeMediaBound = true;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  // Live-update only while the user is on "Follow System"; a manual override
  // ignores OS changes until they return to System.
  const handler = ()=>{ if(((State.settings && State.settings.appearance) || 'system')==='system'){ applyTheme(); if(State.storageReady) render(); } };
  if(mq.addEventListener) mq.addEventListener('change', handler);
  else if(mq.addListener) mq.addListener(handler);
}
// Read a theme-aware color from the CSS variables (charts call this at draw time).
function themeVar(name, fallback){
  try{ const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }
  catch(e){ return fallback; }
}

/* ============================================================
   OVERTIME ENGINE (v2.3.0)
   TAM Internal Overtime Calculation Method:
     Monthly Standard Hours = hours/day × days/week × weeks/month
     Hourly Rate            = Monthly Salary ÷ Monthly Standard Hours   (full precision)
     Overtime Amount        = Overtime Hours × Hourly Rate              (round ONLY the final payable)
   Each employee/contract carries its own schedule — no global assumption.
   ============================================================ */

/* ---------- work schedule resolution (Part 3) ---------- */
function readSchedule(o){
  if(!o) return null;
  const h=Number(o.workHoursPerDay), d=Number(o.workDaysPerWeek), w=Number(o.weeksPerMonth);
  if(o.workHoursPerDay||o.workDaysPerWeek||o.weeksPerMonth){
    return {hoursPerDay:h||0, daysPerWeek:d||0, weeksPerMonth:w||0, effectiveDate:o.scheduleEffectiveDate||null, notes:o.scheduleNotes||null};
  }
  return null;
}
// Precedence: contract schedule → employee schedule → company default settings.
function effectiveSchedule(emp, contract){
  const fromCt = readSchedule(contract), fromEmp = readSchedule(emp);
  const base = fromCt || fromEmp || {
    hoursPerDay:Number(State.settings.companyWorkHoursPerDay)||8,
    daysPerWeek:Number(State.settings.companyWorkDaysPerWeek)||5,
    weeksPerMonth:Number(State.settings.companyWeeksPerMonth)||4,
    effectiveDate:null, notes:'Company default schedule',
  };
  const source = fromCt?'contract':fromEmp?'employee':'company';
  const valid = base.hoursPerDay>0 && base.daysPerWeek>0 && base.weeksPerMonth>0;
  return {...base, source, valid};
}
// Shared work-schedule form fields for the employee and contract modals (Part 3).
// Blank = inherit (employee inherits company; contract inherits employee).
function scheduleFieldsHTML(v, scopeLabel){
  return `
    <div class="field" style="grid-column:span 2;"><div class="divider" style="margin:6px 0;"></div><label style="font-weight:600;">Work Schedule <span class="faint">(${scopeLabel} — leave blank to inherit)</span></label></div>
    <div class="field"><label>Working Hours / Day</label><input class="input" type="number" step="0.5" min="0" name="workHoursPerDay" value="${v.workHoursPerDay??''}" placeholder="e.g. 6 or 8"></div>
    <div class="field"><label>Working Days / Week</label><input class="input" type="number" step="1" min="0" name="workDaysPerWeek" value="${v.workDaysPerWeek??''}" placeholder="default 5"></div>
    <div class="field"><label>Weeks / Month</label><input class="input" type="number" step="1" min="0" name="weeksPerMonth" value="${v.weeksPerMonth??''}" placeholder="default 4"></div>
    <div class="field"><label>Schedule Effective Date</label><input class="input" type="date" name="scheduleEffectiveDate" value="${escapeHtml(v.scheduleEffectiveDate||'')}"></div>
    <div class="field" style="grid-column:span 2;"><label>Schedule Notes</label><input class="input" name="scheduleNotes" value="${escapeHtml(v.scheduleNotes||'')}"></div>`;
}
function applyScheduleFromForm(fd, rec){
  const h=fd.get('workHoursPerDay'), d=fd.get('workDaysPerWeek'), w=fd.get('weeksPerMonth');
  rec.workHoursPerDay = (h===''||h==null)?null:Number(h);
  rec.workDaysPerWeek = (d===''||d==null)?null:Number(d);
  rec.weeksPerMonth   = (w===''||w==null)?null:Number(w);
  rec.scheduleEffectiveDate = fd.get('scheduleEffectiveDate')||null;
  rec.scheduleNotes = (fd.get('scheduleNotes')||'').trim()||null;
}

/* ---------- overtime calculation (Parts 4, 5) ---------- */
function roundOvertime(v){
  const rule = OVERTIME_ROUNDING[State.settings.overtimeRounding] || OVERTIME_ROUNDING.rupiah;
  if(!rule.step) return v;                 // no rounding
  return Math.round(v/rule.step)*rule.step; // round only the final payable amount
}
// Full-precision calculation. The hourly rate is NEVER rounded before it is
// multiplied by hours — only the payable amount is rounded (per settings).
function overtimeCalc(salary, sched, hours){
  const standardHours = (Number(sched.hoursPerDay)||0)*(Number(sched.daysPerWeek)||0)*(Number(sched.weeksPerMonth)||0);
  const hourlyRate = standardHours>0 ? (Number(salary)||0)/standardHours : 0;
  const rawAmount = hourlyRate * (Number(hours)||0);
  return {standardHours, hourlyRate, rawAmount, amount: roundOvertime(rawAmount)};
}
// Salary basis for overtime: active contract's monthly salary, else employee base.
function overtimeSalaryBasis(emp, contract){
  if(contract && contract.monthlySalary!=null) return Number(contract.monthlySalary)||0;
  return Number(emp && emp.monthlyBaseSalary)||0;
}
function fmtIDRfull(n){ if(n==null||isNaN(n)) return '—'; return 'Rp'+Number(n).toLocaleString('id-ID',{maximumFractionDigits:4}); }

/* ---------- overtime record operations (Parts 6, 7) ---------- */
function overtimeById(id){ return State.overtimeRecords.find(o=>o.id===id); }
function overtimeForEmployeeMonth(empId, monthKey){ return State.overtimeRecords.filter(o=>o.employeeId===empId && o.monthKey===monthKey); }
// Overtime that should feed payroll for an employee/month: approved (not yet
// committed) plus anything already committed for that employee/month.
function approvedOvertimeForMonth(empId, monthKey){
  const recs = overtimeForEmployeeMonth(empId, monthKey).filter(o=>o.status==='Approved' || o.status==='Committed to Payroll');
  const amount = recs.reduce((s,o)=>s+num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount),0);
  return {records:recs, amount, ids:recs.map(o=>o.id)};
}
function buildOvertimeRecord(fields){
  const emp = empById(fields.employeeId);
  const contract = fields.contractId ? contractById(fields.contractId) : (emp?activeContractToday(emp.id):null);
  const sched = effectiveSchedule(emp, contract);
  const salary = overtimeSalaryBasis(emp, contract);
  const hours = Math.max(0, num(fields.overtimeHours));
  const calc = overtimeCalc(salary, sched, hours);
  const mo = keyToMonthObj(fields.monthKey);
  const now = new Date().toISOString();
  return {
    id: uid('ot'), employeeId: emp?emp.id:null, employeeName: emp?emp.fullName:'', contractId: contract?contract.id:null, contractNumber: contract?contract.contractNumber:null,
    payrollPlanId:null, committedTxnId:null,
    monthKey: fields.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
    overtimeDate: fields.overtimeDate||null, overtimeHours: hours, workDescription: fields.workDescription||'', project: fields.project||null,
    // snapshots — preserved even if schedule/salary later change
    snapHoursPerDay: sched.hoursPerDay, snapDaysPerWeek: sched.daysPerWeek, snapWeeksPerMonth: sched.weeksPerMonth, snapMonthlySalary: salary, scheduleSource: sched.source,
    monthlyStandardHours: calc.standardHours, hourlyRate: calc.hourlyRate,
    calculatedAmount: calc.amount, rawAmount: calc.rawAmount, approvedAmount: null,
    status: 'Draft', notes: fields.notes||'', createdAt: now, updatedAt: now,
    history:[{event:'created', ts:now, note:'Overtime record created'}],
  };
}
async function addOvertimeRecord(fields){
  const rec = buildOvertimeRecord(fields);
  State.overtimeRecords.push(rec);
  await persistOvertime();
  return rec;
}
async function updateOvertimeRecord(id, fields){
  const o = overtimeById(id); if(!o) return;
  Object.assign(o, fields);
  // recompute from snapshots + new hours (snapshots stay fixed unless re-derived)
  const hours = Math.max(0, num(o.overtimeHours));
  const sched = {hoursPerDay:o.snapHoursPerDay, daysPerWeek:o.snapDaysPerWeek, weeksPerMonth:o.snapWeeksPerMonth};
  const calc = overtimeCalc(o.snapMonthlySalary, sched, hours);
  o.overtimeHours=hours; o.monthlyStandardHours=calc.standardHours; o.hourlyRate=calc.hourlyRate; o.calculatedAmount=calc.amount; o.rawAmount=calc.rawAmount;
  o.updatedAt=new Date().toISOString();
  (o.history=o.history||[]).push({event:'edited', ts:o.updatedAt, note:'Overtime record edited'});
  await persistOvertime();
}
async function setOvertimeStatus(id, status){
  const o = overtimeById(id); if(!o) return;
  if(isPayrollLocked(o.monthKey)){ showWarning('That payroll period is locked — overtime cannot be modified.'); return; }
  if(o.status==='Committed to Payroll'){ showWarning('This overtime is already committed to payroll and cannot change status.'); return; }
  o.status = status;
  if(status==='Approved' && o.approvedAmount==null) o.approvedAmount = o.calculatedAmount;
  o.updatedAt = new Date().toISOString();
  (o.history=o.history||[]).push({event:status.toLowerCase(), ts:o.updatedAt, note:'Status → '+status});
  await persistOvertime();
  const otEmp=empById(o.employeeId); const otName=(otEmp&&otEmp.fullName)||o.employeeName||'Employee';
  logActivity({type:'overtime.'+status.toLowerCase().replace(/\s+/g,'-'), module:'Overtime', entity:otName, entityId:o.id,
    desc:`${otName}: overtime ${status}${o.overtimeDate?' ('+o.overtimeDate+')':''}`,
    refs:{employeeId:o.employeeId, monthKey:o.monthKey}});
  showSuccess('Overtime '+status.toLowerCase()+'.'); render();
}
async function duplicateOvertimeRecord(id){
  const o = overtimeById(id); if(!o) return;
  if(isPayrollLocked(o.monthKey)){ showWarning('That payroll period is locked — overtime cannot be added.'); return; }
  const copy = JSON.parse(JSON.stringify(o));
  copy.id = uid('ot'); copy.status='Draft'; copy.approvedAmount=null; copy.payrollPlanId=null; copy.committedTxnId=null;
  copy.createdAt = copy.updatedAt = new Date().toISOString();
  copy.history = [{event:'created', ts:copy.createdAt, note:'Duplicated from '+(o.workDescription||o.id)}];
  State.overtimeRecords.push(copy);
  await persistOvertime(); showSuccess('Overtime duplicated as Draft.'); render();
}
async function deleteOvertimeRecord(id){
  const o = overtimeById(id); if(!o) return;
  if(isPayrollLocked(o.monthKey)){ showWarning('That payroll period is locked — overtime cannot be deleted.'); return; }
  if(o.status==='Committed to Payroll'){ showWarning('Committed overtime cannot be deleted. Reject is unavailable after commit.'); return; }
  if(!confirmAction('Delete this overtime record? This cannot be undone.')) return;
  State.overtimeRecords = State.overtimeRecords.filter(x=>x.id!==id);
  await persistOvertime(); showSuccess('Overtime deleted.'); render();
}

/* ---------- Overtime page (Part 7) ---------- */
/* v2.6.1 — Overtime incremental list. applyOvertimeFilter updates only the <tbody>
   and the filter-dependent summary tiles (Records Shown / Total Hours / Total Amount). */
function overtimeFiltered(){
  const f = State.overtimeFilter;
  let rows = State.overtimeRecords.slice();
  if(f.status!=='all') rows = rows.filter(o=>o.status===f.status);
  if(f.month!=='all') rows = rows.filter(o=>o.monthKey===f.month);
  if(f.search.trim()){ const s=normStr(f.search); rows = rows.filter(o=>[o.employeeName,o.workDescription,o.contractNumber,o.notes].some(x=>normStr(x||'').includes(s))); }
  rows.sort((a,b)=> String(b.monthKey).localeCompare(String(a.monthKey)) || String(b.overtimeDate||'').localeCompare(String(a.overtimeDate||'')));
  return rows;
}
function overtimeRowsHTML(){

    area.querySelector('#wsApprove').addEventListener('click', async ()=>{ await worksheetSave(monthKey, rows, true); renderOvertimeWorksheet(main); });
  };

}
async function worksheetSave(monthKey, rows, approve){
  if(isPayrollLocked(monthKey)){ showWarning('That payroll period is locked — overtime cannot be modified.'); return; }
  let saved=0;
  for(const r of rows){
    const hours = num(r.hours);
    // find an existing draft to update, else create when hours>0
    let rec = State.overtimeRecords.find(o=>o.monthKey===monthKey && o.employeeId===r.employeeId && (o.status==='Draft'||(approve&&o.status==='Approved')));
    if(hours<=0){ continue; }
    if(rec){ await updateOvertimeRecord(rec.id, {overtimeHours:hours, workDescription:rec.workDescription||'Monthly worksheet entry'}); }
    else { rec = await addOvertimeRecord({employeeId:r.employeeId, monthKey, overtimeHours:hours, workDescription:'Monthly worksheet entry'}); }
    if(approve && rec){ const o=overtimeById(rec.id); if(o && o.status!=='Committed to Payroll'){ o.status='Approved'; if(o.approvedAmount==null) o.approvedAmount=o.calculatedAmount; o.updatedAt=new Date().toISOString(); } }
    saved++;
  }
  await persistOvertime();
  showSuccess(`${saved} employee overtime row(s) saved${approve?' and approved':' as Draft'}.`);
}

/* ---------- first-run onboarding checklist (Part 2) ----------
   v2.6.6 — "Configure company settings" completion is derived purely from PERSISTED
   settings (tam_settings_v1), never from transient UI state, so it stays correct across
   navigation and reload. The company profile counts as configured when the user has made at
   least one meaningful change to the company identity: a non-default Company Name OR a
   non-default Product Name OR an Opening Cash Balance that has been set. Unchanged shipped
   defaults do NOT count (a fresh install is "not configured"), and a theme-only save does not
   count (Appearance is not a company-identity field). Optional blank fields never block it. */
// v2.7.1 — legacy inference retained ONLY as a conservative one-time fallback for
// settings/backups saved before the explicit marker existed (see companySettingsConfigured).
function legacyMeaningfulCompanyProfile(s){
  s = s || (typeof State!=='undefined' && State.settings) || {};
  const name = (s.companyName||'').trim();
  const product = (s.productName||'').trim();
  const nameSet = !!name && name !== COMPANY_NAME_DEFAULT;      // intentional, non-default company name
  const productSet = !!product && product !== APP_NAME;         // intentional, non-default product name
  const cashSet = s.openingCashBalance != null;                 // opening cash balance supplied
  return nameSet || productSet || cashSet;
}
// v2.7.1 — completion is driven by an explicit persisted marker set only after a successful
// Settings save (companySettingsConfiguredAt); the legacy inference is a fallback for older
// data so pre-marker backups with a meaningful identity stay checked. A fresh install has
// neither, so it is correctly "not configured".
function companySettingsConfigured(s){
  s = s || (typeof State!=='undefined' && State.settings) || {};
  return Boolean(s.companySettingsConfiguredAt || legacyMeaningfulCompanyProfile(s));
}
function onboardingSteps(){
  return [
    {label:'Configure company settings', done: companySettingsConfigured(State.settings), view:'settings'},
    {label:'Add employees', done: State.employees.length>0, view:'employees'},
    {label:'Add employee contracts', done: State.contracts.length>0, view:'contracts'},
    {label:'Configure employee work schedules', done: State.employees.some(e=>readSchedule(e))||State.contracts.some(c=>readSchedule(c)), view:'employees'},
    {label:'Configure recurring expenses', done: State.recurringExpenses.length>0, view:'recurring'},

function meaningfulDataCounts(){
  const batchRecords = b => (b && b.created) ? ((b.created.employees||[]).length + (b.created.contracts||[]).length + (b.created.payrollPlans||[]).length + (b.created.txns||[]).length) : (b && b.counts ? ((b.counts.employees||0)+(b.counts.contracts||0)+(b.counts.payrollPlans||0)+(b.counts.txns||0)) : 0);
  return {
    'Transactions': State.txns.length,
    'Employees': State.employees.length,
    'Contracts': State.contracts.length,

    'Recurring Expenses': State.recurringExpenses.length,

    'Import Batches': State.importBatches.filter(b=>!b.undone && batchRecords(b)>0).length,
  };
}
function hasMeaningfulBusinessData(){
  const c = meaningfulDataCounts();

}
