  logActivity({type:locked?'payroll.lock':'payroll.unlock', module:'Payroll', entity:`${mo.month} ${mo.year}`, entityId:monthKey,
    desc:`Payroll period ${locked?'locked':'unlocked'}`, refs:{monthKey}});
}

/* ---------- payroll audit timeline (v2.6.4) — derived, real events only ----------
   No new state: the per-plan timeline is derived from the plan's own history[], the
   linked finance transaction's history, and lock/unlock records in the audit log.
   Events with no real timestamp are simply omitted (never fabricated). */
function buildPayrollTimeline(pp){
  if(!pp) return [];
  const ev=[]; const hist = pp.history||[];
  const firstOf = (match)=>{ const h=hist.filter(match).sort((a,b)=>new Date(a.ts||0)-new Date(b.ts||0))[0]; return h?h.ts:null; };
  const lastOf  = (match)=>{ const h=hist.filter(match).sort((a,b)=>new Date(a.ts||0)-new Date(b.ts||0)).pop(); return h?h.ts:null; };
  const push=(label, ts, detail)=>{ if(ts) ev.push({label, ts, detail:detail||''}); };
  push('Generated', firstOf(h=>h.event==='generated'), 'Generated from active contract + approved overtime');
  push('Reviewed', lastOf(h=>h.event==='reviewed'), 'Marked reviewed');
  push('Approved', lastOf(h=>h.event==='marked-ready'||h.event==='ready'), 'Approved (ready to post)');
  push('Posted to Finance', lastOf(h=>h.event==='committed'||h.event==='transaction-created'), 'Planned Gaji transaction created in finance');
  const txn=payrollTxnOf(pp);
  if(txn){
    const exec=(txn.history||[]).filter(h=>h.event==='executed').sort((a,b)=>new Date(a.ts||0)-new Date(b.ts||0)).pop();
    if(exec) push('Executed', exec.ts, exec.note||'Paid via Execution Center');
    else if(['completed','archived'].includes(statusOf(txn)) && txn.execution && txn.execution.ts) push('Executed', txn.execution.ts, 'Paid via Execution Center');
  }
  // Period lock / unlock come from the audit log for this month (only if recorded).
  if(typeof auditEventsForMonth==='function'){
    auditEventsForMonth(pp.monthKey).forEach(e=>{
      if(e.type==='payroll.lock') push('Period Locked', e.ts, e.desc);
      else if(e.type==='payroll.unlock') push('Period Unlocked', e.ts, e.desc);
    });
  }
  ev.sort((a,b)=> new Date(a.ts) - new Date(b.ts)); // chronological
  return ev;
}
// Period-level activity for the whole month (generate / post / lock / unlock), newest first.
function buildPayrollPeriodTimeline(monthKey){
  if(typeof auditEventsForMonth!=='function') return [];
  return auditEventsForMonth(monthKey)
    .filter(e=> ['payroll.generate','payroll.post','payroll.lock','payroll.unlock'].includes(e.type))
    .map(e=>({label:auditTypeLabel(e.type), ts:e.ts, detail:e.desc}))
    .sort((a,b)=> new Date(b.ts||0) - new Date(a.ts||0));
}

/* ============================================================
   OVERTIME DRIFT VISIBILITY (v2.6.8, Issue 2)
   Derived, read-only comparison between the approved overtime that
   currently applies to a payroll plan's employee/month and the set the
   plan actually captured at generation/commit. Reuses the existing
   overtime comparison logic (approvedOvertimeForMonth + sameIdSet).
   No stored flag and no schema/storage/migration change: the warning is
   recomputed at render, so it appears immediately after an overtime
   approval (no Generate click required) and survives reload without
   duplicating. Posted/Executed payroll stays immutable — totals, posted
   and executed transactions are never touched; this only surfaces that a
   supplemental payment will be needed. Supplemental Payment itself is not
   implemented in v2.6.8 (disabled placeholder only). */
const OT_DRIFT_MSG_UNCOMMITTED = 'Overtime approved. Regenerate payroll to include the updated overtime.';
// Returns null when the plan's captured overtime still matches the currently approved
// overtime, otherwise a small descriptor of the drift (committed vs not, amount added).
function payrollOvertimeDrift(pp){
  if(!pp || pp.status==='Cancelled') return null;
  const current = approvedOvertimeForMonth(pp.employeeId, pp.monthKey);
  const stored  = pp.overtimeIds||[];
  if(sameIdSet(stored, current.ids)) return null;   // in sync — no drift
  const stage = payrollStage(pp);
  const committed = (stage==='Posted' || stage==='Executed');
  const addedIds   = current.ids.filter(id=>!stored.includes(id));
  const removedIds = stored.filter(id=>!current.ids.includes(id));
  const addedAmount = addedIds.reduce((s,id)=>{ const o=overtimeById(id); return s + (o?num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount):0); }, 0);
  return {stage, committed, addedIds, removedIds, addedAmount};
}
function payrollPlansWithDrift(plans){
  return (plans||[]).filter(p=>p && p.status!=='Cancelled')
    .map(p=>({pp:p, drift:payrollOvertimeDrift(p)}))
    .filter(x=>x.drift);
}
// Reusable warning banner for overtime drift across a set of plans (Overtime page,
// Payroll Workspace, Payroll Detail all render this from the same source of truth).
function payrollDriftBannerHTML(plans){
  const rows = payrollPlansWithDrift(plans);
  if(!rows.length) return '';
  const uncommitted = rows.filter(x=>!x.drift.committed);
  const committed   = rows.filter(x=> x.drift.committed);
  const item = x=>`<div class="insight-item warn"><b>${escapeHtml(x.pp.employeeName||'—')}</b> — ${escapeHtml(x.pp.month)} ${x.pp.year}${x.drift.addedAmount?`: +${fmtIDR(x.drift.addedAmount)} approved overtime`:''} <span class="faint">(${escapeHtml(payrollStage(x.pp))})</span></div>`;
  let html='';
  if(uncommitted.length){
    html += `<div class="card ot-drift-banner" style="margin-bottom:14px;border-left:3px solid var(--accent);">
      <h3>Overtime approved — payroll not yet updated <span class="tag">${uncommitted.length}</span></h3>
      <p style="margin:4px 0 8px;">${OT_DRIFT_MSG_UNCOMMITTED}</p>
      <div class="insight-list">${uncommitted.map(item).join('')}</div>
    </div>`;
  }
  if(committed.length){
    // v2.7.0 — the committed-drift banner is now actionable via the Supplemental Payroll
    // Engine. Show only plans that still need action: generate a supplemental, or open the
    // existing Draft/Review one. Drift already captured by a frozen (Approved/Posted/Executed)
    // supplemental is settled and is not shown here (see the Supplemental Payments page).
    const stateOf = (pp)=> (typeof supplementalPlanState==='function') ? supplementalPlanState(pp) : {needsGeneration:false, open:null, elig:{amount:0}};
    const actionable = committed.map(x=>({x, st:stateOf(x.pp)})).filter(o=>o.st.needsGeneration || o.st.open);
    if(actionable.length){
      const rowHTML = actionable.map(({x,st})=>{
        const amt = st.elig && st.elig.amount ? st.elig.amount : x.drift.addedAmount;
        const action = st.open
          ? `<button class="btn btn-sm" data-supp-open="${st.open.id}">Open ${escapeHtml(st.open.status)} Supplemental</button>`
          : `<button class="btn btn-sm btn-accent" data-supp-gen="${x.pp.id}">Generate Supplemental (${fmtIDR(amt)})</button>`;
        return `<div class="insight-item warn"><b>${escapeHtml(x.pp.employeeName||'—')}</b> — ${escapeHtml(x.pp.month)} ${x.pp.year}: +${fmtIDR(amt)} unpaid overtime <span style="margin-left:8px;">${action}</span></div>`;
      }).join('');
      html += `<div class="card ot-drift-banner" style="margin-bottom:14px;border-left:3px solid var(--brick);">
        <h3>Approved overtime added after payroll was posted <span class="tag">${actionable.length}</span></h3>
        <p style="margin:4px 0 2px;">Approved overtime was added after payroll was posted. The original payroll remains unchanged.</p>
        <p style="margin:0 0 8px;"><b>Settle it with a supplemental payment — the base payroll is never modified.</b></p>
        <div class="insight-list">${rowHTML}</div>
      </div>`;
    }
  }
  return html;
}

/* ============================================================
   PAYROLL INTELLIGENCE WORKSPACE UI (v2.6.3)
   Operational, workflow-oriented payroll: one active period,
   KPI cards, deterministic health, summary, a read-only worksheet,
   bulk lifecycle actions with confirmations, and a period lock.
   Payroll = Base Salary + Approved Overtime (single source of truth):
   salary is edited on the Contract, overtime in Overtime, and both
   flow into the read-only Total here. Lifecycle stages, health, lock
   and summary helpers live in payroll-ops-engine.js.
   ============================================================ */
function payrollSelSet(monthKey){ if(!State.payrollSel[monthKey]) State.payrollSel[monthKey]=new Set(); return State.payrollSel[monthKey]; }
/* PR-5J "The Accountant" — the ONE official UI seam for a pre-posting PayrollPlan
   lifecycle transition. Single-record and bulk callers both route through the
   Domain command (payroll.lifecycle.transition); no UI ever calls the handler
   (transitionPayrollLifecycle) directly. On a typed business failure it surfaces
   the same user-facing messaging the former setPayrollStatus showed. Returns true
   only on success. */
async function requestPayrollLifecycle(id, targetStatus){
  const outcome = await Domain.command('payroll.lifecycle.transition', id, targetStatus);
  if(outcome && outcome.success) return true;
  const err = outcome && outcome.error;
  if(err==='PayrollPeriodLocked') showWarning('This payroll period is locked — unlock it to change status.');
  else if(err==='PayrollCommittedImmutable') showWarning('Committed payroll cannot change status here — use the adjustment workflow.');
  else if(err && err!=='PayrollPlanNotFound') showWarning('Could not change payroll status: '+err+'.');
  return false;
}
// Compact "2 Locked; 1 Illegal…" summary of per-record lifecycle command failures for bulk reporting.
function payrollBulkFailureSummary(failures){
  const byErr={};
  (failures||[]).forEach(f=>{ const e=f.error||'Unknown'; byErr[e]=(byErr[e]||0)+1; });
  return Object.entries(byErr).map(([e,n])=>`${n} ${e}`).join('; ');
}
// Cycle-status pill (used by the dashboard payroll strip).
function cycleStatusPill(cs){
  const map={'Not Generated':'pill-status-archived','Draft':'pill-status-planned','In Review':'pill-status-scheduled','Ready to Commit':'pill-status-partial','Committed':'pill-status-completed','Partially Executed':'pill-status-partial','Fully Executed':'pill-status-completed'};
  return `<span class="pill ${map[cs]||'pill-other'}">${escapeHtml(cs)}</span>`;
}

/* ---------- read-only worksheet (incremental search preserved from v2.6.1) ---------- */
function payrollRowsFiltered(monthKey){
  const f=State.payrollFilter;
  let rows = payrollPlansForMonth(monthKey, true).filter(p=>p.status!=='Cancelled');
  if(f.search.trim()){ const s=normStr(f.search); rows=rows.filter(p=>[p.employeeName,p.contractNumber,p.department].some(x=>normStr(x||'').includes(s))); }
  if(f.department!=='all') rows=rows.filter(p=>(p.department||'')===f.department);
  if(f.status!=='all') rows=rows.filter(p=>payrollStage(p)===f.status);
  rows.sort((a,b)=>String(a.employeeName||'').localeCompare(String(b.employeeName||'')));
  return rows;
}
function payrollWorksheetBodyHTML(monthKey, sel){
  return payrollRowsFiltered(monthKey).map(p=>payrollWorksheetRowHTML(p, sel)).join('') || '<tr><td colspan="9" class="empty">No payroll rows match.</td></tr>';

// v2.6.8 (Issue 1) — the header "select all shown" checkbox syncs with ALL visible rows
// (the selection model is generic): checked when all are selected, indeterminate when
// some are, unchecked/disabled when there are none.
function syncPayrollHeaderCheckbox(monthKey, sel){
  const cb=document.getElementById('pfAll'); if(!cb) return;
  const rows=payrollRowsFiltered(monthKey);
  const selN=rows.filter(p=>sel.has(p.id)).length;
  cb.checked = rows.length>0 && selN===rows.length;
  cb.indeterminate = selN>0 && selN<rows.length;
  cb.disabled = rows.length===0;

function bindPayrollRows(area, monthKey, main, sel){

  }));
  bindHRActions(area);
  updCount();
}

function payrollWorksheetRowHTML(p, sel){

    ? '<span class="pill pill-status-cancelled" title="Approved overtime added after this payroll was posted — a supplemental payment is required">OT after posting</span> '
    : '<span class="pill pill-status-partial" title="Approved overtime changed since this payroll — regenerate to include it">OT drift</span> ') : '';

function openPayrollOvertimeBreakdown(id){

function openCommitPayrollModal(monthKey, main){
  if(isPayrollLocked(monthKey)){ showWarning('This period is locked — finance posting cannot run again.'); return; }
  const sel=payrollSelSet(monthKey);
  // v2.6.8 — Post owns its eligibility (Approved). With an explicit selection, partition it
  // and carry the ineligible rows through as reported skips; with no selection, fall back to
  // every Approved row in the period (nothing to report as a selection skip).
  let readyIds, selectionSkips=[];
  if(sel.size){
    const part=partitionPayrollSelection([...sel], 'post');
    readyIds=part.eligible;
    selectionSkips=part.skipped.map(x=>({name:x.name, reasons:[x.reason]}));
    if(!readyIds.length){ showWarning(`No selected rows are eligible for Post.\nPost applies only to Approved payroll.${part.skipped.length?`\nSkipped: ${payrollSkipSummary(part.skipped)}.`:''}`); return; }
  } else {

    if(!readyIds.length){ showWarning('No Approved payroll to post. Only Approved rows can be posted — approve rows first.'); return; }

/* ============================================================
   SUPPLEMENTAL PAYROLL ENGINE (v2.7.0)
   A separate accounting document that settles overtime approved AFTER the
   base payroll became immutable (Posted/Executed). It NEVER mutates the base
   payroll totals, its finance transaction, or its execution history.

   Source (v1): overtime_drift only — the authoritative delta is the existing
   payrollOvertimeDrift(pp) calculation (no second overtime-delta formula).
   Lifecycle: Draft → Review → Approved → Posted → Executed (+ Cancelled).
   Store: tam_supplemental_payments_v1 (additive; SCHEMA_VERSION unchanged, 6).

   Business rules live here (centralized helpers), not in UI handlers.
   ============================================================ */
const SUPPLEMENTAL_STATUSES = ['Draft','Review','Approved','Posted','Executed','Cancelled'];
const SUPPLEMENTAL_SOURCE_TYPES = ['overtime_drift']; // extensible; v2.7.0 supports overtime drift only
const SUPPLEMENTAL_OPEN_STATUSES = ['Draft','Review'];           // editable / may refresh
const SUPPLEMENTAL_FROZEN_STATUSES = ['Approved','Posted','Executed']; // amount + source frozen
const SUPPLEMENTAL_STATUS_META = {
  'Draft':    {pill:'pill-status-planned'},
  'Review':   {pill:'pill-status-scheduled'},
  'Approved': {pill:'pill-status-partial'},
  'Posted':   {pill:'pill-status-completed'},
  'Executed': {pill:'pill-status-completed'},
  'Cancelled':{pill:'pill-status-cancelled'},
};
function supplementalStatusPill(supp){ return hrStatusBadge(supp&&supp.status||'Draft', SUPPLEMENTAL_STATUS_META); }
function supplementalSourceLabel(t){ return t==='overtime_drift' ? 'Overtime (post-payroll)' : (t||'—'); }

/* ---------- lookups & partitioning ---------- */
function supplementalById(id){ return (State.supplementalPayments||[]).find(s=>s.id===id) || null; }
function supplementalsForPlan(planId){ return (State.supplementalPayments||[]).filter(s=>s.payrollPlanId===planId); }
function supplementalsForEmployee(empId){ return (State.supplementalPayments||[]).filter(s=>s.employeeId===empId); }
function activeSupplementalsForPlan(planId){ return supplementalsForPlan(planId).filter(s=>s.status!=='Cancelled'); }
// The single OPEN (Draft/Review) supplemental for a plan+source, if any (rule 6: at most one open).
function openSupplementalForPlan(pp, sourceType){
  sourceType = sourceType || 'overtime_drift';
  return supplementalsForPlan(pp.id).find(s=>s.sourceType===sourceType && SUPPLEMENTAL_OPEN_STATUSES.includes(s.status)) || null;
}
function supplementalTxnOf(supp){ return supp && supp.financeTransactionId ? findTxn(supp.financeTransactionId) : null; }

/* ---------- money (reuse the drift per-ID formula; no second money system) ----------
   Same per-ID basis as payrollOvertimeDrift: approvedAmount when set, else calculatedAmount. */
function supplementalAmountForIds(ids){
  return (ids||[]).reduce((sum,id)=>{ const o=overtimeById(id); return sum + (o?num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount):0); }, 0);
}

/* ---------- duplicate prevention & eligible unpaid overtime (rules 1–5) ----------
   Overtime already captured by any NON-cancelled supplemental for this plan is
   excluded, so an overtime ID is never paid twice. */
function capturedOvertimeIdsForPlan(planId, exceptSupplementalId){
  const set = new Set();
  activeSupplementalsForPlan(planId).forEach(s=>{ if(s.id!==exceptSupplementalId) (s.sourceOvertimeIds||[]).forEach(id=>set.add(id)); });
  return set;
}
function overtimeIdCapturedAnywhere(oid){
  return (State.supplementalPayments||[]).some(s=>s.status!=='Cancelled' && (s.sourceOvertimeIds||[]).includes(oid));
}
// v2.7.1 — global duplicate guard: is this overtime ID already captured by ANY other
// non-cancelled supplemental anywhere in the store (across all payroll plans)? Generation
// and refresh both use this so an overtime record can never be paid twice, even when two
// payroll plans reference the same overtime ID. Excludes the supplemental being refreshed.
function overtimeCapturedByOtherSupplemental(oid, exceptSupplementalId){
  return (State.supplementalPayments||[]).some(s=>s.status!=='Cancelled' && s.id!==exceptSupplementalId && (s.sourceOvertimeIds||[]).includes(oid));
}
// Unpaid, uncaptured overtime that can seed/refresh a delta for this plan.
function supplementalEligibleOvertime(pp, exceptSupplementalId){
  const drift = payrollOvertimeDrift(pp);
  if(!drift) return {ids:[], amount:0, drift:null, committed:false};
  const captured = capturedOvertimeIdsForPlan(pp.id, exceptSupplementalId);
  // Exclude IDs captured for this plan AND any ID captured by another supplemental anywhere
  // (cross-plan global guard) — prevents double payment when two plans share an overtime ID.
  const ids = drift.addedIds.filter(id=>!captured.has(id) && !overtimeCapturedByOtherSupplemental(id, exceptSupplementalId));
  return {ids, amount:supplementalAmountForIds(ids), drift, committed:drift.committed};
}

/* ---------- audit-safe company-account snapshot ---------- */
function supplementalAccountSnapshot(acctId){
  const a = acctId ? companyAccountById(acctId) : null;
  return a
    ? {companyAccountId:a.id, companyAccountSnapshotLabel:a.label, companyAccountSnapshotBank:a.bankName||'', companyAccountSnapshotPurpose:a.purpose||''}
    : {companyAccountId:null, companyAccountSnapshotLabel:null, companyAccountSnapshotBank:null, companyAccountSnapshotPurpose:null};
}

/* ---------- generation (explicit; never during startup/background render) ----------
   Only for base payroll that is already committed (Posted/Executed) — supplemental
   settles overtime approved AFTER immutability. Idempotent: if an open Draft/Review
   already exists, it is returned (not duplicated). Zero/negative delta → no record. */
async function generateSupplementalForPlan(planId){
  const pp = payrollPlanById(planId);
  if(!pp) return {ok:false, reason:'Payroll plan not found.'};
  const elig = supplementalEligibleOvertime(pp);
  if(!elig.drift) return {ok:false, reason:'No overtime drift — this payroll already matches its approved overtime.'};
  if(!elig.committed) return {ok:false, reason:'This payroll is not Posted/Executed — regenerate the base payroll instead of creating a supplemental.'};
  const open = openSupplementalForPlan(pp, 'overtime_drift');
  if(open) return {ok:true, existing:true, supplemental:open};
  if(!elig.ids.length || num(elig.amount)<=0) return {ok:false, reason:'No unpaid, uncaptured overtime — nothing to settle.'};
  const now = new Date().toISOString();
  const supp = Object.assign({
    id: uid('supp'),
    employeeId: pp.employeeId, employeeName: pp.employeeName,
    payrollPlanId: pp.id, payrollPeriod: pp.monthKey, periodLabel: `${pp.month} ${pp.year}`,
    sourceType: 'overtime_drift', sourceOvertimeIds: elig.ids.slice(),
    amount: elig.amount, status: 'Draft',
    financeTransactionId: null, executionId: null, notes: '',
    createdAt: now, updatedAt: now, reviewedAt: null, approvedAt: null, postedAt: null, executedAt: null,
    createdBy: '—', auditVersion: 1,
    history: [{event:'create', ts:now, note:`Draft supplemental — ${elig.ids.length} unpaid overtime record(s), ${fmtIDR(elig.amount)}`}],
  }, supplementalAccountSnapshot(null));
  State.supplementalPayments.push(supp);
  await persistSupplementalPayments();
  logActivity({type:'supplemental.create', module:'Supplemental Payroll', entity:pp.employeeName, entityId:supp.id,
    desc:`Created supplemental (Draft) — ${fmtIDR(supp.amount)} for ${supp.periodLabel}`,
    refs:{employeeId:pp.employeeId, payrollPlanId:pp.id, supplementalId:supp.id, monthKey:pp.monthKey}});
  return {ok:true, existing:false, supplemental:supp};
}

/* ---------- explicit, audited refresh (Draft/Review only; never Approved+) ---------- */
async function refreshSupplemental(id){
  const supp = supplementalById(id);
  if(!supp) return {ok:false, reason:'Supplemental not found.'};
  if(!SUPPLEMENTAL_OPEN_STATUSES.includes(supp.status)) return {ok:false, reason:'Only Draft or Review supplementals can be refreshed.'};
  const pp = payrollPlanById(supp.payrollPlanId);
  if(!pp) return {ok:false, reason:'Linked payroll plan is missing.'};
  const drift = payrollOvertimeDrift(pp);
  const capturedByOthers = capturedOvertimeIdsForPlan(pp.id, supp.id);
  const eligibleIds = (drift ? drift.addedIds : []).filter(x=>!capturedByOthers.has(x) && !overtimeCapturedByOtherSupplemental(x, supp.id));
  const added   = eligibleIds.filter(x=>!(supp.sourceOvertimeIds||[]).includes(x));
  const removed = (supp.sourceOvertimeIds||[]).filter(x=>!eligibleIds.includes(x));
  if(!added.length && !removed.length) return {ok:true, changed:false, supplemental:supp};
  supp.sourceOvertimeIds = eligibleIds.slice();
  supp.amount = supplementalAmountForIds(supp.sourceOvertimeIds);
  supp.updatedAt = new Date().toISOString();
  (supp.history=supp.history||[]).push({event:'refresh', ts:supp.updatedAt, note:`Refreshed: +${added.length} / −${removed.length} overtime record(s) → ${fmtIDR(supp.amount)}`});
  await persistSupplementalPayments();
  logActivity({type:'supplemental.refresh', module:'Supplemental Payroll', entity:supp.employeeName, entityId:supp.id,
    desc:`Refreshed supplemental — ${fmtIDR(supp.amount)} (${supp.sourceOvertimeIds.length} record(s))`,
    refs:{employeeId:supp.employeeId, payrollPlanId:supp.payrollPlanId, supplementalId:supp.id}});
  return {ok:true, changed:true, added:added.length, removed:removed.length, supplemental:supp};
}

/* ---------- lifecycle transitions (validate status; audit; timestamps) ---------- */
const SUPPLEMENTAL_TRANSITIONS = {
  submit:       {from:['Draft'],    to:'Review',   event:'review',        tsField:'reviewedAt', label:'Submit for Review'},
  returnDraft:  {from:['Review'],   to:'Draft',    event:'return_draft',  tsField:null,         label:'Return to Draft'},
  approve:      {from:['Review'],   to:'Approved', event:'approve',       tsField:'approvedAt', label:'Approve'},
  returnReview: {from:['Approved'], to:'Review',   event:'return_review', tsField:null,         label:'Return to Review'},
  cancel:       {from:['Draft','Review'], to:'Cancelled', event:'cancel', tsField:null,         label:'Cancel'},
};
function canTransitionSupplemental(supp, action){
  if(!supp) return false;
  if(action==='post') return supp.status==='Approved' && !supp.financeTransactionId;
  if(action==='cancel') return SUPPLEMENTAL_OPEN_STATUSES.includes(supp.status) && !supp.financeTransactionId;
  const t = SUPPLEMENTAL_TRANSITIONS[action];
  return !!(t && t.from.includes(supp.status));
}
async function transitionSupplemental(id, action){
  const supp = supplementalById(id);
  if(!supp) return {ok:false, reason:'Supplemental not found.'};
  const t = SUPPLEMENTAL_TRANSITIONS[action];
  if(!t) return {ok:false, reason:'Unknown transition.'};
  if(!t.from.includes(supp.status)) return {ok:false, reason:`Cannot ${action} from ${supp.status}.`};
  if(action==='approve' && (!(supp.sourceOvertimeIds||[]).length || num(supp.amount)<=0)) return {ok:false, reason:'Nothing to approve (zero amount).'};
  if(action==='cancel' && supp.financeTransactionId) return {ok:false, reason:'A posted supplemental cannot be cancelled.'};
  const now = new Date().toISOString();
  // v2.7.1 — freeze an immutable source-overtime snapshot no later than Approved, so the
  // Supplemental Detail source table survives later edits/deletion of the source overtime.
  if(action==='approve' && !supp.sourceOvertimeSnapshot && typeof buildPayrollOvertimeSnapshot==='function'){
    supp.sourceOvertimeSnapshot = buildPayrollOvertimeSnapshot(supp.sourceOvertimeIds||[]);
  }
  supp.status = t.to; supp.updatedAt = now;
  if(t.tsField && !supp[t.tsField]) supp[t.tsField] = now;
  (supp.history=supp.history||[]).push({event:t.event, ts:now, note:`${t.label} → ${t.to}`});
  await persistSupplementalPayments();
  logActivity({type:'supplemental.'+t.event, module:'Supplemental Payroll', entity:supp.employeeName, entityId:supp.id,
    desc:`${supp.employeeName} supplemental → ${t.to} (${fmtIDR(supp.amount)})`,
    refs:{employeeId:supp.employeeId, payrollPlanId:supp.payrollPlanId, supplementalId:supp.id}});
  return {ok:true, supplemental:supp};
}

/* ---------- account selection & notes (Draft/Review/Approved, before posting) ---------- */
async function setSupplementalAccount(id, acctId){
  const supp = supplementalById(id); if(!supp) return {ok:false, reason:'Supplemental not found.'};
  if(['Posted','Executed','Cancelled'].includes(supp.status)) return {ok:false, reason:'The company account is locked after posting.'};
  Object.assign(supp, supplementalAccountSnapshot(acctId||null));
  supp.updatedAt = new Date().toISOString();

}
async function setSupplementalNotes(id, notes){

  if(['Posted','Executed','Cancelled'].includes(supp.status)) return {ok:false, reason:'Notes are locked once the supplemental is Posted.'};
  supp.notes = (notes||'').trim(); supp.updatedAt = new Date().toISOString();

}

/* ---------- posting to finance (Phase D) — reuse the existing transaction model ----------
   Creates exactly ONE Planned finance transaction, linked both ways, with an immutable
   company-account snapshot. Idempotent: a supplemental that already has a finance
   transaction is never posted twice. Never touches base payroll. */
function supplementalCommitTxn(supp){
  const ts = new Date().toISOString();
  const mo = keyToMonthObj(supp.payrollPeriod);
  const uraian = `Supplemental Payroll — ${supp.employeeName} · ${supp.periodLabel} · overtime`;
  return {id:uid('pay'), monthKey:supp.payrollPeriod, month:mo.month, year:mo.year, monthNum:mo.monthNum,
    category:State.settings.defaultPayrollCategory||'Gaji', categoryCode:'A', no:null, uraian, vol:1, satuan:'bulan', hargaSatuan:num(supp.amount),
    planned:num(supp.amount), actual:null, type:'expense', txnDate:null, source:'supplemental', unplanned:false,
    scheduledDate:null, paymentMethod:null, bankAccount:supp.companyAccountSnapshotLabel||null, referenceNumber:null,
    notes:'Supplemental payroll (overtime settlement)', vendor:null,
    executionId:null, executionTimestamp:null, execution:null, status:'planned',
    employeeId:supp.employeeId, contractId:null, payrollPlanId:supp.payrollPlanId,
    supplementalId:supp.id, supplementalKind:supp.sourceType,
    companyAccountId:supp.companyAccountId||null,
    overtimeIds:(supp.sourceOvertimeIds||[]).slice(), overtimeAmount:num(supp.amount),
    payrollMeta:{employeeName:supp.employeeName, supplemental:true, period:supp.periodLabel},
    history:[{event:'created', ts, note:'Created from Supplemental Payroll posting'}]};
}
async function postSupplemental(id){
  const supp = supplementalById(id); if(!supp) return {ok:false, reason:'Supplemental not found.'};
  if(supp.status!=='Approved') return {ok:false, reason:'Only Approved supplementals can be posted.'};
  if(supp.financeTransactionId) return {ok:false, reason:'This supplemental is already posted.'}; // idempotent
  if(!supp.companyAccountId) return {ok:false, reason:'Select an Active company account before posting.'};
  const acct = companyAccountById(supp.companyAccountId);
  if(!acct || acct.status!=='Active') return {ok:false, reason:'The selected company account is not Active.'};
  if(!(supp.sourceOvertimeIds||[]).length || num(supp.amount)<=0) return {ok:false, reason:'Nothing to post (zero amount).'};
  Object.assign(supp, supplementalAccountSnapshot(acct.id)); // freeze the snapshot at post time
  const now = new Date().toISOString();
  const txn = supplementalCommitTxn(supp);
  // v2.7.1 (Section 15) — coordinated persistence to avoid half-written linkage/orphans.
  // 1) create + persist the transaction first; roll back in-memory if it does not persist.
  State.txns.push(txn);
  const txnOk = await persist();
  if(!txnOk){ State.txns = State.txns.filter(t=>t.id!==txn.id); return {ok:false, reason:'Posting failed — the transaction could not be saved. Nothing was changed.'}; }
  // 2) link the supplemental and persist it; on failure, undo the transaction so no orphan remains.
  supp.financeTransactionId = txn.id; supp.status = 'Posted'; supp.postedAt = now; supp.updatedAt = now;
  (supp.history=supp.history||[]).push({event:'post', ts:now, note:`Posted to finance — Planned ${fmtIDR(supp.amount)} (${acct.label})`});
  const suppOk = await persistSupplementalPayments();
  if(!suppOk){
    // Roll back the finance transaction so no orphan remains, and VERIFY the rollback persisted.
    supp.financeTransactionId = null; supp.status = 'Approved'; supp.postedAt = null; (supp.history||[]).pop();
    State.txns = State.txns.filter(t=>t.id!==txn.id);
    const rolledBack = await persist();
    if(!rolledBack){
      // Storage is failing both ways. In memory nothing is posted; storage still holds the
      // transaction (persisted a moment ago) but NOT the supplemental link — so on reload it is a
      // detectable orphan transaction (Integrity Check → supplemental-orphan-transaction), never an
      // orphan supplemental (the supplemental write failed, so it stays Approved in storage).
      return {ok:false, unrecoverable:true, orphanTxnId:txn.id,
        reason:'Posting failed and the automatic rollback could not be saved (storage error). The supplemental is NOT posted. A stray finance transaction may remain until you reload — run Integrity Check to detect and remove it. Do not retry until storage is healthy.'};
    }
    return {ok:false, reason:'Posting failed — the supplemental could not be saved. The transaction was rolled back; nothing was changed.'};
  }
  logActivity({type:'supplemental.post', module:'Supplemental Payroll', entity:supp.employeeName, entityId:supp.id,
    desc:`Posted supplemental to finance — ${fmtIDR(supp.amount)} (${acct.label})`,
    refs:{employeeId:supp.employeeId, payrollPlanId:supp.payrollPlanId, supplementalId:supp.id, transactionId:txn.id, monthKey:supp.payrollPeriod}});
  return {ok:true, supplemental:supp, txn};
}

/* ---------- execution linkage (Phase E) — hook called from executeTransaction ----------
   When the linked Planned transaction is executed (fully) via the Execution Center, the
   supplemental becomes Executed. Idempotent: an already-Executed supplemental is never
   re-closed, so repeated execution cannot double-pay. Base payroll is untouched. */
async function linkSupplementalExecution(t){
  if(!t || !t.supplementalId) return {ok:true, changed:false};
  const supp = supplementalById(t.supplementalId); if(!supp) return {ok:true, changed:false};
  if(supp.status==='Executed') return {ok:true, changed:false}; // idempotent guard
  if(!['completed','archived'].includes(statusOf(t))) return {ok:true, changed:false}; // only when fully paid
  // v2.7.2 — snapshot the pre-execution supplemental so a failed persist can be reverted in
  // memory (memory matches storage), instead of misrepresenting it as Executed.
  const prev = {status:supp.status, executionId:supp.executionId, executedAt:supp.executedAt, updatedAt:supp.updatedAt, historyLen:(supp.history||[]).length};
  const now = new Date().toISOString();
  supp.status = 'Executed';
  supp.executionId = (t.execution && t.execution.executionId) || t.executionId || null;
  supp.executedAt = now; supp.updatedAt = now;
  (supp.history=supp.history||[]).push({event:'execute', ts:now, note:`Executed via Execution Center — ${fmtIDR(num(t.actual))}`});
  const ok = await persistSupplementalPayments();
  if(!ok){
    // The committed transaction stays executed (never rewritten). Revert the supplemental in
    // memory to match storage (still Posted) and report a clear, detectable remediation state.
    supp.status = prev.status; supp.executionId = prev.executionId; supp.executedAt = prev.executedAt; supp.updatedAt = prev.updatedAt;
    if((supp.history||[]).length > prev.historyLen) supp.history.length = prev.historyLen;
    return {ok:false, reason:'The payment was recorded, but the linked supplemental could not be updated to Executed (storage error). It remains Posted and will reconcile the next time you open/execute it — run Integrity Check if it persists.'};
  }
  logActivity({type:'supplemental.execute', module:'Supplemental Payroll', entity:supp.employeeName, entityId:supp.id,
    desc:`Supplemental executed — ${fmtIDR(num(t.actual))} (${supp.periodLabel})`,
    refs:{employeeId:supp.employeeId, supplementalId:supp.id, transactionId:t.id, executionId:supp.executionId}});
  return {ok:true, changed:true};
}

/* ---------- startup recovery: pre-2.7.2 failed-post orphan supplementals ----------
   The v2.7.1 persistHR bug made postSupplemental ALWAYS take the failure path even when the
   supplemental write actually succeeded: it left the supplemental persisted as Posted with a
   financeTransactionId while rolling the transaction OUT of storage → an orphaned Posted
   supplemental pointing at a transaction that no longer exists. This detects ONLY that exact,
   known-safe pattern and restores the record to a re-postable Approved state, with an audit
   entry. It never fabricates or alters any financial amount, never touches Executed records, and
   never touches a supplemental whose transaction still exists. Anything ambiguous is left intact
   for Integrity Check to surface. Idempotent and self-limiting: once restored the pattern no
   longer matches, so it is safe to run on every boot. */
async function recoverSupplementalOrphans(){
  try{
    const supps = State.supplementalPayments||[];
    let recovered = 0; const now = new Date().toISOString();
    supps.forEach(s=>{
      const isFailedPostOrphan = s && s.status==='Posted' && s.financeTransactionId
        && !findTxn(s.financeTransactionId) && !s.executionId && !s.executedAt;
      if(isFailedPostOrphan){
        const lostTxnId = s.financeTransactionId;
        s.financeTransactionId = null; s.status = 'Approved'; s.postedAt = null; s.updatedAt = now;
        (s.history=s.history||[]).push({event:'recover', ts:now,
          note:`Auto-recovered from a failed post (linked transaction ${lostTxnId} was never saved). Restored to Approved so it can be re-posted. No financial amount was changed.`});
        recovered++;
        if(typeof logActivity==='function') logActivity({type:'supplemental.recover', module:'Supplemental Payroll', entity:s.employeeName, entityId:s.id,
          desc:'Recovered orphaned supplemental (missing transaction) → Approved, re-postable',
          refs:{employeeId:s.employeeId, payrollPlanId:s.payrollPlanId, supplementalId:s.id}});
      }
    });
    if(recovered) await persistSupplementalPayments();
    return recovered;
  }catch(e){ console.error('recoverSupplementalOrphans skipped', e); return 0; }
}

/* ---------- per-plan supplemental state (for workspace/detail summaries) ---------- */
function supplementalPlanState(pp){
  if(!pp) return {needsGeneration:false, elig:{ids:[],amount:0}, records:[], counts:{}};
  const elig = supplementalEligibleOvertime(pp);
  const records = activeSupplementalsForPlan(pp.id);
  const counts = {Draft:0, Review:0, Approved:0, Posted:0, Executed:0};
  records.forEach(s=>{ if(counts[s.status]!=null) counts[s.status]++; });
  const open = openSupplementalForPlan(pp, 'overtime_drift');
  // "needs generation" only when the base payroll is committed, there IS eligible unpaid
  // overtime, and no open Draft/Review already holds it.
  const needsGeneration = !!(elig.committed && elig.ids.length && num(elig.amount)>0 && !open);
  return {needsGeneration, elig, records, counts, open};
}

function supplementalDetailActionsHTML(s){
  const btn=(act,label,cls)=>`<button class="btn ${cls||''}" data-supp-act="${act}" data-supp-id="${s.id}">${label}</button>`;
  let h='';
  if(canTransitionSupplemental(s,'submit')) h+=btn('submit','Submit for Review');
  if(canTransitionSupplemental(s,'returnDraft')) h+=btn('returnDraft','Return to Draft');
  if(canTransitionSupplemental(s,'approve')) h+=btn('approve','Approve','btn-accent');
  if(canTransitionSupplemental(s,'returnReview')) h+=btn('returnReview','Return to Review');
  if(SUPPLEMENTAL_OPEN_STATUSES.includes(s.status)) h+=btn('refresh','Refresh from Overtime');
  if(canTransitionSupplemental(s,'post')) h+=btn('post','Post to Finance','btn-accent');
  if(s.status==='Posted') h+=btn('exec','Open in Execution Center','btn-accent');
  if(canTransitionSupplemental(s,'cancel')) h+=btn('cancel','Cancel','btn-danger');
  return h || '<span class="dim" style="font-size:12px;">No actions available for this status.</span>';
}
function bindSupplementalDetailActions(main, s){
  main.querySelectorAll('[data-supp-act]').forEach(b=>b.addEventListener('click', ()=>handleSupplementalAction(b.dataset.suppAct, b.dataset.suppId)));
}
async function handleSupplementalAction(act, id){
  const s=supplementalById(id); if(!s) return;
  if(act==='detail'){ hrNavTo('supplementalDetail',{detailSupplementalId:id}); return; }
  if(act==='exec'){ const t=supplementalTxnOf(s); if(t) focusTransactionInExecutionCenter(t.id); else showWarning('Not posted to a transaction yet.'); return; }
  if(act==='post'){ openSupplementalPostModal(id); return; }
  if(act==='refresh'){ const r=await refreshSupplemental(id); if(r.ok&&r.changed) showSuccess(`Refreshed — now ${fmtIDR(supplementalById(id).amount)}.`); else if(r.ok) showSuccess('Already up to date.'); else showWarning(r.reason); render(); return; }
  const map={submit:'submit', returnDraft:'returnDraft', approve:'approve', returnReview:'returnReview', cancel:'cancel'};
  if(map[act]){
    if(act==='cancel' && !confirmAction('Cancel this supplemental? It will not be paid. This cannot be undone.')) return;
    const r=await transitionSupplemental(id, map[act]);
    if(r.ok) showSuccess(`Supplemental → ${r.supplemental.status}.`); else showWarning(r.reason);
    render();
  }
}
function openSupplementalPostModal(id){
  const s=supplementalById(id); if(!s) return;
  if(s.status!=='Approved'){ showWarning('Only Approved supplementals can be posted.'); return; }
  // v2.7.1 (Section 14) — company-account empty state. Disable Post and guide the user to
  // Bank Accounts instead of showing an unusable empty dropdown; distinguish "none" from
  // "all Inactive/Archived". The supplemental and its status are preserved; no transaction.
  const active = activeCompanyAccounts();
  const anyAccounts = (State.companyAccounts||[]).length>0;
  if(!active.length){
    const msg = anyAccounts
      ? 'All company accounts are Inactive or Archived. Activate one in Settings → Bank Accounts before posting.'
      : 'No Active company account is available.';
    openModalHTML(`<h3>Post Supplemental to Finance</h3>
      <div class="insight-item warn" style="display:block;margin-bottom:10px;">${escapeHtml(msg)}</div>
      <p class="hint">The supplemental stays Approved and no transaction is created. Add or activate a company account, then Post again.</p>
      <div class="modal-actions"><button type="button" class="btn" id="spPostCancel">Cancel</button><button type="button" class="btn btn-accent" id="spOpenBanks">Open Bank Accounts</button></div>`,
      {width:520, onMount:(root)=>{
        root.querySelector('#spPostCancel').addEventListener('click', closeModal);
        root.querySelector('#spOpenBanks').addEventListener('click', ()=>{ closeModal(); State.view='bankaccounts'; render(); });
      }});
    return;
  }
  openModalHTML(`<h3>Post Supplemental to Finance</h3>
    <div style="font-size:12.5px;line-height:1.9;">
      <div>Employee: <b>${escapeHtml(s.employeeName)}</b> · ${escapeHtml(s.periodLabel)}</div>
      <div>Amount: <b class="mono" style="color:var(--accent);">${fmtIDR(s.amount)}</b> · ${(s.sourceOvertimeIds||[]).length} overtime record(s)</div>
    </div>
    <form id="spPostForm"><div class="form-grid" style="grid-template-columns:1fr;margin-top:10px;">
      <div class="field"><label>Company Account (Active only)</label><select class="input" name="companyAccountId" required>${active.map(a=>`<option value="${a.id}" ${s.companyAccountId===a.id?'selected':''}>${escapeHtml(companyAccountLabel(a))}</option>`).join('')}</select></div>
    </div>
    <p class="hint" style="margin-top:6px;">Creates one Planned finance transaction (not executed). Execute it later in the Execution Center. The account is snapshotted and will not change if the account is later renamed.</p>
    <div class="modal-actions"><button type="button" class="btn" id="spPostCancel">Cancel</button><button type="submit" class="btn btn-accent">Post ${fmtIDR(s.amount)}</button></div></form>`,
    {width:560, onMount:(root)=>{
      root.querySelector('#spPostCancel').addEventListener('click', closeModal);
      root.querySelector('#spPostForm').addEventListener('submit', async ev=>{
        ev.preventDefault(); const acctId=new FormData(ev.target).get('companyAccountId');

        render();
      });
    }});
}

/* ============================================================
   DOMAIN LAYER — SHARED AGGREGATE HELPERS (PR-5F "The Sentinel")
   ------------------------------------------------------------
   A small toolkit of pure, domain-focused utilities extracted from the two
   operational aggregates (EmployeeContactAggregate, EmployeeEmploymentAggregate)
   where identical logic was duplicated. These are business-SUPPORT helpers
   only: they READ (existence) and TRANSFORM/VALIDATE plain values. They have
   NO side effects — no State mutation, no persistEmployees(), no history, no
   updatedAt, no render, no localStorage, no audit logging. Output is identical
   to the inlined logic they replace; this is a refactor, not a feature.

   This is deliberately NOT a framework: no base/abstract aggregate, factory,
   registry, inheritance, dependency injection, or plugin surface. Just a
   handful of explicit functions the aggregates call directly.
   ============================================================ */

// Read-only Employee existence lookup (never mutates State). Returns the
// Employee record or null. Mirrors the guarded empById call both aggregates used.
function employeeExists(id) {
  return (typeof empById === 'function') ? (empById(id) || null) : null;
}

// Project `patch` onto the allowed field list, trimming string values. Every
// non-allowed property is discarded. Returns a fresh object; never mutates input.
function normalizeAllowedFields(patch, allow) {
  patch = patch || {};
  allow = allow || [];
  var clean = {};
  for (var i = 0; i < allow.length; i++) {
    var k = allow[i];
    if (Object.prototype.hasOwnProperty.call(patch, k)) {
      clean[k] = (patch[k] == null ? '' : String(patch[k])).trim();
    }
  }
  return clean;
}

// Pure membership test against a canonical enum list.
function validateEnum(value, allowed) {
  return !!allowed && allowed.indexOf(value) !== -1;
}

       the implementation authority (its own validation, mutation, persistence,
       and audit). This facade adds NO aggregate enforcement and NO
       authorization — those are explicitly not operational.
     - There is NO legacy dispatch/ask surface. `commandHandler`/`queryHandler`
       only RESOLVE (return) a handler; they never invoke it.
     - Every other read/write still calls the existing functions directly; only
       the one migrated query and the one migrated command are routed here.

   `commandHandler(name)` / `queryHandler(name)` RETURN the existing global
   function (or null) so callers — and the verifier — can confirm every
   registered handler name resolves to a real function. They never call it.
   ============================================================ */

const Domain = (function () {
  // Resolve a handler by name from the shared global scope. Returns the
  // function itself (never invokes it) or null if it is not a function.
  function resolve(name) {
    var g = (typeof window !== 'undefined') ? window : this;
    var fn = g ? g[name] : undefined;
    return (typeof fn === 'function') ? fn : null;
  }

  return Object.freeze({
    // Descriptive registries (single source of truth for the domain map).
    aggregates: DOMAIN_AGGREGATES,
    invariants: DOMAIN_INVARIANTS,
    commands: DOMAIN_COMMANDS,
    queries: DOMAIN_QUERIES,
    events: DOMAIN_EVENTS,

    // Read-only handler resolution: returns the existing handler function
    // for a registered command/query name, or null. Does NOT execute it.
    commandHandler: function (name) {
      var c = DOMAIN_COMMANDS[name];
      return c ? resolve(c.handler) : null;
    },
    queryHandler: function (name) {
      var q = DOMAIN_QUERIES[name];
      return q ? resolve(q.handler) : null;
    },

    // Operational query routing (PR-5B). Resolves and calls the registered
    // READ-ONLY handler and returns its typed result unchanged. Throws
    // clearly on an unknown query or missing handler — never a silent no-op.
    query: function (name) {
      var q = DOMAIN_QUERIES[name];
      if (!q) throw new Error('Unknown domain query: ' + name);
      var fn = resolve(q.handler);
      if (!fn) throw new Error('Domain query handler not found: ' + q.handler);
      return fn.apply(null, Array.prototype.slice.call(arguments, 1));
    },

    // Operational command routing (PR-5C.1 + PR-5D + PR-5E + PR-5G). Resolves the
    // registered handler and calls it EXACTLY ONCE, returning its typed outcome
    // unchanged. PR-5D: if the command declares a `boundary` aggregate, that
    // aggregate is the BUSINESS AUTHORITY — it runs first and either returns a
    // typed business failure (the handler is then NOT called) or the sanitized
    // input passed on to the handler. The handler remains the IMPLEMENTATION
    // AUTHORITY (its own validation, mutation, persistence, and audit).
    //
    // PR-5G: the aggregate's decision method and its sanitized-payload key are
    // declared per command (`boundaryMethod` / `boundaryPayload`), defaulting to
    // `prepare` / `patch` so the existing contact and employment commands route
    // exactly as before. Throws only on an unknown command / missing handler /
    // missing aggregate (programmer errors).
    command: function (name) {
      var c = DOMAIN_COMMANDS[name];
      if (!c) throw new Error('Unknown domain command: ' + name);
      var fn = resolve(c.handler);
      if (!fn) throw new Error('Domain command handler not found: ' + c.handler);
      var args = Array.prototype.slice.call(arguments, 1);
      if (c.boundary) {
        // Aggregates are top-level const objects exposed on the global object.
        var agg = (typeof window !== 'undefined') ? window[c.boundary] : null;
        var method = c.boundaryMethod || 'prepare';
        if (!agg || typeof agg[method] !== 'function') throw new Error('Aggregate not found: ' + c.boundary);
        var decision = agg[method](args[0], args[1]);   // business authority decides
        if (!decision || decision.ok !== true) {
          return { success: false, error: (decision && decision.error) || 'InvalidCommand' };
        }
        args = [args[0], decision[c.boundaryPayload || 'patch']];   // sanitized command input
      }
      return fn.apply(null, args);   // implementation authority mutates
    }
  });
})();

/* ============================================================
   PLATFORM LAYER — APPLICATION GATEWAY (PR-6A "The Gateway")
   ------------------------------------------------------------
   The FIRST Platform Layer boundary and the beginning of Milestone Delta. It is
   the single, permanent application entry point that future platform integrations
   (REST, CLI, background workers, AI agents, MCP, modern frontends, mobile) call.
   It sits ABOVE the Domain facade and does exactly three things: normalize a
   platform request, DELEGATE it to the Domain, and return a uniform envelope. It
   owns NO business behavior.

   CANONICAL CONTRACT (ATR-004 approved; SRD-062A):

   Request envelope:
     { kind: 'command' | 'query',   // default 'command'
       name: '<domain operation id>',
       args: [ ...positional args ], // canonical positional carrier (default [])
       meta?: { ... }                // OPTIONAL, extensible, OPAQUE cross-cutting context
     }

   Response envelope (uniform, always returned):
     { ok: <gateway execution status only>,
       kind, name,
       result?: <Domain result VERBATIM>,   // present when ok:true
       error?:  { source, code, message },  // present when ok:false
       meta?:   <request meta, transported back> }

   Error classes:
     - Structural  → malformed/invalid request. { ok:false, error.source:'gateway' }.
                     Never reaches the Domain.
     - Business    → the Domain result is returned UNCHANGED under `result` with
                     ok:true. The Gateway NEVER reinterprets a business outcome.
     - Fault       → an unexpected Domain exception is CAUGHT at the boundary.
                     { ok:false, error.source:'domain', code:'DOMAIN_FAULT' }.
                     No unhandled exception escapes the Platform boundary.

   INVARIANTS (enforced by the verifier): the Gateway is business-blind, stateless,
   deterministic (it generates no ids/timestamps — that is a transport-adapter
   concern), and transport-agnostic. It never owns business rules, authorization,
   persistence, history, rollback, Aggregate routing, or a Command registry. It
   transports and MAY carry `meta` but NEVER interprets it.
   ============================================================ */

const ApplicationGateway = (function () {
  // Structural request normalization ONLY (no business validation). Returns a
  // canonical { ok, kind, name, args, meta } or a typed structural rejection code.
  function normalize(request) {
    if (!request || typeof request !== 'object' || Array.isArray(request)) return { ok: false, code: 'INVALID_REQUEST', message: 'Request must be a plain object.' };
    var kind = (request.kind == null) ? 'command' : String(request.kind);
    if (kind !== 'command' && kind !== 'query') return { ok: false, code: 'INVALID_KIND', message: 'kind must be "command" or "query".' };
    if (typeof request.name !== 'string' || request.name.trim() === '') return { ok: false, code: 'INVALID_NAME', message: 'name must be a non-empty string.' };
    var args = (request.args === undefined) ? [] : request.args;
    if (!Array.isArray(args)) return { ok: false, code: 'INVALID_ARGS', message: 'args must be an array.' };
    // meta is OPTIONAL and OPAQUE; when present it must be a plain object. The
    // Gateway validates only its shape — it never inspects meta contents.
    var meta = request.meta;
    if (meta !== undefined && (meta === null || typeof meta !== 'object' || Array.isArray(meta))) return { ok: false, code: 'INVALID_META', message: 'meta, when present, must be a plain object.' };
    return { ok: true, kind: kind, name: request.name.trim(), args: args, meta: meta };
  }

  // Resolve the Domain facade (top-level const, not on window). The Gateway loads
  // after domain-layer.js, so Domain exists at call time.
  function resolveDomain() {
    if (typeof Domain !== 'undefined') return Domain;
    return (typeof window !== 'undefined') ? window.Domain : null;
  }

  return Object.freeze({
    // The single application entry point. Normalizes, DELEGATES to the Domain, and
    // resolves to the uniform response envelope. It is async because Domain command
    // handlers are async (return Promises); the Gateway AWAITS delegation so that
    // `result` is the resolved Domain outcome (verbatim), `ok` reflects actual
    // completion, and both synchronous throws and async rejections are caught as a
    // fault — nothing escapes the Platform boundary. Never bypasses the Domain;
    // owns no business behavior.
    execute: async function (request) {
      var n = normalize(request);
      if (!n.ok) {
        // STRUCTURAL error — never reaches the Domain. Echo the caller's own
        // kind/name/meta for observability where safely available.
        var se = { ok: false, error: { source: 'gateway', code: n.code, message: n.message } };
        if (request && typeof request === 'object' && !Array.isArray(request)) {
          if (request.kind !== undefined) se.kind = request.kind;
          if (request.name !== undefined) se.name = request.name;
          if (request.meta !== undefined) se.meta = request.meta;
        }
        return se;
      }
      var domain = resolveDomain();
      if (!domain) {
        var du = { ok: false, kind: n.kind, name: n.name, error: { source: 'gateway', code: 'DOMAIN_UNAVAILABLE', message: 'Domain facade is unavailable.' } };
        if (n.meta !== undefined) du.meta = n.meta;
        return du;
      }
      try {
        // DELEGATE — never bypass. Await so an async handler's resolved value (or
        // rejection) is handled here; the Domain's typed result is returned VERBATIM.
        var result = (n.kind === 'command')
          ? await domain.command.apply(domain, [n.name].concat(n.args))
          : await domain.query.apply(domain, [n.name].concat(n.args));
        var ok = { ok: true, kind: n.kind, name: n.name, result: result };
        if (n.meta !== undefined) ok.meta = n.meta;   // transport meta back, verbatim (opaque)
        return ok;
      } catch (err) {
        // FAULT — an unexpected Domain exception (synchronous throw OR async
        // rejection) is caught at the boundary and enveloped so nothing escapes.
        var fe = { ok: false, kind: n.kind, name: n.name, error: { source: 'domain', code: 'DOMAIN_FAULT', message: (err && err.message) ? String(err.message) : 'Domain fault.' } };
        if (n.meta !== undefined) fe.meta = n.meta;
        return fe;
      }
    }
  });
})();

// Expose on the global object so future platform clients can resolve the single
// entry point by name. Classic shared global scope; no eval, no module system.
if (typeof window !== 'undefined') { window.ApplicationGateway = ApplicationGateway; }

/* ============================================================
   TRANSPORT LAYER — TRANSPORT ADAPTER (PR-7A "The Transport")
   ------------------------------------------------------------
   The canonical application TRANSPORT boundary, immediately ABOVE the
   Application Gateway and the first operational Platform expansion of Milestone
   Delta. Every future transport (REST, CLI, background worker, AI agent / MCP,
   modern frontend, mobile) enters through here and reaches business behavior
   ONLY by delegating to the Application Gateway. It owns NO business behavior,
   NO persistence, NO rollback, NO history, and NO UI.

   Flow:  Browser
            ↓
          TransportAdapter        (this layer — canonical transport boundary)
            ↓
          ApplicationGateway      (the exclusive Platform boundary)
            ↓
          Domain → Aggregate → Handler → Persistence

   CONTRACT (delegates the canonical Platform contract; ATR-004 / SRD-062A):

     Request  — the canonical Gateway request, passed through UNCHANGED:
                { kind: 'command' | 'query', name, args: [ ... ], meta? }
                The Transport does NOT redefine Gateway request semantics.

     Response — the canonical Platform response, returned VERBATIM:
                { ok, kind, name, result?, error?: { source, code, message }, meta? }
                The Transport does NOT reinterpret business results and does NOT
                modify Domain responses.

   The Transport adds exactly ONE thing: a uniform, transport-level failure
   envelope for the two — and only two — outcomes it is permitted to classify:

     - INVALID_TRANSPORT_REQUEST → the call is not a usable request object.
                                   { ok:false, error.source:'transport' }.
                                   Never reaches the Gateway.
     - TRANSPORT_UNAVAILABLE     → the Application Gateway is not resolvable.
                                   { ok:false, error.source:'transport' }.

   All Platform and Domain outcomes (structural gateway rejections, business
   results, DOMAIN_FAULT) are returned EXACTLY as the Gateway produced them.
   `meta` is opaque and is carried by the Gateway; the Transport neither reads
   nor rewrites it.

   INVARIANTS (enforced by the verifier): the Transport is business-blind,
   stateless, deterministic (generates no ids/timestamps/randomness), and
   delegates SOLELY to ApplicationGateway — never to the Domain facade, an
   Aggregate, a Handler, or a Command/Query registry.
   ============================================================ */

const TransportAdapter = (function () {
  // Resolve the single Platform boundary (top-level const, not on window). The
  // Transport loads AFTER application-gateway.js, so ApplicationGateway exists
  // at call time; the window fallback keeps it resolvable in any host.
  function resolveGateway() {
    if (typeof ApplicationGateway !== 'undefined') return ApplicationGateway;
    return (typeof window !== 'undefined') ? window.ApplicationGateway : null;
  }

  return Object.freeze({
    // The single application transport entry point. Structurally validates the
    // call, DELEGATES the canonical request to the Application Gateway, and
    // returns the canonical Platform response VERBATIM. It is async because the
    // Gateway is async (Domain command handlers return Promises); the Transport
    // AWAITS delegation so the resolved Platform envelope is what the caller
    // receives. Never bypasses the Gateway; owns no business behavior.
    execute: async function (request) {
      // TRANSPORT STRUCTURAL VALIDATION — only enough to hand off safely. The
      // Gateway owns request-FIELD validation (kind/name/args/meta); the
      // Transport rejects ONLY a call that is not a usable request object, so it
      // never redefines or duplicates Platform semantics.
      if (!request || typeof request !== 'object' || Array.isArray(request)) {
        return { ok: false, error: { source: 'transport', code: 'INVALID_TRANSPORT_REQUEST', message: 'Transport request must be a plain object.' } };
      }
      var gateway = resolveGateway();
      if (!gateway || typeof gateway.execute !== 'function') {
        // TRANSPORT UNAVAILABLE — the Platform boundary is not reachable. Echo
        // the caller's own kind/name/meta for observability where safely available.
        var tu = { ok: false, error: { source: 'transport', code: 'TRANSPORT_UNAVAILABLE', message: 'Application Gateway is unavailable.' } };
        if (request.kind !== undefined) tu.kind = request.kind;
        if (request.name !== undefined) tu.name = request.name;
        if (request.meta !== undefined) tu.meta = request.meta;
        return tu;
      }
      // DELEGATE — the canonical request passes through UNCHANGED and the
      // canonical Platform response is returned VERBATIM. The Transport does not
      // read `result`, does not reinterpret a business outcome, and does not
      // rewrite the envelope. The Gateway already catches Domain faults, so its
      // fault/business/structural envelopes propagate through here unaltered.
      return await gateway.execute(request);
    }
  });
})();

// Expose on the global object so future transports resolve the single entry
// point by name. Classic shared global scope; no eval, no module system.
if (typeof window !== 'undefined') { window.TransportAdapter = TransportAdapter; }


/* ---------- init ---------- */
(async function init(){
  await loadState();
  applyTheme();               // reconcile the early pre-paint theme with loaded settings
  installGlobalUIHandlers();
  render();
  maybeShowFirstRunChoice();
})();

</script>
</body>
